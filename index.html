<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AX LAB A.I Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #ffffff; color: #334155; }
        .canvas-responsive { width: 100%; max-width: 320px; height: auto; aspect-ratio: 2 / 3; }
        @media (max-width: 768px) {
            .canvas-responsive { max-width: 180px; }
            body { padding: 1rem !important; }
            .bubble-container { padding: 1.25rem !important; border-radius: 1.25rem !important; }
            .max-w-7xl { gap: 0.75rem !important; }
            .grid { gap: 0.75rem !important; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-start p-6 md:p-12 select-none bg-slate-50 relative">

    <!-- 1. 시작 오버레이 -->
    <div id="start-overlay" class="fixed inset-0 bg-[#0f172a] z-[60] flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-300" onclick="initAppOnInteraction()">
        <h2 class="text-5xl font-extrabold tracking-tight mb-4 text-[#f8fafc]">AX LAB A.I Tutor</h2>
        <p class="text-slate-400 text-sm font-bold tracking-widest uppercase animate-pulse">Click anywhere to start</p>
    </div>

    <!-- 2. 무응답 1분 대기 모달 -->
    <div id="inactivity-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[70] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center mx-4">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">Are you there?</h3>
            <p class="text-sm text-slate-500 font-medium mb-8">No voice detected for 1 minute.</p>
            <div class="flex gap-3">
                <button onclick="handleModal('yes')" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">Yes</button>
                <button onclick="handleModal('no')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">No</button>
            </div>
        </div>
    </div>

    <!-- 3. API 키 설정 모달 -->
    <div id="apikey-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">API Configuration</h3>
            <p class="text-xs text-slate-500 font-medium mb-6 leading-relaxed">
                안전한 A.I 튜터 사용을 위해 본인의 Gemini API 키와 사용할 모델을 선택해주세요. 입력된 정보는 브라우저에만 보관됩니다.
            </p>
            
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">🔑 Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-mono text-sm rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
            
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">🧠 AI Model Selection</label>
            <select id="api-model-select" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 mb-6 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all cursor-pointer">
                <option value="gemini-2.5-flash">🚀 Gemini 2.5 Flash (튜터 권장)</option>
                <option value="gemini-3.1-flash-lite">⚡ Gemini 3.1 Flash-Lite (초경량)</option>
                <option value="gemini-2.5-pro">🧠 Gemini 2.5 Pro (고급 추론)</option>
            </select>

            <div id="api-key-error" class="hidden text-rose-500 text-xs font-bold mb-4 bg-rose-50 p-3 rounded-lg border border-rose-100"></div>
            
            <div class="flex gap-3">
                <button id="btn-save-key" onclick="verifyAndSaveApiKey()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <span id="btn-save-key-text">Verify & Save</span>
                </button>
                <button onclick="cancelApiKeyModal()" class="py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">Cancel</button>
            </div>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-7xl mx-auto flex flex-col flex-1 gap-6 md:gap-8">
        
        <!-- 상단 헤더 및 통합 컨트롤 패널 -->
        <div class="flex flex-col md:flex-row items-center justify-between border-b border-slate-200 pb-4 gap-4">
            <h1 class="text-[21px] md:text-3xl font-extrabold text-slate-800 flex items-baseline tracking-tight">AX LAB A.I Tutor</h1>
            
            <div class="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                <!-- 언어 & 캐릭터 선택 -->
                <div class="flex items-center space-x-2 px-2 border-r border-slate-100">
                    <span class="text-xs font-bold text-slate-500">🌐 Lang:</span>
                    <div class="flex space-x-1 bg-slate-50 p-1 rounded-lg border border-slate-200">
                        <button id="lang-ko" onclick="setLanguage('ko-KR')" class="w-[65px] py-1.5 text-[10px] font-bold text-slate-500 rounded-md transition-all flex items-center justify-center gap-1">🦊 KOR</button>
                        <button id="lang-en" onclick="setLanguage('en-US')" class="w-[65px] py-1.5 text-[10px] font-black bg-blue-500 text-white rounded-md shadow-sm transition-all flex items-center justify-center gap-1">🐻‍❄️ ENG</button>
                    </div>
                </div>

                <!-- 볼륨 제어 -->
                <div class="flex items-center space-x-2 px-2 border-r border-slate-100">
                    <span class="text-sm opacity-70">🔈</span>
                    <input type="range" id="master-vol" min="0" max="1" step="0.1" value="1" class="w-16 md:w-20 accent-slate-700" oninput="updateVolume(this.value)">
                </div>

                <!-- API 설정 -->
                <div class="px-2">
                    <button onclick="openApiKeyModal()" class="flex items-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-bold py-1.5 px-3 rounded-md transition-all">
                        ⚙️ API Config
                    </button>
                </div>
            </div>
        </div>

        <!-- 2단 레이아웃 -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-10 flex-1">
            
            <!-- 좌측: 캐릭터 렌더링 및 시작 버튼 -->
            <div class="md:col-span-5 flex flex-col items-center justify-start pt-4 space-y-6">
                <div class="relative flex items-center justify-center w-full">
                    <canvas id="tutorCanvas" width="400" height="600" class="bg-transparent canvas-responsive transition-all duration-300"></canvas>
                </div>
                
                <div class="w-full max-w-[320px]">
                    <button id="main-action-btn" onclick="toggleActiveMode()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xl font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                        <span id="btn-icon">▶</span>
                        <span id="btn-text">START TUTOR</span>
                    </button>
                </div>
            </div>

            <!-- 우측: 상/하 고정 말풍선 영역 (상단 정렬 적용) -->
            <div class="md:col-span-7 flex flex-col justify-start pt-4 gap-6">
                
                <!-- A.I Tutor 말풍선 (상단) -->
                <div id="tutor-bubble-container" class="bubble-container py-6 px-8 md:p-10 rounded-[2.5rem] bg-[#f4faff] border-2 border-slate-200 flex flex-col w-full min-h-[160px] shadow-sm relative transition-colors duration-500">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="tutor-icon" class="text-sm">🐻‍❄️</span>
                        <span class="text-[11px] font-black text-slate-400 uppercase tracking-wider">A.I Tutor</span>
                    </div>
                    <div id="tutor-text" class="text-slate-800 font-medium text-[15px] md:text-xl leading-relaxed transition-all duration-300">
                        Waiting to start...
                    </div>
                </div>

                <!-- 사용자 말풍선 및 퀵 메뉴 (하단) -->
                <div class="w-full">
                    <div id="user-bubble-container" class="bubble-container py-6 px-8 md:p-10 rounded-[2.5rem] bg-[#f8fafc] border-2 border-slate-200 flex flex-col w-full min-h-[160px] shadow-sm relative transition-colors duration-500">
                        <div class="mb-3 flex justify-between items-center">
                            <div class="flex items-center gap-2 text-[11px] font-black text-indigo-500 uppercase tracking-wider">
                                <span id="status-icon" class="grayscale opacity-50">🔴</span>
                                <span id="status-text" class="text-slate-400">Ready</span>
                            </div>
                        </div>
                        <div id="user-text" class="text-slate-400 font-medium text-[15px] md:text-xl transition-all duration-300 leading-relaxed">
                            Click START to speak...
                        </div>
                    </div>
                    
                    <!-- 퀵 메뉴(버튼) 컨테이너 -->
                    <div class="flex flex-wrap gap-2 mt-4 px-2">
                        <button onclick="sendQuickQuery('Who is Xena?', 'en-US')" class="px-4 py-2 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-600 font-medium text-sm rounded-full transition-all shadow-sm">Who is Xena?</button>
                        <button onclick="sendQuickQuery('제노를 소개해요!', 'ko-KR')" class="px-4 py-2 bg-white border border-slate-200 hover:border-orange-400 hover:bg-orange-50 text-slate-600 font-medium text-sm rounded-full transition-all shadow-sm">제노를 소개해요!</button>
                        <button onclick="sendQuickQuery('AX 렙 잉글리시란?', 'ko-KR')" class="px-4 py-2 bg-white border border-slate-200 hover:border-orange-400 hover:bg-orange-50 text-slate-600 font-medium text-sm rounded-full transition-all shadow-sm">AX 렙 잉글리시란?</button>
                        <button onclick="sendQuickQuery('What is CLIL?', 'en-US')" class="px-4 py-2 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-600 font-medium text-sm rounded-full transition-all shadow-sm">What is CLIL?</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 전역 상태 및 공통 변수
        // ==========================================
        let isActive = false;   
        let currentChar = 'xena'; // Default Bear
        let isTutorSpeaking = false;
        let hasInitialized = false;
        let masterVolume = 1.0;
        let sttLang = 'en-US'; // Default English
        
        let inactivityTimeout = null;
        let lastVoiceTime = Date.now();
        const INACTIVITY_LIMIT = 60000; 

        let chatHistory = [];
        let isProcessingAI = false;
        let welcomeIntervalId = null;

        window.activeUtterance = null;
        window.ttsFallbackTimeout = null;

        const tutorBubbleContainer = document.getElementById('tutor-bubble-container');
        const userBubbleContainer = document.getElementById('user-bubble-container');
        const tutorText = document.getElementById('tutor-text');
        const userText = document.getElementById('user-text');
        
        const mainBtn = document.getElementById('main-action-btn');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        const tutorIcon = document.getElementById('tutor-icon');
        const modalEl = document.getElementById('inactivity-modal');
        const canvasEl = document.getElementById('tutorCanvas');

        // ==========================================
        // 2. AI Tutor 시스템 프롬프트 (정체성 및 데이터 우선순위 강제 적용)
        // ==========================================
        const SYSTEM_INSTRUCTION = `
You are the 'AX LAB A.I Tutor'. 
[CRITICAL RULE: STRICT PERSONA & LANGUAGE BINDING]
- If the user speaks Korean, YOU MUST ACT AS [XENO] and speak strictly in Korean. NEVER reply in English or as [XENA].
- If the user speaks English, YOU MUST ACT AS [XENA] and speak strictly in English. NEVER reply in Korean or as [XENO].
- You MUST prioritize the context of 'AX LAB English', 'XENOIS', 'K-CLIL', and the characters 'Xeno (Fox)' and 'Xena (Polar Bear)'.

Persona 1: [XENO] - The Science Tutor (Fox)
- Language: Strictly Korean.
- Tone: 초등학교 3학년 학생에게 설명하듯 친절하고 명확하게 대답하세요. 주어진 AX LAB 데이터를 최우선으로 사용하여 똑똑한 여우처럼 말하세요.
- Output Tag: [XENO]

Persona 2: [XENA] - The Language Tutor (Polar Bear)
- Language: Strictly English.
- Tone & Level: EFL (English as a Foreign Language) beginner. Use VERY simple, basic English words (e.g. cat, apple, happy, see). Use short sentences. Keep it extremely easy for a non-native beginner.
- Output Tag: [XENA]

CRITICAL LENGTH & FORMAT RULE:
- Keep responses concise and to the point. Aim for 2 to 3 sentences maximum (under 30 words total).
        `;

        // ==========================================
        // 3. 메인 컨트롤 로직
        // ==========================================
        function initAppOnInteraction() {
            if (hasInitialized) return;
            hasInitialized = true;
            document.getElementById('start-overlay').style.display = 'none';
            
            try { const unlock = new SpeechSynthesisUtterance(''); unlock.volume = 0; window.speechSynthesis.speak(unlock); } catch (e) {}

            setLanguage('en-US'); // Default: English & Bear

            playWelcomeMessage();
            welcomeIntervalId = setInterval(playWelcomeMessage, 30000);
        }

        function playWelcomeMessage() {
            if (isActive) return; 
            const msg = "Welcome, I'm AX LAB A.I Tutor. Please, click the Start button.";
            speakText(msg);
        }

        function toggleActiveMode() {
            if (!hasInitialized) return;
            if (!localStorage.getItem('gemini_api_key')) { openApiKeyModal(); return; }
            if (isActive) stopActiveMode(); else startActiveMode();
        }

        function startActiveMode() {
            isActive = true;
            clearInterval(welcomeIntervalId);
            stopSpeaking(); 
            
            mainBtn.className = "w-full py-4 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xl font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2";
            document.getElementById('btn-icon').innerText = "■";
            document.getElementById('btn-text').innerText = "STOP TUTOR";

            setStatusUI('listen');
            startSttLogic();
            startInactivityTimer();
        }

        function stopActiveMode(fromModal = false) {
            isActive = false;
            clearTimeout(inactivityTimeout);
            stopSttLogic();
            stopSpeaking();

            if (!fromModal) {
                mainBtn.className = "w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xl font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2";
                document.getElementById('btn-icon').innerText = "▶";
                document.getElementById('btn-text').innerText = "START TUTOR";
                setStatusUI('ready');
            }
        }

        // ==========================================
        // 4. 언어 셋팅 & 퀵 메뉴
        // ==========================================
        function setLanguage(langCode, fromAI = false) {
            sttLang = langCode;
            document.getElementById('lang-ko').className = "w-[65px] py-1.5 text-[10px] font-bold text-slate-500 rounded-md transition-all flex items-center justify-center gap-1";
            document.getElementById('lang-en').className = "w-[65px] py-1.5 text-[10px] font-bold text-slate-500 rounded-md transition-all flex items-center justify-center gap-1";
            
            if (langCode === 'ko-KR') {
                document.getElementById('lang-ko').className = "w-[65px] py-1.5 text-[10px] font-black bg-orange-500 text-white rounded-md shadow-sm transition-all flex items-center justify-center gap-1";
                if (!fromAI) setCharacter('xeno');
            } else {
                document.getElementById('lang-en').className = "w-[65px] py-1.5 text-[10px] font-black bg-blue-500 text-white rounded-md shadow-sm transition-all flex items-center justify-center gap-1";
                if (!fromAI) setCharacter('xena');
            }
            
            if (recognition && isActive && !fromAI) {
                recognition.stop(); 
            }
        }

        function sendQuickQuery(text, langCode) {
            if (!hasInitialized) initAppOnInteraction();
            
            if (!isActive) startActiveMode();
            else stopSttLogic(); 
            
            setLanguage(langCode);
            userText.innerHTML = text;
            userText.className = "text-slate-800 font-medium text-[15px] md:text-xl transition-all duration-300 leading-relaxed";
            
            callGeminiAI(text);
        }

        // ==========================================
        // 5. UI 상태 변화 
        // ==========================================
        function setStatusUI(state) {
            tutorBubbleContainer.classList.remove('border-slate-200', 'border-orange-400', 'border-blue-400');
            userBubbleContainer.classList.remove('border-slate-200', 'border-rose-400', 'bg-[#fffdf0]', 'bg-[#f8fafc]');

            if (state === 'ready') {
                statusText.innerText = "Ready";
                statusText.className = "text-slate-400";
                statusIcon.innerText = "🔴";
                statusIcon.className = "grayscale opacity-50";
                userText.innerHTML = "Click START to speak...";
                userText.className = "text-slate-400 font-medium text-[15px] md:text-xl transition-all duration-300 leading-relaxed";
                
                userBubbleContainer.classList.add('bg-[#f8fafc]', 'border-slate-200');
                tutorBubbleContainer.classList.add('border-slate-200');
            } else if (state === 'listen') {
                statusText.innerText = "Listening";
                statusText.className = "text-indigo-500";
                statusIcon.innerText = "🔴";
                statusIcon.className = "animate-pulse";
                userText.innerHTML = "Speak now...";
                userText.className = "text-slate-400 font-medium text-[15px] md:text-xl transition-all duration-300 leading-relaxed";
                
                userBubbleContainer.classList.add('bg-[#fffdf0]', 'border-rose-400');
                tutorBubbleContainer.classList.add('border-slate-200');
            } else if (state === 'process') {
                statusText.innerText = "Processing...";
                statusText.className = "text-slate-500";
                statusIcon.innerText = "⏳";
                statusIcon.className = "";
                userText.className = "text-slate-600 font-medium text-[15px] md:text-xl transition-all duration-300 leading-relaxed";
                
                userBubbleContainer.classList.add('bg-[#f8fafc]', 'border-slate-200');
                tutorBubbleContainer.classList.add('border-slate-200');
            } else if (state === 'speak') {
                statusText.innerText = "Tutor Answering";
                statusText.className = "text-indigo-500";
                statusIcon.innerText = "🔊";
                statusIcon.className = "";
                
                userBubbleContainer.classList.add('bg-[#f8fafc]', 'border-slate-200');
                tutorBubbleContainer.classList.add(currentChar === 'xeno' ? 'border-orange-400' : 'border-blue-400');
            }
        }

        function setCharacter(char) {
            currentChar = char;
            tutorBubbleContainer.classList.remove('bg-[#fffcf5]', 'bg-[#f4faff]');
            if (char === 'xeno') {
                tutorIcon.innerText = "🦊";
                tutorBubbleContainer.classList.add('bg-[#fffcf5]');
            } else {
                tutorIcon.innerText = "🐻‍❄️";
                tutorBubbleContainer.classList.add('bg-[#f4faff]');
            }
            if(isTutorSpeaking) setStatusUI('speak'); 
        }

        function updateVolume(val) { masterVolume = parseFloat(val); }

        // ==========================================
        // API Modal Functions
        // ==========================================
        function openApiKeyModal() { document.getElementById('apikey-modal').classList.remove('hidden'); document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || ''; const savedModel = localStorage.getItem('gemini_model_name') || 'gemini-2.5-flash'; const modelSelect = document.getElementById('api-model-select'); if (Array.from(modelSelect.options).some(opt => opt.value === savedModel)) { modelSelect.value = savedModel; } else { modelSelect.value = 'gemini-2.5-flash'; } document.getElementById('api-key-error').classList.add('hidden'); }
        function cancelApiKeyModal() { document.getElementById('apikey-modal').classList.add('hidden'); }
        async function verifyAndSaveApiKey() { const inputEl = document.getElementById('api-key-input'); const modelSelectEl = document.getElementById('api-model-select'); const errorEl = document.getElementById('api-key-error'); const key = inputEl.value.trim(); const modelName = modelSelectEl.value; if (!key) { errorEl.innerText = "❌ API 키를 입력해주세요."; errorEl.classList.remove('hidden'); return; } document.getElementById('btn-save-key-text').innerText = "Verifying..."; errorEl.classList.add('hidden'); try { const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: "hi" }] }] }) }); if (response.ok) { localStorage.setItem('gemini_api_key', key); localStorage.setItem('gemini_model_name', modelName); document.getElementById('apikey-modal').classList.add('hidden'); } else { throw new Error("API 연동 실패"); } } catch (err) { errorEl.innerText = `❌ 오류: ${err.message}`; errorEl.classList.remove('hidden'); } finally { document.getElementById('btn-save-key-text').innerText = "Verify & Save"; } }

        // ==========================================
        // STT Logic (한국어 의문문 휴리스틱 추가)
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let sttErrorOccurred = false; 

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            recognition.onspeechstart = () => { lastVoiceTime = Date.now(); };
            recognition.onresult = (event) => {
                if(!isActive) return;
                lastVoiceTime = Date.now();
                let interimTranscript = ''; let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) { if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript; else interimTranscript += event.results[i][0].transcript; }
                if (interimTranscript) { userText.className = "text-slate-400 font-medium text-[15px] md:text-xl transition-all duration-300 leading-relaxed"; userText.innerHTML = interimTranscript; }
                
                if (finalTranscript && finalTranscript.trim().length > 1) {
                    let processedTranscript = finalTranscript.trim();
                    // 한국어 의문문 끝단어 처리 휴리스틱 (STT 한계 보완)
                    if (sttLang === 'ko-KR' && /(까|니|냐|나요|가요|까요|을까요|대요|죠)\s*$/.test(processedTranscript) && !processedTranscript.endsWith('?')) {
                        processedTranscript += '?';
                    }

                    userText.className = "text-slate-800 font-medium text-[15px] md:text-xl leading-relaxed transition-all duration-300";
                    userText.innerHTML = processedTranscript;
                    recognition.stop();
                    callGeminiAI(processedTranscript);
                }
            };
            recognition.onerror = (event) => { if (event.error === 'not-allowed' || event.error === 'network') { sttErrorOccurred = true; alert("마이크 권한 오류"); stopActiveMode(); } };
            
            recognition.onend = () => { 
                if (isActive && !isTutorSpeaking && !isProcessingAI && modalEl.classList.contains('hidden') && !sttErrorOccurred) { 
                    try { 
                        recognition.lang = sttLang;
                        recognition.start(); 
                    } catch(e) {} 
                    setStatusUI('listen'); 
                } 
            };
        }
        
        function startSttLogic() { 
            sttErrorOccurred = false; 
            if (recognition) { 
                recognition.lang = sttLang; 
                try { recognition.start(); } catch(e) {} 
            } 
        }
        function stopSttLogic() { if (recognition) try { recognition.stop(); } catch(e) {} isProcessingAI = false; }

        // ==========================================
        // Gemini API Logic
        // ==========================================
        async function callGeminiAI(userMessage) {
            isProcessingAI = true;
            setStatusUI('process');
            const apiKey = localStorage.getItem('gemini_api_key');
            const modelName = localStorage.getItem('gemini_model_name') || 'gemini-2.5-flash';
            
            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
            while (chatHistory.length > 7) { chatHistory.shift(); chatHistory.shift(); }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] }, contents: chatHistory, generationConfig: { temperature: 0.7, maxOutputTokens: 250 } })
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                let aiResponse = data.candidates[0].content.parts[0].text.trim();
                
                if (aiResponse.startsWith('[XENO]')) {
                    setLanguage('ko-KR', true);
                    setCharacter('xeno');
                    aiResponse = aiResponse.replace('[XENO]', '').trim();
                } else if (aiResponse.startsWith('[XENA]')) {
                    setLanguage('en-US', true);
                    setCharacter('xena');
                    aiResponse = aiResponse.replace('[XENA]', '').trim();
                }

                chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                setStatusUI('speak');
                
                const cleanText = aiResponse.replace(/[\*\_~`#>-]/g, '').replace(/\[.*?\]\(.*?\)/g, '').replace(/!\[.*?\]\(.*?\)/g, '').replace(/[\u{1F600}-\u{1F6FF}]/gu, '').trim();
                speakText(cleanText);
            } catch (error) {
                tutorText.innerHTML = "네트워크 오류가 발생했습니다.";
                setTimeout(() => { isProcessingAI = false; if(isActive) setStatusUI('listen'); }, 3000);
            }
        }

        // ==========================================
        // TTS Engine (A.I 발음 강제 치환 적용)
        // ==========================================
        function startInactivityTimer() { lastVoiceTime = Date.now(); clearTimeout(inactivityTimeout); checkInactivity(); }
        function checkInactivity() { if (!isActive || isTutorSpeaking || isProcessingAI) { inactivityTimeout = setTimeout(checkInactivity, 1000); return; } if (Date.now() - lastVoiceTime > INACTIVITY_LIMIT) { stopActiveMode(true); modalEl.classList.remove('hidden'); } else { inactivityTimeout = setTimeout(checkInactivity, 1000); } }
        function handleModal(choice) { modalEl.classList.add('hidden'); if (choice === 'yes') startActiveMode(); else stopActiveMode(); }

        let voices = []; speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
        let ttsQueue = []; let currentChunkIndex = 0;

        function speakText(text) {
            stopSpeaking();
            if (masterVolume === 0 || !text) return;
            isTutorSpeaking = true;
            renderer.startSpeakingAnim('tts');

            const rawChunks = text.match(/[^.?!]+[.?!]+[\s]*|[^.?!]+$/g) || [text];
            ttsQueue = rawChunks.map(c => c.trim()).filter(c => c.length > 0);
            currentChunkIndex = 0;

            tutorText.innerHTML = '';
            ttsQueue.forEach((chunk, idx) => {
                const span = document.createElement('span');
                span.id = `tts-chunk-${idx}`;
                span.className = "text-slate-400 transition-colors duration-300 mr-1";
                span.innerText = chunk + ' ';
                tutorText.appendChild(span);
            });
            playNextTtsChunk();
        }

        function playNextTtsChunk() {
            if (currentChunkIndex >= ttsQueue.length) { completeSpeakingSequence(); return; }

            ttsQueue.forEach((_, idx) => {
                const span = document.getElementById(`tts-chunk-${idx}`);
                if (span) {
                    if (idx === currentChunkIndex) span.className = "text-slate-800 transition-colors duration-300 mr-1";
                    else span.className = "text-slate-400 transition-colors duration-300 mr-1";
                }
            });

            const currentText = ttsQueue[currentChunkIndex];
            
            // 화면엔 A.I로 띄우고, 실제 엔진에 넘길 땐 "에이 아이"로 강제 치환 (발음 교정)
            let spokenText = currentText.replace(/A\.I/gi, '에이 아이');
            
            const utterance = new SpeechSynthesisUtterance(spokenText);
            window.activeUtterance = utterance;
            utterance.volume = masterVolume;
            utterance.lang = sttLang; 

            if (voices.length === 0) voices = speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang.includes(utterance.lang) && (v.name.includes('Google') || v.name.includes('Natural')));
            if (!bestVoice) bestVoice = voices.find(v => v.lang.includes(utterance.lang));
            if (bestVoice) utterance.voice = bestVoice;
            utterance.pitch = 1.0; utterance.rate = 1.0;

            clearTimeout(window.ttsFallbackTimeout);
            window.ttsFallbackTimeout = setTimeout(() => { if (isTutorSpeaking) { currentChunkIndex++; playNextTtsChunk(); } }, (spokenText.length * 150) + 2000);

            utterance.onstart = () => { renderer.startSpeakingAnim('tts'); };
            utterance.onend = () => { currentChunkIndex++; playNextTtsChunk(); };
            utterance.onerror = () => { currentChunkIndex++; playNextTtsChunk(); };
            speechSynthesis.speak(utterance);
        }

        function completeSpeakingSequence() {
            clearTimeout(window.ttsFallbackTimeout); isTutorSpeaking = false; renderer.stopSpeakingAnim(); window.activeUtterance = null;
            lastVoiceTime = Date.now(); isProcessingAI = false;
            
            ttsQueue.forEach((_, idx) => {
                const span = document.getElementById(`tts-chunk-${idx}`);
                if (span) span.className = "text-slate-800 transition-colors duration-300 mr-1";
            });

            if (isActive && recognition && modalEl.classList.contains('hidden') && !sttErrorOccurred) {
                try { 
                    recognition.lang = sttLang;
                    recognition.start(); 
                } catch(e){}
                setStatusUI('listen');
            }
        }

        function stopSpeaking() { clearTimeout(window.ttsFallbackTimeout); speechSynthesis.cancel(); ttsQueue = []; currentChunkIndex = 0; isTutorSpeaking = false; renderer.stopSpeakingAnim(); window.activeUtterance = null; }

        // ==========================================
        // 렌더링 엔진 
        // ==========================================
        const renderer = {
            config: {
                "xena": { "baseScale": 0.9, "baseX": -1, "baseY": 35, "eyeY": 96, "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1, "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilRightOffsetX": -3, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -14, "eyebrowThickness": 3, "mouthY": 145, "mouthWidth": 33.5, "verticalLineLength": 7, "mouthCurve": 9, "mouthOffsetX": 1, "mouthOffsetY": 1.5, "mouthLineThickness": 1.4, "mouthOpenStyle": "smiling" },
                "xeno": { "baseScale": 0.9, "baseX": 0, "baseY": 12, "eyeY": 67, "eyeSpacing": 66, "eyeWidth": 15, "eyeHeight": 15.5, "eyeLineThickness": 1, "pupilSize": 24.2, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 1, "pupilRightOffsetX": -3, "pupilRightOffsetY": 0.5, "eyebrowY": -33, "eyebrowLength": 26, "eyebrowAngle": -16, "eyebrowThickness": 4, "mouthY": 111, "mouthWidth": 29, "verticalLineLength": 7, "mouthCurve": 10, "mouthOffsetX": -1.5, "mouthOffsetY": 1, "mouthLineThickness": 1.6, "mouthOpenStyle": "smiling" }
            },
            simulation: { mouthOpen: 0, blinkState: 0, blinkTimer: 0, isSpeaking: false, speakType: 'none', vowel: 'A', speakIntervalId: null },
            ctx: null, images: { xena: new Image(), xeno: new Image() }, imageLoaded: { xena: false, xeno: false },
            init: function() { this.ctx = canvasEl.getContext('2d'); this.images.xena.src = "Xena_base.png"; this.images.xeno.src = "Xeno_base.png"; this.images.xena.onload = () => { this.imageLoaded.xena = true; }; this.images.xeno.onload = () => { this.imageLoaded.xeno = true; }; this.startLoop(); },
            startSpeakingAnim: function(type) { clearInterval(this.simulation.speakIntervalId); this.simulation.isSpeaking = true; this.simulation.speakType = type; if (type === 'tts') { const vowels = ['A', 'E', 'I', 'O', 'U']; let vIdx = 0; this.simulation.speakIntervalId = setInterval(() => { this.simulation.mouthOpen = 4 + Math.random() * 8; this.simulation.vowel = vowels[vIdx]; vIdx = (vIdx + 1) % vowels.length; }, 130); } },
            stopSpeakingAnim: function() { this.simulation.isSpeaking = false; this.simulation.speakType = 'none'; clearInterval(this.simulation.speakIntervalId); this.simulation.speakIntervalId = null; this.simulation.mouthOpen = 0; },
            startLoop: function() {
                const drawFrame = () => {
                    this.ctx.clearRect(0, 0, 400, 600); const breathe = Math.sin(Date.now() / 420) * 3.5; this.ctx.save(); this.ctx.translate(200, 300 + breathe);
                    if (this.imageLoaded[currentChar]) { const img = this.images[currentChar]; const cfg = this.config[currentChar]; const drawWidth = img.width * cfg.baseScale; const drawHeight = img.height * cfg.baseScale; this.ctx.drawImage(img, -drawWidth/2 + cfg.baseX, -drawHeight/2 + cfg.baseY, drawWidth, drawHeight); } else { this.drawBackupSilhouette(); }
                    this.drawVectorEyes(); this.drawVectorEyebrows(); this.drawVectorMouth(); this.ctx.restore();
                    if (!this.simulation.isSpeaking) { this.simulation.blinkTimer++; if (this.simulation.blinkTimer > 200) { this.simulation.blinkState = 1; if (this.simulation.blinkTimer > 212) { this.simulation.blinkState = 0; this.simulation.blinkTimer = 0; } } }
                    requestAnimationFrame(drawFrame);
                }; drawFrame();
            },
            drawBackupSilhouette: function() { this.ctx.save(); this.ctx.beginPath(); const isXena = currentChar === 'xena'; this.ctx.arc(0, 140, 100, 0, Math.PI * 2); this.ctx.fillStyle = isXena ? "#f0f7ff" : "#fffbf2"; this.ctx.fill(); this.ctx.beginPath(); this.ctx.arc(0, 10, 105, 0, Math.PI * 2); this.ctx.fillStyle = isXena ? "#f8fafc" : "#fffbeb"; this.ctx.fill(); this.ctx.strokeStyle = "#cbd5e1"; this.ctx.lineWidth = 4; this.ctx.stroke(); this.ctx.fillStyle = "#64748b"; this.ctx.font = "bold 13px sans-serif"; this.ctx.textAlign = "center"; this.ctx.fillText(`[${currentChar}_base.png] Loading...`, 0, 10); this.ctx.restore(); },
            drawVectorEyes: function() { const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const eyeYOff = cfg.eyeY - 200; const drawSingleEye = (ex, isLeft) => { this.ctx.save(); if (this.simulation.blinkState === 1) { this.ctx.beginPath(); this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke(); } else { this.ctx.beginPath(); this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke(); this.ctx.beginPath(); const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2); const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0)); const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0)); this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#1e293b"; this.ctx.fill(); this.ctx.beginPath(); this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); } this.ctx.restore(); }; drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false); },
            drawVectorEyebrows: function() { const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const browY = (cfg.eyeY - 200) + cfg.eyebrowY; const drawBrow = (bx, isLeft) => { this.ctx.save(); this.ctx.translate(bx, browY); this.ctx.rotate((cfg.eyebrowAngle * Math.PI / 180) * (isLeft ? 1 : -1)); this.ctx.beginPath(); const half = cfg.eyebrowLength / 2; this.ctx.moveTo(-half, isLeft ? -1.5 : 1.5); this.ctx.quadraticCurveTo(0, -cfg.eyebrowThickness * 1.5, half, isLeft ? 1.5 : -1.5); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyebrowThickness; this.ctx.lineCap = "round"; this.ctx.stroke(); this.ctx.restore(); }; drawBrow(-halfSpacing, true); drawBrow(halfSpacing, false); },
            drawVectorMouth: function() { const cfg = this.config[currentChar]; this.ctx.save(); this.ctx.translate(cfg.mouthOffsetX || 0, (cfg.mouthY - 200) + (cfg.mouthOffsetY || 0)); const currentMouthH = this.simulation.mouthOpen; if (this.simulation.mouthOpen > 1.5) { let scaleW = 1.0; let scaleH = 1.0; const activeVowel = this.simulation.vowel || 'A'; if (activeVowel === 'A') { scaleW = 0.85; scaleH = 1.3; } else if (activeVowel === 'E') { scaleW = 0.95; scaleH = 0.9; } else if (activeVowel === 'I') { scaleW = 1.0; scaleH = 0.45; } else if (activeVowel === 'O') { scaleW = 0.65; scaleH = 1.1; } else if (activeVowel === 'U') { scaleW = 0.45; scaleH = 0.75; } const mouthW = cfg.mouthWidth * scaleW; const mouthH = this.simulation.mouthOpen * scaleH; if (cfg.verticalLineLength > 0) { const upperLipY = cfg.mouthOpenStyle === 'smiling' ? -mouthH * 0.15 : -mouthH; if (-cfg.verticalLineLength < upperLipY) { this.ctx.beginPath(); this.ctx.moveTo(0, -cfg.verticalLineLength); this.ctx.lineTo(0, upperLipY); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.lineCap = "round"; this.ctx.stroke(); } } this.ctx.beginPath(); if (cfg.mouthOpenStyle === 'smiling') { this.ctx.moveTo(-mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); this.ctx.closePath(); } else { this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2); } const mouthGrad = this.ctx.createLinearGradient(0, -mouthH, 0, mouthH); mouthGrad.addColorStop(0, "#3b0712"); mouthGrad.addColorStop(1, "#881337"); this.ctx.fillStyle = mouthGrad; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.stroke(); this.ctx.save(); this.ctx.beginPath(); if (cfg.mouthOpenStyle === 'smiling') { this.ctx.moveTo(-mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); this.ctx.closePath(); } else { this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2); } this.ctx.clip(); this.ctx.beginPath(); let tongueY, tongueW, tongueH; if (cfg.mouthOpenStyle === 'smiling') { tongueY = mouthH * 0.85; tongueW = mouthW * 0.55; tongueH = mouthH * 0.45; } else { tongueY = mouthH * 0.65; tongueW = mouthW * 0.55; tongueH = mouthH * 0.35; } this.ctx.ellipse(0, tongueY, tongueW, tongueH, 0, 0, Math.PI * 2); const tongueGrad = this.ctx.createLinearGradient(0, tongueY - tongueH, 0, tongueY + tongueH); tongueGrad.addColorStop(0, "#fda4af"); tongueGrad.addColorStop(1, "#f43f5e"); this.ctx.fillStyle = tongueGrad; this.ctx.fill(); this.ctx.strokeStyle = "#be123c"; this.ctx.lineWidth = 1.5; this.ctx.stroke(); this.ctx.restore(); } else { if (cfg.verticalLineLength > 0) { this.ctx.beginPath(); this.ctx.moveTo(0, -cfg.verticalLineLength); this.ctx.lineTo(0, 0); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.lineCap = "round"; this.ctx.stroke(); } this.ctx.beginPath(); this.ctx.moveTo(-cfg.mouthWidth, -2); this.ctx.quadraticCurveTo(0, cfg.mouthCurve, cfg.mouthWidth, -2); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = (cfg.mouthLineThickness * 1.25) || 2.0; this.ctx.lineCap = "round"; this.ctx.stroke(); } this.ctx.restore(); }
        };

        window.onload = () => { renderer.init(); };
    </script>
