<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AX LAB AI Tutor (Test Build)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #ffffff; color: #334155; }
        
        .canvas-responsive { width: 100%; max-width: 320px; height: auto; aspect-ratio: 2 / 3; }
        
        @media (max-width: 768px) {
            .canvas-responsive { max-width: 160px; }
            body { padding: 0.75rem !important; }
            .bubble-container { padding: 1.25rem !important; border-radius: 1rem !important; min-height: 100px !important; }
            .quick-menu-scroll { max-height: 120px !important; }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .quick-menu-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .quick-menu-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-start p-6 md:p-12 select-none bg-white relative">

    <!-- 1. 시작 오버레이 -->
    <div id="start-overlay" class="fixed inset-0 bg-[#0f172a] z-[60] flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-300" onclick="initAppOnInteraction()">
        <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-[#f8fafc] text-center">AX LAB AI Tutor</h2>
        <p class="text-slate-400 text-xs md:text-sm font-bold tracking-widest uppercase animate-pulse">Click anywhere to start (Text Input Mode)</p>
    </div>

    <!-- 2. 무응답 대기 모달 -->
    <div id="inactivity-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[70] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center mx-4">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">Are you there?</h3>
            <p class="text-sm text-slate-500 font-medium mb-8">No interaction detected for 1 minute.</p>
            <div class="flex gap-3">
                <button onclick="handleModal('yes')" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">Yes</button>
                <button onclick="handleModal('no')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">No</button>
            </div>
        </div>
    </div>

    <!-- 3. 설정 모달 -->
    <div id="apikey-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">설정 (Settings)</h3>
            <p class="text-xs text-slate-500 font-medium mb-4 leading-relaxed">안전한 AI 튜터 사용을 위한 환경을 세팅합니다.</p>
            
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1 mt-2">🔑 Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-mono text-sm rounded-xl px-4 py-3 mb-3 focus:outline-none focus:border-indigo-500 transition-all">
            
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1 mt-2">🧠 AI Model</label>
            <select id="api-model-select" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 mb-3 focus:outline-none focus:border-indigo-500 transition-all cursor-pointer">
                <option value="gemini-3.1-flash-lite">⚡ Gemini 3.1 Flash-Lite (초경량 기본)</option>
                <option value="gemini-2.5-flash">🚀 Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">🧠 Gemini 2.5 Pro (고급 추론)</option>
            </select>

            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1 mt-4">🎓 튜터 난이도 및 스타일</label>
            <div class="flex flex-col gap-2.5 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <label class="flex items-start gap-3 text-sm text-slate-700 cursor-pointer">
                    <input type="radio" name="tutor-level" value="1" checked class="mt-1 accent-indigo-600">
                    <div class="flex flex-col">
                        <span class="font-bold text-indigo-600">Lv 1. 핵심 요약 모드 (기본)</span>
                        <span class="text-xs text-slate-500">단문 3개 이하. 요청 시에만 지식 확장.</span>
                    </div>
                </label>
                <label class="flex items-start gap-3 text-sm text-slate-700 cursor-pointer">
                    <input type="radio" name="tutor-level" value="2" class="mt-1 accent-indigo-600">
                    <div class="flex flex-col">
                        <span class="font-bold text-indigo-600">Lv 2. 질문 유도 모드</span>
                        <span class="text-xs text-slate-500">단문 5개 이하. 끝에 대화를 유도하는 질문 포함.</span>
                    </div>
                </label>
            </div>

            <div id="api-key-error" class="hidden text-rose-500 text-xs font-bold mb-4 bg-rose-50 p-3 rounded-lg border border-rose-100"></div>
            
            <div class="flex gap-3 mt-2">
                <button id="btn-save-key" onclick="verifyAndSaveApiKey()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <span id="btn-save-key-text">저장</span>
                </button>
                <button onclick="cancelApiKeyModal()" class="py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">취소</button>
            </div>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-6xl mx-auto flex flex-col flex-1 gap-4 md:gap-6">
        
        <!-- 상단 헤더 및 컨트롤 패널 -->
        <div class="flex flex-row items-center justify-between border-b border-slate-100 pb-3">
            <h1 class="text-lg md:text-2xl font-extrabold text-slate-800 hidden md:block">AX LAB AI Tutor</h1>
            
            <div class="flex flex-1 md:flex-none items-center justify-between md:justify-end gap-2 md:gap-4 bg-slate-50 p-1.5 md:p-2 rounded-xl border border-slate-200 shadow-sm w-full md:w-auto">
                <button id="top-action-btn" onclick="toggleActiveMode()" class="px-4 py-2 md:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5">
                    <span id="top-btn-icon">▶</span>
                    <span id="top-btn-text">START</span>
                </button>

                <div class="flex bg-white p-1 rounded-lg border border-slate-200 shadow-sm">
                    <button id="lang-ko" onclick="setLanguage('ko-KR')" class="w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-bold text-slate-400 rounded-md transition-all">KOR</button>
                    <button id="lang-en" onclick="setLanguage('en-US')" class="w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-black bg-blue-500 text-white rounded-md shadow-sm transition-all">ENG</button>
                </div>

                <button onclick="openApiKeyModal()" class="flex items-center justify-center p-2 md:px-3 bg-white hover:bg-slate-100 border border-slate-200 text-slate-600 text-sm rounded-lg transition-all shadow-sm">
                    ⚙️ <span class="hidden md:inline ml-1 text-xs font-bold">설정</span>
                </button>
            </div>
        </div>

        <!-- 2단 레이아웃 -->
        <div class="flex flex-col md:flex-row gap-4 md:gap-8 flex-1 items-center justify-center mt-2">
            
            <!-- 렌더링 영역 -->
            <div class="w-full md:w-5/12 lg:w-4/12 flex justify-center">
                <div class="relative flex items-center justify-center w-full">
                    <canvas id="tutorCanvas" width="400" height="600" class="bg-transparent canvas-responsive transition-all duration-300"></canvas>
                </div>
            </div>

            <!-- 대화 및 메뉴 영역 -->
            <div class="w-full md:w-7/12 lg:w-8/12 flex flex-col justify-center gap-5">
                
                <!-- 튜터 말풍선 -->
                <div id="tutor-bubble-container" class="bubble-container pt-12 pb-5 px-6 md:pt-14 md:pb-8 md:px-8 rounded-3xl bg-[#f4faff] border-2 border-slate-100 flex flex-col w-full min-h-[140px] shadow-sm relative transition-colors duration-500">
                    
                    <!-- [TTS 테스트 옵션 UI] -->
                    <div class="absolute top-3 left-0 right-0 flex justify-center w-full">
                        <div class="flex gap-4 text-[11px] font-bold text-slate-500 bg-white/70 backdrop-blur-md px-4 py-1.5 rounded-full shadow-sm border border-slate-200">
                            <span class="text-indigo-400 border-r border-slate-300 pr-3">TTS 표시 모드</span>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors">
                                <input type="radio" name="tts-mode" value="whole" checked class="accent-indigo-600"> 전체 문장
                            </label>
                            <label class="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors">
                                <input type="radio" name="tts-mode" value="sentence" class="accent-indigo-600"> 개별 문장
                            </label>
                        </div>
                    </div>

                    <div id="tutor-text" class="text-slate-800 font-medium text-[15px] md:text-lg leading-relaxed transition-all duration-300">
                        Waiting to start...
                    </div>
                </div>

                <!-- 사용자 말풍선 및 퀵 메뉴 영역 -->
                <div class="w-full">
                    <div id="user-bubble-container" class="bubble-container py-5 px-6 md:py-6 md:px-8 rounded-3xl bg-slate-50 border-2 border-slate-100 flex flex-col justify-center w-full min-h-[120px] md:min-h-[130px] shadow-sm relative transition-colors duration-500">
                        <div id="user-text" class="w-full transition-all duration-300">
                            <p class="text-slate-400 font-medium text-[15px] md:text-lg text-center">Click START to begin...</p>
                        </div>
                    </div>
                    
                    <!-- 퀵 메뉴 -->
                    <div class="flex flex-wrap gap-2 mt-4 px-1 pb-2 max-h-[150px] overflow-y-auto quick-menu-scroll content-start">
                        <button onclick="sendQuickQuery('Who is Xena?', 'en-US')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">Who is Xena?</button>
                        <button onclick="sendQuickQuery('What is CLIL?', 'en-US')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">What is CLIL?</button>
                        <button onclick="sendQuickQuery('What are the key expressions?', 'en-US')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">Key expressions?</button>
                        <button onclick="sendQuickQuery('What is the date today?', 'en-US')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-blue-400 hover:bg-blue-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">Date today?</button>
                        
                        <button onclick="sendQuickQuery('제노를 소개해요!', 'ko-KR')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-orange-400 hover:bg-orange-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">제노 소개</button>
                        <button onclick="sendQuickQuery('AX LAB 잉글리시란?', 'ko-KR')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-orange-400 hover:bg-orange-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">AX LAB 이란?</button>
                        <button onclick="sendQuickQuery('피라미드 실험 방법을 알려줘.', 'ko-KR')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-orange-400 hover:bg-orange-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">실험 방법</button>
                        <button onclick="sendQuickQuery('교육 시장의 미래는 어때?', 'ko-KR')" class="px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-orange-400 hover:bg-orange-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0">교육 시장 동향</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 전역 상태 및 변수
        // ==========================================
        let isActive = false;   
        let currentChar = 'xena'; 
        let isTutorSpeaking = false;
        let isMicLocked = false; 
        let hasInitialized = false;
        let sttLang = 'en-US'; 
        
        let inactivityTimeout = null;
        let lastVoiceTime = Date.now();
        const INACTIVITY_LIMIT = 60000; 

        let chatHistory = [];
        let isProcessingAI = false;
        let welcomeIntervalId = null;

        window.activeUtterance = null;
        window.ttsFallbackTimeout = null;

        const tutorBubbleContainer = document.getElementById('tutor-bubble-container');
        const userBubbleContainer = document.getElementById('user-bubble-container');
        const tutorText = document.getElementById('tutor-text');
        const userText = document.getElementById('user-text');
        
        const topActionBtn = document.getElementById('top-action-btn');
        const topBtnIcon = document.getElementById('top-btn-icon');
        const topBtnText = document.getElementById('top-btn-text');
        
        const modalEl = document.getElementById('inactivity-modal');
        const canvasEl = document.getElementById('tutorCanvas');

        // 사용자 입력 활성화 감지 (모달 방지용)
        window.updateActivityTimer = function() {
            lastVoiceTime = Date.now();
        };

        // ==========================================
        // 2. 동적 시스템 프롬프트
        // ==========================================
        function getSystemInstruction() {
            const levelEl = document.querySelector('input[name="tutor-level"]:checked');
            const level = levelEl ? levelEl.value : "1"; 

            let levelInstruction = "";
            if (level === "1") {
                levelInstruction = "- Length: Max 3 short sentences.\n- Extension: Answer directly and briefly. DO NOT add extra knowledge unless explicitly asked.";
            } else if (level === "2") {
                levelInstruction = "- Length: Max 5 short sentences.\n- Extension: Give the answer, and end with a related question to invite conversation.";
            }

            return `
You are the 'AX LAB Tutor'. 
Today's Date: August 17, 2026.

[KNOWLEDGE BASE & EXTENSION ALLOWED]
- Target: 3rd Grade (9-10 years old). Keep vocabulary EASY.
- Program: AX LAB English (XENOIS), K-CLIL (Science + English).
- Unit 1: Egyptian Pyramids, Force, push, pull, friction, gravity. Tools: Ramp, Lever.
- **EXTENDED KNOWLEDGE**: If the user asks about general topics, educational market trends, AX LAB's vision, or current events, YOU MUST ANSWER THEM naturally and accurately. Do not force the topic back to Pyramids if they clearly want to talk about something else. You are a smart AI.

[STRICT LANGUAGE BINDING]
- If user speaks Korean: ACT AS [XENO] (Fox). Speak ONLY in Korean.
- If user speaks English: ACT AS [XENA] (Polar Bear). Speak ONLY in English.

Persona 1: [XENO] (Fox)
- Language: Korean only.
- Tone: 친절한 초등학교 3학년 선생님.

Persona 2: [XENA] (Polar Bear)
- Language: English only.
- Tone: EFL beginner. VERY simple words.

[LEVEL INSTRUCTION: FOLLOW STRICTLY]
${levelInstruction}
            `;
        }

        // ==========================================
        // 3. 메인 컨트롤 및 웰컴/선톡 로직
        // ==========================================
        function initAppOnInteraction() {
            if (hasInitialized) return;
            hasInitialized = true;
            document.getElementById('start-overlay').style.display = 'none';
            try { const unlock = new SpeechSynthesisUtterance(''); unlock.volume = 0; window.speechSynthesis.speak(unlock); } catch (e) {}
            
            const savedLevel = localStorage.getItem('tutor_level') || '1';
            const radio = document.querySelector(`input[name="tutor-level"][value="${savedLevel}"]`);
            if(radio) radio.checked = true;

            setLanguage('en-US'); 
            playWelcomeMessage();
            welcomeIntervalId = setInterval(playWelcomeMessage, 30000);
        }

        function playWelcomeMessage() {
            if (isActive) return; 
            let msg = sttLang === 'ko-KR' ? "시작 버튼을 클릭해 주세요." : "Please click the START button.";
            speakText(msg);
        }

        function toggleActiveMode() {
            if (!hasInitialized) return;
            if (!localStorage.getItem('gemini_api_key')) { openApiKeyModal(); return; }
            if (isActive) stopActiveMode(); else startActiveMode();
        }

        function startActiveMode() {
            isActive = true;
            isMicLocked = true;
            clearInterval(welcomeIntervalId);
            stopSpeaking(); 
            
            topActionBtn.className = "px-4 py-2 md:py-2.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5";
            topBtnIcon.innerText = "■";
            topBtnText.innerText = "STOP";

            chatHistory = []; 
            
            let initialGreeting = sttLang === 'ko-KR' 
                ? "안녕! 나는 네 학습을 도와줄 AI 튜터야. 오늘 기분이 어때?" 
                : "Hello! I am your AI tutor. How are you today?";
            
            setStatusUI('speak');
            speakText(initialGreeting);
            
            startInactivityTimer();
        }

        function stopActiveMode(fromModal = false) {
            isActive = false;
            clearTimeout(inactivityTimeout);
            stopSttLogic();
            stopSpeaking();

            if (!fromModal) {
                topActionBtn.className = "px-4 py-2 md:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5";
                topBtnIcon.innerText = "▶";
                topBtnText.innerText = "START";
                setStatusUI('ready');
            }
        }

        window.interruptTutor = function() {
            if (isTutorSpeaking) {
                stopSpeaking();
                isMicLocked = false;
                if (isActive && !sttErrorOccurred) {
                    setStatusUI('listen');
                }
            }
        };

        // ==========================================
        // 4. 언어 셋팅 & 퀵 메뉴
        // ==========================================
        function setLanguage(langCode, fromAI = false) {
            sttLang = langCode;
            document.getElementById('lang-ko').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-bold text-slate-400 rounded-md transition-all";
            document.getElementById('lang-en').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-bold text-slate-400 rounded-md transition-all";
            
            if (langCode === 'ko-KR') {
                document.getElementById('lang-ko').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-black bg-orange-500 text-white rounded-md shadow-sm transition-all";
                if (!fromAI) setCharacter('xeno');
            } else {
                document.getElementById('lang-en').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-black bg-blue-500 text-white rounded-md shadow-sm transition-all";
                if (!fromAI) setCharacter('xena');
            }
            
            if (!isActive && hasInitialized) {
                stopSpeaking();
                clearInterval(welcomeIntervalId);
                playWelcomeMessage();
                welcomeIntervalId = setInterval(playWelcomeMessage, 30000);
            }
        }

        function sendQuickQuery(text, langCode) {
            if (!hasInitialized) initAppOnInteraction();
            if (!isActive) startActiveMode(); else stopSttLogic(); 
            setLanguage(langCode);
            userText.innerHTML = text;
            userText.className = "text-slate-800 font-medium text-[15px] md:text-lg transition-all duration-300 leading-relaxed";
            callGeminiAI(text);
        }

        // ==========================================
        // 5. UI 상태 변화 및 수동 입력 전송
        // ==========================================
        window.submitTextInput = function() {
            const inputField = document.getElementById('manual-text-input');
            if (!inputField) return;
            const text = inputField.value.trim();
            if (text.length > 0) {
                updateActivityTimer();
                userText.innerHTML = text;
                userText.className = "text-slate-800 font-medium text-[15px] md:text-lg leading-relaxed transition-all duration-300 text-center";
                callGeminiAI(text);
            }
        };

        function setStatusUI(state) {
            tutorBubbleContainer.classList.remove('border-slate-100', 'border-orange-400', 'border-blue-400');
            userBubbleContainer.classList.remove('border-slate-100', 'border-rose-400', 'bg-white', 'bg-slate-50', 'bg-rose-50');

            if (state === 'ready') {
                userText.innerHTML = "<p class='text-slate-400 font-medium text-[15px] md:text-lg text-center'>Click START to begin...</p>";
                userBubbleContainer.classList.add('bg-slate-50', 'border-slate-100');
                tutorBubbleContainer.classList.add('border-slate-100');
            } else if (state === 'listen') {
                userText.innerHTML = `
                    <div class="flex flex-col md:flex-row w-full items-center gap-3">
                        <input type="text" id="manual-text-input" placeholder="${sttLang === 'ko-KR' ? '메시지를 입력하세요...' : 'Type your message here...'}" class="flex-1 w-full bg-white border border-slate-300 text-slate-800 text-[15px] md:text-base rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all shadow-inner" oninput="updateActivityTimer()" onkeydown="if(event.key === 'Enter') submitTextInput()">
                        <button onclick="submitTextInput()" class="w-full md:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md active:scale-95 shrink-0 whitespace-nowrap">
                            ${sttLang === 'ko-KR' ? '전송' : 'Send'}
                        </button>
                    </div>
                `;
                userBubbleContainer.classList.add('bg-rose-50', 'border-rose-400');
                tutorBubbleContainer.classList.add('border-slate-100');
                
                // 텍스트 필드 포커스
                setTimeout(() => {
                    const inputField = document.getElementById('manual-text-input');
                    if (inputField) inputField.focus();
                }, 100);

            } else if (state === 'process') {
                userBubbleContainer.classList.add('bg-white', 'border-slate-100');
                tutorBubbleContainer.classList.add('border-slate-100');
            } else if (state === 'speak') {
                userText.innerHTML = `
                    <div class="flex flex-col items-center justify-center mt-1">
                        <button onclick="interruptTutor()" class="px-5 py-2.5 bg-rose-100 border border-rose-200 text-rose-600 font-bold text-sm rounded-full shadow-sm hover:bg-rose-200 transition-all active:scale-95 flex items-center gap-1.5">
                            ✋ 말 끊고 응답하기
                        </button>
                    </div>
                `;
                userBubbleContainer.classList.add('bg-white', 'border-slate-100');
                tutorBubbleContainer.classList.add(currentChar === 'xeno' ? 'border-orange-400' : 'border-blue-400');
            }
        }

        function setCharacter(char) {
            currentChar = char;
            tutorBubbleContainer.classList.remove('bg-[#fffcf5]', 'bg-[#f4faff]');
            if (char === 'xeno') { tutorBubbleContainer.classList.add('bg-[#fffcf5]'); } 
            else { tutorBubbleContainer.classList.add('bg-[#f4faff]'); }
            if(isTutorSpeaking) setStatusUI('speak'); 
        }

        // ==========================================
        // API Modal Functions
        // ==========================================
        function openApiKeyModal() { 
            document.getElementById('apikey-modal').classList.remove('hidden'); 
            document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || ''; 
            const savedModel = localStorage.getItem('gemini_model_name') || 'gemini-3.1-flash-lite'; 
            const modelSelect = document.getElementById('api-model-select'); 
            if (Array.from(modelSelect.options).some(opt => opt.value === savedModel)) { modelSelect.value = savedModel; } 
            else { modelSelect.value = 'gemini-3.1-flash-lite'; } 
            
            const savedLevel = localStorage.getItem('tutor_level') || '1';
            const radio = document.querySelector(`input[name="tutor-level"][value="${savedLevel}"]`);
            if(radio) radio.checked = true;

            document.getElementById('api-key-error').classList.add('hidden'); 
        }
        function cancelApiKeyModal() { document.getElementById('apikey-modal').classList.add('hidden'); }
        async function verifyAndSaveApiKey() { 
            const inputEl = document.getElementById('api-key-input'); 
            const modelSelectEl = document.getElementById('api-model-select'); 
            const errorEl = document.getElementById('api-key-error'); 
            const key = inputEl.value.trim(); 
            const modelName = modelSelectEl.value; 
            const levelVal = document.querySelector('input[name="tutor-level"]:checked').value;

            if (!key) { errorEl.innerText = "❌ API 키를 입력해주세요."; errorEl.classList.remove('hidden'); return; } 
            document.getElementById('btn-save-key-text').innerText = "저장 중..."; 
            errorEl.classList.add('hidden'); 
            
            try { 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, { 
                    method: "POST", headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: "hi" }] }] }) 
                }); 
                if (response.ok) { 
                    localStorage.setItem('gemini_api_key', key); 
                    localStorage.setItem('gemini_model_name', modelName); 
                    localStorage.setItem('tutor_level', levelVal);
                    document.getElementById('apikey-modal').classList.add('hidden'); 
                } else { throw new Error("API 연동 실패"); } 
            } catch (err) { 
                errorEl.innerText = `❌ 오류: ${err.message}`; errorEl.classList.remove('hidden'); 
            } finally { document.getElementById('btn-save-key-text').innerText = "저장"; } 
        }

        // ==========================================
        // STT Logic (텍스트 테스트 모드를 위해 비활성화)
        // ==========================================
        let sttErrorOccurred = false; 
        
        function startSttLogic() { sttErrorOccurred = false; }
        function stopSttLogic() { isProcessingAI = false; }

        // ==========================================
        // Gemini API Logic
        // ==========================================
        async function callGeminiAI(userMessage) {
            isProcessingAI = true;
            setStatusUI('process');
            const apiKey = localStorage.getItem('gemini_api_key');
            const modelName = localStorage.getItem('gemini_model_name') || 'gemini-3.1-flash-lite';
            
            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
            while (chatHistory.length > 7) { chatHistory.shift(); chatHistory.shift(); }

            const dynamicSystemInstruction = getSystemInstruction();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ system_instruction: { parts: [{ text: dynamicSystemInstruction }] }, contents: chatHistory, generationConfig: { temperature: 0.7, maxOutputTokens: 250 } })
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                let aiResponse = data.candidates[0].content.parts[0].text.trim();
                
                if (aiResponse.startsWith('[XENO]')) { setLanguage('ko-KR', true); setCharacter('xeno'); aiResponse = aiResponse.replace('[XENO]', '').trim(); } 
                else if (aiResponse.startsWith('[XENA]')) { setLanguage('en-US', true); setCharacter('xena'); aiResponse = aiResponse.replace('[XENA]', '').trim(); }

                chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                setStatusUI('speak');
                
                const cleanText = aiResponse.replace(/[\*\_~`#>-]/g, '').replace(/\[.*?\]\(.*?\)/g, '').replace(/!\[.*?\]\(.*?\)/g, '').replace(/[\u{1F600}-\u{1F6FF}]/gu, '').trim();
                speakText(cleanText);
            } catch (error) {
                tutorText.innerHTML = "네트워크 오류가 발생했습니다.";
                setTimeout(() => { isProcessingAI = false; if(isActive) setStatusUI('listen'); }, 3000);
            }
        }

        // ==========================================
        // TTS Engine (옵션 적용 및 싱크 튜닝)
        // ==========================================
        function startInactivityTimer() { lastVoiceTime = Date.now(); clearTimeout(inactivityTimeout); checkInactivity(); }
        function checkInactivity() { if (!isActive || isTutorSpeaking || isProcessingAI) { inactivityTimeout = setTimeout(checkInactivity, 1000); return; } if (Date.now() - lastVoiceTime > INACTIVITY_LIMIT) { stopActiveMode(true); modalEl.classList.remove('hidden'); } else { inactivityTimeout = setTimeout(checkInactivity, 1000); } }
        function handleModal(choice) { modalEl.classList.add('hidden'); if (choice === 'yes') { startActiveMode(); } else stopActiveMode(); }

        let voices = []; speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
        let ttsQueue = []; let currentChunkIndex = 0;

        function speakText(text) {
            stopSpeaking();
            if (!text) return;
            isTutorSpeaking = true;
            isMicLocked = true;
            renderer.startSpeakingAnim('tts');

            const ttsMode = document.querySelector('input[name="tts-mode"]:checked').value;

            // 오디오 및 개별 문장 표시용 분할
            const rawChunks = text.match(/[^.?!]+[.?!]*(?:\s|$)/g) || [text];
            ttsQueue = rawChunks.map(c => c.trim()).filter(c => c.length > 0);
            currentChunkIndex = 0;

            if (ttsMode === 'whole') {
                tutorText.innerHTML = text; // 한 번에 전체 텍스트 렌더링
            } else {
                tutorText.innerHTML = ""; // 문장별 모드일 땐 지우고 시작
            }

            playNextTtsChunk();
        }

        function playNextTtsChunk() {
            if (currentChunkIndex >= ttsQueue.length) { completeSpeakingSequence(); return; }

            const currentText = ttsQueue[currentChunkIndex];
            const ttsMode = document.querySelector('input[name="tts-mode"]:checked').value;

            if (ttsMode === 'sentence') {
                tutorText.innerHTML = currentText; // 현재 읽고 있는 문장만 화면에 렌더링
            }
            
            // 엔진 발음 교정 로직 
            let spokenText = currentText;
            if (sttLang === 'ko-KR') { 
                spokenText = spokenText.replace(/A\.?I\.?/gi, '에이아이').replace(/AX/gi, '에이엑스');
            } else { 
                spokenText = spokenText.replace(/A\.?I\.?/gi, 'A I').replace(/AX/gi, 'A X');
            }
            
            const utterance = new SpeechSynthesisUtterance(spokenText);
            window.activeUtterance = utterance;
            utterance.volume = 1.0; 
            utterance.lang = sttLang; 

            if (voices.length === 0) voices = speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang.includes(utterance.lang) && (v.name.includes('Google') || v.name.includes('Natural')));
            if (!bestVoice) bestVoice = voices.find(v => v.lang.includes(utterance.lang));
            if (bestVoice) utterance.voice = bestVoice;
            utterance.pitch = 1.0; utterance.rate = 1.0;

            clearTimeout(window.ttsFallbackTimeout);
            window.ttsFallbackTimeout = setTimeout(() => { if (isTutorSpeaking) { currentChunkIndex++; playNextTtsChunk(); } }, Math.max(2500, spokenText.length * 120));

            utterance.onstart = () => { renderer.startSpeakingAnim('tts'); };
            utterance.onend = () => { currentChunkIndex++; playNextTtsChunk(); };
            utterance.onerror = () => { currentChunkIndex++; playNextTtsChunk(); };
            speechSynthesis.speak(utterance);
        }

        function completeSpeakingSequence() {
            clearTimeout(window.ttsFallbackTimeout); isTutorSpeaking = false; renderer.stopSpeakingAnim(); window.activeUtterance = null;
            lastVoiceTime = Date.now(); isProcessingAI = false;
            
            setTimeout(() => {
                isMicLocked = false;
                if (isActive && modalEl.classList.contains('hidden') && !sttErrorOccurred) {
                    setStatusUI('listen');
                }
            }, 500);
        }

        function stopSpeaking() { clearTimeout(window.ttsFallbackTimeout); speechSynthesis.cancel(); ttsQueue = []; currentChunkIndex = 0; isTutorSpeaking = false; isMicLocked = false; renderer.stopSpeakingAnim(); window.activeUtterance = null; }

        // ==========================================
        // 렌더링 엔진 (30 FPS 제한 적용)
        // ==========================================
        const renderer = {
            config: { "xena": { "baseScale": 0.9, "baseX": -1, "baseY": 35, "eyeY": 96, "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1, "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilRightOffsetX": -3, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -14, "eyebrowThickness": 3, "mouthY": 145, "mouthWidth": 33.5, "verticalLineLength": 7, "mouthCurve": 9, "mouthOffsetX": 1, "mouthOffsetY": 1.5, "mouthLineThickness": 1.4, "mouthOpenStyle": "smiling" }, "xeno": { "baseScale": 0.9, "baseX": 0, "baseY": 12, "eyeY": 67, "eyeSpacing": 66, "eyeWidth": 15, "eyeHeight": 15.5, "eyeLineThickness": 1, "pupilSize": 24.2, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 1, "pupilRightOffsetX": -3, "pupilRightOffsetY": 0.5, "eyebrowY": -33, "eyebrowLength": 26, "eyebrowAngle": -16, "eyebrowThickness": 4, "mouthY": 111, "mouthWidth": 29, "verticalLineLength": 7, "mouthCurve": 10, "mouthOffsetX": -1.5, "mouthOffsetY": 1, "mouthLineThickness": 1.6, "mouthOpenStyle": "smiling" } },
            simulation: { mouthOpen: 0, blinkState: 0, blinkTimer: 0, isSpeaking: false, speakType: 'none', vowel: 'A', speakIntervalId: null },
            ctx: null, images: { xena: new Image(), xeno: new Image() }, imageLoaded: { xena: false, xeno: false },
            init: function() { this.ctx = canvasEl.getContext('2d'); this.images.xena.src = "Xena_base.png"; this.images.xeno.src = "Xeno_base.png"; this.images.xena.onload = () => { this.imageLoaded.xena = true; }; this.images.xeno.onload = () => { this.imageLoaded.xeno = true; }; this.startLoop(); },
            startSpeakingAnim: function(type) { clearInterval(this.simulation.speakIntervalId); this.simulation.isSpeaking = true; this.simulation.speakType = type; if (type === 'tts') { const vowels = ['A', 'E', 'I', 'O', 'U']; let vIdx = 0; this.simulation.speakIntervalId = setInterval(() => { this.simulation.mouthOpen = 4 + Math.random() * 8; this.simulation.vowel = vowels[vIdx]; vIdx = (vIdx + 1) % vowels.length; }, 130); } },
            stopSpeakingAnim: function() { this.simulation.isSpeaking = false; this.simulation.speakType = 'none'; clearInterval(this.simulation.speakIntervalId); this.simulation.speakIntervalId = null; this.simulation.mouthOpen = 0; },
            startLoop: function() { 
                let then = performance.now();
                const fpsInterval = 1000 / 30; // 30 FPS 제한

                const drawFrame = (now) => { 
                    requestAnimationFrame(drawFrame); 
                    const elapsed = now - then;

                    if (elapsed > fpsInterval) {
                        then = now - (elapsed % fpsInterval);

                        this.ctx.clearRect(0, 0, 400, 600); 
                        const breathe = Math.sin(Date.now() / 420) * 3.5; 
                        this.ctx.save(); 
                        this.ctx.translate(200, 300 + breathe); 
                        if (this.imageLoaded[currentChar]) { const img = this.images[currentChar]; const cfg = this.config[currentChar]; const drawWidth = img.width * cfg.baseScale; const drawHeight = img.height * cfg.baseScale; this.ctx.drawImage(img, -drawWidth/2 + cfg.baseX, -drawHeight/2 + cfg.baseY, drawWidth, drawHeight); } else { this.drawBackupSilhouette(); } 
                        this.drawVectorEyes(); this.drawVectorEyebrows(); this.drawVectorMouth(); 
                        this.ctx.restore(); 

                        if (!this.simulation.isSpeaking) { 
                            this.simulation.blinkTimer++; 
                            if (this.simulation.blinkTimer > 100) { // 30fps 기준 (약 3.3초)
                                this.simulation.blinkState = 1; 
                                if (this.simulation.blinkTimer > 106) { 
                                    this.simulation.blinkState = 0; 
                                    this.simulation.blinkTimer = 0; 
                                } 
                            } 
                        } 
                    }
                }; 
                requestAnimationFrame(drawFrame); 
            },
            drawBackupSilhouette: function() { this.ctx.save(); this.ctx.beginPath(); const isXena = currentChar === 'xena'; this.ctx.arc(0, 140, 100, 0, Math.PI * 2); this.ctx.fillStyle = isXena ? "#f0f7ff" : "#fffbf2"; this.ctx.fill(); this.ctx.beginPath(); this.ctx.arc(0, 10, 105, 0, Math.PI * 2); this.ctx.fillStyle = isXena ? "#f8fafc" : "#fffbeb"; this.ctx.fill(); this.ctx.strokeStyle = "#cbd5e1"; this.ctx.lineWidth = 4; this.ctx.stroke(); this.ctx.fillStyle = "#64748b"; this.ctx.font = "bold 13px sans-serif"; this.ctx.textAlign = "center"; this.ctx.fillText(`[${currentChar}_base.png] Loading...`, 0, 10); this.ctx.restore(); },
            drawVectorEyes: function() { const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const eyeYOff = cfg.eyeY - 200; const drawSingleEye = (ex, isLeft) => { this.ctx.save(); if (this.simulation.blinkState === 1) { this.ctx.beginPath(); this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke(); } else { this.ctx.beginPath(); this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke(); this.ctx.beginPath(); const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2); const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0)); const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0)); this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#1e293b"; this.ctx.fill(); this.ctx.beginPath(); this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); } this.ctx.restore(); }; drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false); },
            drawVectorEyebrows: function() { const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const browY = (cfg.eyeY - 200) + cfg.eyebrowY; const drawBrow = (bx, isLeft) => { this.ctx.save(); this.ctx.translate(bx, browY); this.ctx.rotate((cfg.eyebrowAngle * Math.PI / 180) * (isLeft ? 1 : -1)); this.ctx.beginPath(); const half = cfg.eyebrowLength / 2; this.ctx.moveTo(-half, isLeft ? -1.5 : 1.5); this.ctx.quadraticCurveTo(0, -cfg.eyebrowThickness * 1.5, half, isLeft ? 1.5 : -1.5); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyebrowThickness; this.ctx.lineCap = "round"; this.ctx.stroke(); this.ctx.restore(); }; drawBrow(-halfSpacing, true); drawBrow(halfSpacing, false); },
            drawVectorMouth: function() { const cfg = this.config[currentChar]; this.ctx.save(); this.ctx.translate(cfg.mouthOffsetX || 0, (cfg.mouthY - 200) + (cfg.mouthOffsetY || 0)); const currentMouthH = this.simulation.mouthOpen; if (this.simulation.mouthOpen > 1.5) { let scaleW = 1.0; let scaleH = 1.0; const activeVowel = this.simulation.vowel || 'A'; if (activeVowel === 'A') { scaleW = 0.85; scaleH = 1.3; } else if (activeVowel === 'E') { scaleW = 0.95; scaleH = 0.9; } else if (activeVowel === 'I') { scaleW = 1.0; scaleH = 0.45; } else if (activeVowel === 'O') { scaleW = 0.65; scaleH = 1.1; } else if (activeVowel === 'U') { scaleW = 0.45; scaleH = 0.75; } const mouthW = cfg.mouthWidth * scaleW; const mouthH = this.simulation.mouthOpen * scaleH; if (cfg.verticalLineLength > 0) { const upperLipY = cfg.mouthOpenStyle === 'smiling' ? -mouthH * 0.15 : -mouthH; if (-cfg.verticalLineLength < upperLipY) { this.ctx.beginPath(); this.ctx.moveTo(0, -cfg.verticalLineLength); this.ctx.lineTo(0, upperLipY); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.lineCap = "round"; this.ctx.stroke(); } } this.ctx.beginPath(); if (cfg.mouthOpenStyle === 'smiling') { this.ctx.moveTo(-mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); this.ctx.closePath(); } else { this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2); } const mouthGrad = this.ctx.createLinearGradient(0, -mouthH, 0, mouthH); mouthGrad.addColorStop(0, "#3b0712"); mouthGrad.addColorStop(1, "#881337"); this.ctx.fillStyle = mouthGrad; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.stroke(); this.ctx.save(); this.ctx.beginPath(); if (cfg.mouthOpenStyle === 'smiling') { this.ctx.moveTo(-mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); this.ctx.closePath(); } else { this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2); } this.ctx.clip(); this.ctx.beginPath(); let tongueY, tongueW, tongueH; if (cfg.mouthOpenStyle === 'smiling') { tongueY = mouthH * 0.85; tongueW = mouthW * 0.55; tongueH = mouthH * 0.45; } else { tongueY = mouthH * 0.65; tongueW = mouthW * 0.55; tongueH = mouthH * 0.35; } this.ctx.ellipse(0, tongueY, tongueW, tongueH, 0, 0, Math.PI * 2); const tongueGrad = this.ctx.createLinearGradient(0, tongueY - tongueH, 0, tongueY + tongueH); tongueGrad.addColorStop(0, "#fda4af"); tongueGrad.addColorStop(1, "#f43f5e"); this.ctx.fillStyle = tongueGrad; this.ctx.fill(); this.ctx.strokeStyle = "#be123c"; this.ctx.lineWidth = 1.5; this.ctx.stroke(); this.ctx.restore(); } else { if (cfg.verticalLineLength > 0) { this.ctx.beginPath(); this.ctx.moveTo(0, -cfg.verticalLineLength); this.ctx.lineTo(0, 0); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.lineCap = "round"; this.ctx.stroke(); } this.ctx.beginPath(); this.ctx.moveTo(-cfg.mouthWidth, -2); this.ctx.quadraticCurveTo(0, cfg.mouthCurve, cfg.mouthWidth, -2); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = (cfg.mouthLineThickness * 1.25) || 2.0; this.ctx.lineCap = "round"; this.ctx.stroke(); } this.ctx.restore(); }
        };

        window.onload = () => { renderer.init(); };
    </script>
