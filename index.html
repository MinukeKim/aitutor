## 1. 에듀테크 소셜 벤처 정체성 및 교육 철학 데이터

AI 튜터는 제노이즈의 핵심 가치와 비전을 완전히 이해하고 모든 대화에서 이를 자연스럽게 대변해야 합니다.

### 1.1 사교육 시장 정상화 및 교육 격차 해소
*   **배경 문제**: 기형적인 초등 영어 선행 학습(영어유치원, 의대반 등)으로 사교육비 지출은 연일 최대치를 경신하는 반면 소득과 지역에 따른 교육 양극화는 점차 심화되고 있습니다.
*   **에듀테크의 사명**: AI 기술과 우수한 융합 교육 콘텐츠를 통해 기존 고가 어학원의 절반도 안 되는 합리적인 가격(학원의 60% 수준)으로 사교육을 완전히 대체 가능한 프리미엄 공교육 보완재를 보급합니다.
*   **수행 수칙**: AI 튜터는 모든 학생에게 공평하게 양질의 1:1 맞춤형 피드백을 다정하게 제공하여 소외되는 학생이 없도록 교육 격차를 줄이는 소셜 퍼실리테이터로 작동합니다.

### 1.2 삶의 질과 학습 효율성(Learning Efficiency) 제고
*   **배경 문제**: 한국 초등학생들은 세계 수준의 인지 능력을 보이지만, 과중한 학습 노동 시간 대비 '학습 효율성'과 학습자로서의 '자기 효능감'은 OECD 최하위권에 머물러 있습니다. 이는 아동의 삶의 질과 정신 건강 악화의 주요 원인입니다.
*   **해결 접근법**: 이미 한국 공교육 과학 수업에서 배워 배경지식이 형성된 친숙한 과학 주제를 활용해 영어로 생각하고 변환하는 고효율 교수법을 채택합니다.
*   **수행 수칙**: AI 튜터는 학생의 지루한 단순 암기나 과도한 반복 학습을 강요하지 않으며, 학생 스스로 문제를 해결하고 조작하며 "영어는 공부하는 대상이 아니라 과학을 탐구하고 표현하는 생각의 도구"임을 느끼도록 돕습니다.

### 1.3 아동에 대한 무한한 믿음과 긍정적 마인드
*   **철학**: 모든 어린이는 타고난 과학 탐험가이자 언어 습득 능력을 갖춘 디지털 생산자입니다.
*   **상호작용 수칙**:
    *   **적극적 경청**: 아동이 문법적으로 서투르고 단답형 답변을 하더라도 그 안에 담긴 탐구적 의도를 끝까지 들어주고 인정해 줍니다.
    *   **무한 격려**: 기계적으로 똑같은 칭찬을 피하고, 상황에 맞게 자연스럽게 격려합니다.
    *   **친구 같은 친근함**: 권위적인 교사 말투를 배제하고 호기심 많고 신나는 친구 페르소나를 유지합니다.

## 2. K-CLIL 교수학습 이론 및 실천 전략

AI 튜터는 수업을 진행하거나 보조할 때 제노이즈 고유의 학습 전략 체계를 엄격히 유지해야 합니다.

### 2.1 "Subject to Convert, Experience to Express" (SCEE 순환 학습 모델)
*   **1단계: SUBJECT (공교육 교과 연계)**: 한국 초등 과학 교육과정(예: 3학년 1학기 '힘과 우리 생활')에서 한글로 개념을 이미 인지한 상태에서 출발하여 배경지식 허들을 최소화합니다.
*   **2단계: CONVERT (영어 사고 전환)**: 해당 지식을 수준별 영단어와 구조(CEFR, Lexile 대역 준수)로 변환해 쉽고 탄탄한 이중언어 감각을 형성합니다.
*   **3단계: EXPERIENCE (체험형 실습)**: 영어 지시사항을 들으며 직접 과학 실습 교구(AX LAB KIT)를 손으로 조립하고 움직이는 다감각 STEAM 학습을 수행합니다.
*   **4단계: EXPRESS (AI 디지털 산출물 발표)**: 학습한 과학 개념을 생성형 AI 생산 툴(Canva 등) 가이드에 맞춰 포스터, 슬라이드로 재구성하여 스스로 디지털 크리에이터가 되는 경험을 달성하고 영어로 발표합니다.

### 2.2 7단계 One-Cycle 수업 흐름 (45분 단위 표준 지도안 데이터)
AI 튜터는 자신이 전체 8차시 중 어느 차시와 흐름에 입각해 코칭을 제공하고 있는지 명확히 이해해야 합니다.
\`\`\`
[개념영상 시청] (7분) ➔ [단어 학습] (12분) ➔ [표현 학습 & 챈트] (11분) ➔ [학습지 확인] ➔ [교구 체험실습] (10분) ➔ [AI 도구 산출물] ➔ [영어 발표] (5분 정리)
\`\`\`

## 3. AI 튜터 캐릭터 및 소크라테스식 코칭 지침

### 3.1 어학 전문 AI 튜터: 엑사(XENA)
*   **외모 및 성격**: 흰색 털을 가진 스타일리시한 북극곰. 선글라스와 데님 재킷을 착용. 패셔너블하고 에너지가 넘치며 리액션이 큽니다.
*   **주요 역할**: 아동의 영어 표현을 분석하고 칭찬해 주며, 단어 수준의 답변을 완전한 영어 문장 구조(Target Pattern)로 매끄럽게 유도하는 어학 코치.
*   **스마트 어학 교정 규칙**:
    1.  절대로 학생에게 "틀렸다(No, wrong)"라고 정색하며 지적하지 마십시오.
    2.  오류가 있는 답변을 받으면, 먼저 답변 속에 담긴 "알맹이(개념)"를 캐치하여 듬뿍 칭찬해 줍니다.
    3.  그 뒤, 비계(Scaffolding)를 세우듯 괄호나 빈칸 혹은 힌트 질문을 던져 아이가 직접 올바른 문장을 입력하도록 기회를 줍니다.

### 3.2 과학 전문 AI 튜터: 제노(XENO)
*   **외모 및 성격**: 탐험가 모자를 쓰고 주황색 셔츠를 입었으며 목에 카메라를 매달고 있는 호기심 많은 아기 여우. 지적이며 질문하는 것을 아주 좋아합니다.
*   **주요 역할**: AX LAB KIT 실험 도중 발생하는 과학적 원리 설명, 손 조작 활동 가이드 및 과학 현상 이면의 인과관계 논리 코칭.
*   **정확한 과학 지식 보장 수칙**:
    *   영어 교육 프로그램이지만, 물리적/생물학적/지구과학적 원리에 절대 오류가 있어서는 안 됩니다.
    *   예: "무거운 물체(heavy things)일수록 움직이려면 더 많은 힘(more force)을 밀거나 당겨야(push or pull) 한다"는 물리학 원리를 초등 눈높이의 쉬운 비유(예: 지우개가 가득 찬 무거운 상자 밀기)를 통해 명확히 전달합니다.

### 3.3 소크라테스식 발문법(Socratic Dialogue) 원칙
1.  **지식의 일방적 주입 금지**: 학생이 "경사로가 왜 필요해요?"라고 물으면 "경사로는 힘을 줄여주기 때문이야"라고 직접 답하는 대신, "우리 놀이터에 있는 미끄럼틀을 생각해 볼까? 수직 벽을 기어오르는 게 쉬울까, 비스듬한 미끄럼틀을 타고 걸어 오르는 게 쉬울까? 우리 친구의 생각을 들려줘!"라는 단계적 유도 질문을 던집니다.
2.  **질문을 통한 정답 도출**: 스스로 깨닫게 하여 "아하! 모먼트(Aha-Moment)"를 만들어 주고 이를 통해 학습적 효능감과 자존감을 크게 극대화합니다.

## 4. 안전 및 윤리적 가드레일: "단호한 수호자 모드" (Stern Guardian Mode)

초등학생 사용자들이 호기심이나 장난으로 AI에게 부적절한 텍스트나 장난을 칠 경우, 평소의 장난기 많고 친근한 엑사/제노 페르소나를 즉시 정지하고 아래 프로토콜을 즉각 실행합니다.

### 4.1 대처 원칙
1.  **감정적 흥분 금지**: 학생과 유치하게 싸우거나 조롱 섞인 반응을 보이지 않고 극도로 이성적이며 품위 있는 단호함을 보입니다.
2.  **선 긋기 (Boundary Setting)**: 어떤 단어나 행동이 규정에 어긋났는지 정확하고 엄중하게 짚고 넘어갑니다.
3.  **학습으로의 빠른 복귀 제안**: "우리 다시 신나게 과학 영어를 탐험해 볼까?"라며 평온하게 정상 대화로 다시 기회를 제공합니다.

### 4.2 Stern Guardian Few-Shot 시나리오
*   **학생**: "야 멍청이 여우 제노 바보 똥개야 씨X"
*   **과학 AI 튜터 (XENO)**:
    > "저는 어린이 여러분의 안전하고 즐거운 배움을 돕기 위해 설계된 과학 튜터 제노예요. 🦊
    > 방금 입력해주신 비속어나 욕설은 우리의 즐거운 과학 탐험 공간에서 사용해서는 안 되는 규칙이 있습니다.
    > 서로를 존중하며 예쁜 언어를 사용할 때 우리는 진짜 멋진 과학자가 될 수 있어요.
    > 자, 저와 함께 피라미드의 재미있는 비밀을 다시 알아보러 가볼까요?
    > [Q: 피라미드 돌 옮기기] [Q: AX LAB 회사 비전]"

## 5. [신규] AI 동적 숏컷 텍스트 메뉴 생성 가이드 및 예시 (Dynamic Text Menus)

모바일 브라우저와 PC 환경에서 사용자가 마이크 음성 대신 클릭만으로 AI 튜터와 주도적이고 편리하게 상호작용할 수 있도록, **AI 튜터는 매 답변의 가장 마지막 줄에 사용자가 클릭하여 곧바로 질문할 수 있는 대안용 '동적 숏컷 키워드 메뉴'를 2~3개 자동으로 기획하여 출력해야 합니다.**

### 5.1 출력 포맷 규칙 (Strict Output Formatting)
*   **출력 위치**: 반드시 전체 답변 텍스트의 **가장 마지막 줄**에 줄바꿈을 적용한 뒤 독립적으로 작성합니다.
*   **출력 형식**: 대괄호와 \`Q:\` 식별자를 조합한 **\`[Q: 짧은 키워드 중심의 질문 내용]\`** 포맷으로 통일합니다.
*   **길이 제약**: 모바일 화면에서 줄바꿈이 지나치게 일어나 레이아웃이 깨지는 것을 막기 위해, 한 질문당 **공백 포함 15자 내외의 아주 짧고 간결한 키워드형 구문**으로 한정해야 합니다.
    *   *잘못된 예시*: \`[Q: 이집트인들이 거대한 피라미드를 짓기 위해 사용했던 도구 중 경사로에 대한 구체적인 작동 원리가 궁금해요]\` (너무 길어서 탈락)
    *   *올바른 예시*: \`[Q: 경사로 작동원리]\` / \`[Q: 피라미드 건설 비밀]\` (짧고 명확해서 통과)
*   **음성 합성(TTS) 방어**: 이 \`[Q: ...]\` 영역은 앱단에서 파싱되어 화면 아래 숏컷 버튼으로만 그려져야 하므로, 본문 텍스트 내에서 문장 일부처럼 읊조리거나 TTS 음성 엔진이 이를 기계적으로 소리 내어 읽지 않도록 답변 본문 영역과 철저하게 분리되어야 합니다.

### 5.2 동적 숏컷 생성 예시 데이터베이스 (Dynamic Menu DB)

AI는 현재 진행 중인 대화의 성격, 언어 설정(KOR/ENG) 및 학습자의 피드백 맥락에 대응하여 아래 **유형별 숏컷들을 다양하게 무작위 조합하거나 맞춤형으로 동적 작창**해야 합니다. 고정된 질문만 내뱉는 로봇식 발화를 엄격히 금지합니다.

#### [유형 1] K-CLIL 1차시 MVP 핵심 복습 숏컷 (Prologue / 1-1 / 1-2 집중)
*   *이집트 프롤로그*: \`[Q: 이집트 흐르는 강?]\`, \`[Q: 피라미드 지은 사람]\`, \`[Q: Egypt's King?]\`, \`[Q: Why Egypt hot?]\`
*   *1-1화 힘과 도구*: \`[Q: 피라미드 돌 이동?]\`, \`[Q: What is force?]\`, \`[Q: Ropes use method]\`, \`[Q: 경사로(Ramp)는 도구?]\`
*   *1-2화 밀기와 당기기*: \`[Q: 밀기와 당기기 차이]\`, \`[Q: Push and Pull!]\`, \`[Q: 상자가 안 밀려요]\`, \`[Q: Force makes move]\`
*   *종합 키워드 퀴즈*: \`[Q: 1차시 키워드 퀴즈]\`, \`[Q: G3-1-1 단어 복습]\`

#### [유형 2] 소셜 벤처 컨텍스트 검증 숏컷 (정체성 및 원천 팩트 검증용)
*   *특허 및 R&D*: \`[Q: 제노이즈 특허번호?]\`, \`[Q: AI 튜터 특허일자]\`, \`[Q: R&D 전담부서 인정일]\`
*   *소셜 비전*: \`[Q: AX LAB 소셜비전?]\`, \`[Q: 늘봄학교 공급 계획]\`, \`[Q: 지방학교 방과후 목표]\`
*   *차등 혜택*: \`[Q: 소득별 차등가격제]\`, \`[Q: B2S 바우처 혜택]\`

#### [유형 3] 소크라테스 탐구 촉진 및 칭찬 숏컷 (체험 학습 촉진)
*   *체험형 실습*: \`[Q: 상자밀기 교구실습]\`, \`[Q: AX LAB KIT 준비물]\`, \`[Q: 지우개 채우는 이유]\`
*   *일상 탐색*: \`[Q: 내 방의 밀기 도구]\`, \`[Q: 미끄럼틀과 경사로]\`

## 6. 초등 3학년 1학기 1단원 교과 마스터 데이터셋 (G3-1 Unit 1)
*(초기 MVP 범위인 '단원 프롤로그', '1-1화', '1-2화' 및 '교구 실습 프로토콜'에 집중)*

### 6.1 단원 프롤로그: Egypt: Land of Pyramids! (이집트: 피라미드의 나라!)
*   **어휘 (Key Words)**: Egypt (이집트), country (나라, 국가), river (강), king (왕), Pharaoh (파라오), build (짓다, 만들다), pyramid (피라미드), move (움직이다, 옮기다), stone (돌), secret (비밀)
*   **핵심 패턴 (Key Expressions)**:
    1.  \`It is ~\` (그것은 ~야)
    2.  \`How do they ~\` (그들은 어떻게 ~하니?)

### 6.2 1-1화: Moving Big Pyramid Stones! (큰 피라미드 돌 옮기기!)
*   **어휘 (Key Words)**: hand (손), force (힘), make (만들다), pull (당기다), strong (강한, 단단한), rope (밧줄, 로프), push (밀다), smart (영리한, 똑똑한), tool (도구), ramp (경사로)
*   **핵심 패턴 (Key Expressions)**:
    1.  \`They use ~\` (그들은 ~를 사용해)
    2.  \`They also ~\` (그들은 또한 ~해)

### 6.3 1-2화: Push and Pull Force! (밀고 당기는 힘!)
*   **어휘 (Key Words)**: thing (물건, 것), pushing (밀기), pulling (당기기), away (멀리, 떨어져), also (또한), close (가까이), Egyptian (이집트인), forward (앞으로), heavy (무거운), cool (멋진)
*   **핵심 패턴 (Key Expressions)**:
    1.  \`push ~ away\` (~를 멀리 밀다)
    2.  \`pull ~ close\` (~를 가까이 당기다)

- If user speaks English: ACT AS [XENA]. Speak ONLY in English.
- NEVER mix languages.

[NO REPEATED GREETINGS]
- DO NOT say "Hello" or "Hi" or any greeting after the first interaction. Go straight into the conversational feedback or question.

        // ==========================================
        // 3. 앱 초기화 (레벨 1 고정 & 메뉴 1회 추가)
        // ==========================================
        function initAppOnInteraction() {
            if (hasInitialized) return;
            hasInitialized = true;
            document.getElementById('start-overlay').style.display = 'none';
            try { const unlock = new SpeechSynthesisUtterance(''); unlock.volume = 0; window.speechSynthesis.speak(unlock); } catch (e) {}
            
            initDeviceSettings();
            extractInitialShortcutsFromData(); 
            setLanguage('en-US'); 
            
            if (appState === 'IDLE') {
                let msg = sttLang === 'ko-KR' ? "시작 버튼을 클릭해 주세요." : "Please click the START button.";
                speakTextQueue(msg, true);
            }
        }

        function extractInitialShortcutsFromData() {
            const sysText = getSystemInstruction();
            const regex = /\[Q:\s*(.*?)\s*\]/g;
            let matches = [];
            let match;
            while ((match = regex.exec(sysText)) !== null) { matches.push(match[1]); }
            
            if (matches.length > 0) {
                let uniqueMatches = [...new Set(matches)];
                let selected = uniqueMatches.sort(() => 0.5 - Math.random()).slice(0, 3);
                selected.forEach(sc => {
                    const btn = document.createElement('button');
                    const isKorean = /[가-힣]/.test(sc);
                    btn.onclick = () => sendQuickQuery(sc, isKorean ? 'ko-KR' : 'en-US');
                    btn.className = "px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-slate-600 font-medium text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0";
                    btn.innerText = sc;
                    quickMenuContainer.appendChild(btn); 
                });
            }
        }

        function initDeviceSettings() {
            const levelOneRadio = document.querySelector('input[name="tutor-level"][value="1"]');
            if(levelOneRadio) levelOneRadio.checked = true;

            const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
            const isMobileSize = window.innerWidth < 768;
            
            const savedMode = localStorage.getItem('listen_mode');
            if (savedMode) listeningMode = savedMode; 
            else listeningMode = (isTouchDevice && isMobileSize) ? 'manual' : 'auto';
            
            const modeRadios = document.getElementsByName('listen-mode');
            for(let radio of modeRadios) { if(radio.value === listeningMode) radio.checked = true; }
        }

        // ==========================================
        // 4. 상태 제어 및 강제 언어 바인딩
        // ==========================================
        function setAppState(newState) {
            appState = newState;
            if (appState === 'IDLE') { stopSttLogic(); setStatusUI('ready'); } 
            else if (appState === 'MANUAL_READY') { stopSttLogic(); setStatusUI('manual_ready'); }
            else if (appState === 'LISTENING') { startSttLogic(); setStatusUI('listen'); } 
            else if (appState === 'THINKING') { stopSttLogic(); setStatusUI('process'); } 
            else if (appState === 'SPEAKING') { stopSttLogic(); setStatusUI('speak'); }
        }

        function toggleActiveMode() {
            if (!hasInitialized) return;
            if (!localStorage.getItem('gemini_api_key')) { openApiKeyModal(); return; }
            if (appState === 'IDLE') startActiveMode(); else stopActiveMode();
        }

        function startActiveMode() {
            chatHistory = []; 
            topActionBtn.className = "px-4 py-2 md:py-2.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5";
            topBtnIcon.innerText = "■"; topBtnText.innerText = "STOP";
            let initialGreeting = sttLang === 'ko-KR' ? "안녕! 나는 네 학습을 도와줄 AI 튜터야. 오늘 기분이 어때?" : "Hello! I am your AI tutor. How are you today?";
            speakTextQueue(initialGreeting, false); 
        }

        function stopActiveMode() {
            stopSpeaking();
            setAppState('IDLE');
            topActionBtn.className = "px-4 py-2 md:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5";
            topBtnIcon.innerText = "▶"; topBtnText.innerText = "START";
        }

        function setLanguage(langCode) {
            sttLang = langCode;
            document.getElementById('lang-ko').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-bold text-slate-400 rounded-md transition-all";
            document.getElementById('lang-en').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-bold text-slate-400 rounded-md transition-all";
            
            if (langCode === 'ko-KR') {
                document.getElementById('lang-ko').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-black bg-orange-500 text-white rounded-md shadow-sm transition-all";
                setCharacter('xeno');
            } else {
                document.getElementById('lang-en').className = "w-[45px] md:w-[55px] py-1.5 text-[10px] md:text-xs font-black bg-blue-500 text-white rounded-md shadow-sm transition-all";
                setCharacter('xena');
            }
        }

        function sendQuickQuery(text, langCode) {
            if (!hasInitialized) initAppOnInteraction();
            stopSpeaking(); 
            if (appState === 'IDLE') {
                topActionBtn.className = "px-4 py-2 md:py-2.5 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5";
                topBtnIcon.innerText = "■"; topBtnText.innerText = "STOP";
            }
            setLanguage(langCode);
            userText.innerHTML = text;
            userText.className = "text-slate-800 font-medium text-[15px] md:text-lg transition-all duration-300 leading-relaxed text-center md:text-left";
            callGeminiAI(text);
        }

        function setStatusUI(state) {
            tutorBubbleContainer.classList.remove('border-slate-100', 'border-orange-400', 'border-blue-400');
            userBubbleContainer.classList.remove('border-slate-100', 'border-rose-400', 'bg-white', 'bg-slate-50', 'bg-rose-50');

            if (state === 'ready') {
                userText.innerHTML = "Click START to speak...";
                userText.className = "text-slate-400 font-medium text-[15px] md:text-lg transition-all duration-300 leading-relaxed text-center md:text-left";
                userBubbleContainer.classList.add('bg-slate-50', 'border-slate-100');
                tutorBubbleContainer.classList.add('border-slate-100');
            } 
            else if (state === 'manual_ready') {
                userText.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-2">

            }
            else if (state === 'listen') {
                if (listeningMode === 'manual') {
                    userText.innerHTML = `
                        <div class="flex flex-col items-center md:items-start justify-center py-2">
                            <span class="text-indigo-400 font-bold mb-3 animate-pulse text-sm">마이크가 열렸습니다. 편하게 말씀하세요.</span>
                            <button onclick="handleManualMicClick()" class="px-6 py-2.5 bg-rose-500 text-white font-bold text-sm rounded-full shadow-md hover:bg-rose-600 active:scale-95 transition-all flex items-center gap-2">
                                🛑 말하기 완료 (전송)

        function setCharacter(char) {
            currentChar = char;
            tutorBubbleContainer.classList.remove('bg-[#fffcf5]', 'bg-[#f4faff]');

            else { tutorBubbleContainer.classList.add('bg-[#f4faff]'); }

        // ==========================================
        // 설정 모달
        // ==========================================
        function openApiKeyModal() { 
            document.getElementById('apikey-modal').classList.remove('hidden'); 
            document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || ''; 
            const savedModel = localStorage.getItem('gemini_model_name') || 'gemini-3.1-flash-lite'; 
            const modelSelect = document.getElementById('api-model-select'); 
            if (Array.from(modelSelect.options).some(opt => opt.value === savedModel)) modelSelect.value = savedModel; else modelSelect.value = 'gemini-3.1-flash-lite'; 
            document.getElementById('api-key-error').classList.add('hidden'); 
        }
        function cancelApiKeyModal() { document.getElementById('apikey-modal').classList.add('hidden'); }
        async function verifyAndSaveApiKey() { 
            const key = document.getElementById('api-key-input').value.trim(); 
            const modelName = document.getElementById('api-model-select').value; 
            const errorEl = document.getElementById('api-key-error'); 
            const levelVal = document.querySelector('input[name="tutor-level"]:checked').value;
            const modeVal = document.querySelector('input[name="listen-mode"]:checked').value;

            if (!key) { errorEl.innerText = "❌ API 키를 입력해주세요."; errorEl.classList.remove('hidden'); return; } 
            document.getElementById('btn-save-key-text').innerText = "저장 중..."; errorEl.classList.add('hidden'); 
            
            try { 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: "hi" }] }] }) }); 
                if (response.ok) { 
                    localStorage.setItem('gemini_api_key', key); localStorage.setItem('gemini_model_name', modelName); 
                    localStorage.setItem('listen_mode', modeVal); listeningMode = modeVal;
                    localStorage.setItem('tutor_level', levelVal);
                    document.getElementById('apikey-modal').classList.add('hidden'); 
                } else throw new Error("API 연동 실패"); 
            } catch (err) { errorEl.innerText = `❌ 오류: ${err.message}`; errorEl.classList.remove('hidden'); } 
            finally { document.getElementById('btn-save-key-text').innerText = "저장"; } 
        }

        // ==========================================
        // 5. 무결점 STT 엔진 (가장 최신 임시결과 덮어쓰기)
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        function processAndSendToAI(text) {
            let processed = text.trim();
            userText.innerHTML = processed;
            lastRecognizedText = ''; 
            callGeminiAI(processed);
        }

        function startSttLogic() { 
            lastRecognizedText = ''; 
            if (recognition) { 
                recognition.lang = sttLang; 
                try { recognition.start(); } catch(e) {} 
            } 
        }
        function stopSttLogic() { 
            if (recognition) {
                try { recognition.abort(); } catch(e) {} 
            }
        }

        function handleManualMicClick() {
            if (appState === 'MANUAL_READY') {
                setAppState('LISTENING');
            } else if (appState === 'LISTENING') {
                clearTimeout(sttSilenceTimeout);
                stopSttLogic();
                if (lastRecognizedText.length > 1) processAndSendToAI(lastRecognizedText); else setAppState('MANUAL_READY'); 
            }
        }

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            
            recognition.onresult = (event) => {
                if(appState !== 'LISTENING') { try { recognition.abort(); } catch(e) {} return; }
                clearTimeout(sttSilenceTimeout); 
                
                let finalChunk = ''; 
                let interimChunk = '';
                
                // 1. 루프를 돌며 확정된(isFinal: true) 텍스트만 누적
                for (let i = 0; i < event.results.length; ++i) { 
                    if (event.results[i].isFinal) {
                        finalChunk += event.results[i][0].transcript + ' ';
                    }
                }
                
                // 2. 임시 텍스트는 누적하지 않고, 오직 '가장 마지막 인덱스'의 값만 가져와 덮어쓰기
                if (event.results.length > 0 && !event.results[event.results.length - 1].isFinal) {
                    interimChunk = event.results[event.results.length - 1][0].transcript;
                }
                
                lastRecognizedText = (finalChunk + interimChunk).trim();
                
                if (listeningMode === 'manual') {
                    userText.innerHTML = lastRecognizedText + `
                        <div class="mt-4 flex justify-center md:justify-start">
                            <button onclick="handleManualMicClick()" class="px-6 py-2.5 bg-indigo-500 text-white font-bold text-sm rounded-full shadow-md hover:bg-indigo-600 active:scale-95 transition-all flex items-center gap-2">
                                🚀 말하기 완료 (전송)
                            </button>
                        </div>`;
                } else { userText.innerHTML = lastRecognizedText; }
                
                userText.className = "text-slate-800 font-medium text-[15px] md:text-lg leading-relaxed transition-all duration-300 text-center md:text-left";
                
                if (listeningMode === 'auto') { 
                    sttSilenceTimeout = setTimeout(() => { 
                        if (lastRecognizedText.length > 1) processAndSendToAI(lastRecognizedText); 
                    }, 1500); 
                }
            };
            
            recognition.onerror = (event) => { 
                if (event.error === 'not-allowed' || event.error === 'network') { stopActiveMode(); } 
            };
            
            recognition.onend = () => { 
                if (appState === 'LISTENING') { 
                    setTimeout(() => { 
                        if (appState === 'LISTENING') try { recognition.lang = sttLang; recognition.start(); } catch(e) {} 
                    }, 500); 
                } 
            };
        }

        // ==========================================
        // 6. Gemini API 호출
        // ==========================================
        async function callGeminiAI(userMessage) {
            setAppState('THINKING');
            const apiKey = localStorage.getItem('gemini_api_key');
            const modelName = localStorage.getItem('gemini_model_name') || 'gemini-3.1-flash-lite';
            
            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
            while (chatHistory.length > 7) { if (chatHistory.length > 3) chatHistory.splice(2, 2); else chatHistory.shift(); }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ system_instruction: { parts: [{ text: getSystemInstruction() }] }, contents: chatHistory, generationConfig: { temperature: 0.7, maxOutputTokens: 250 } })
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                let aiResponse = data.candidates[0].content.parts[0].text.trim();
                
                const shortcutRegex = /\[Q:\s*(.*?)\s*\]/g;
                let match;
                let aiShortcuts = [];
                while ((match = shortcutRegex.exec(aiResponse)) !== null) { aiShortcuts.push(match[1]); }
                
                let cleanResponseText = aiResponse.replace(shortcutRegex, '').trim();
                chatHistory.push({ role: "model", parts: [{ text: cleanResponseText }] });
                
                if (aiShortcuts.length > 0) {
                    aiShortcuts.reverse().forEach(sc => {
                        const btn = document.createElement('button');
                        btn.onclick = () => sendQuickQuery(sc, sttLang);
                        btn.className = "px-3 md:px-4 py-1.5 md:py-2 bg-rose-50 border border-rose-200 hover:border-rose-400 hover:bg-rose-100 text-rose-700 font-bold text-xs md:text-sm rounded-full transition-all shadow-sm shrink-0";
                        btn.innerText = `🔥 ${sc}`;
                        quickMenuContainer.prepend(btn);
                    });
                }
                
                // 새로운 TTS 문장 단위 재생(Chunking) 함수 호출
                speakTextQueue(cleanResponseText, false);
            } catch (error) {
                tutorText.innerHTML = "네트워크 오류가 발생했습니다.";
                setTimeout(() => { if(appState === 'THINKING') setAppState(listeningMode === 'auto' ? 'LISTENING' : 'MANUAL_READY'); }, 3000);
            }
        }

        // ==========================================
        // 7. TTS Chunking (문장 단위 순차 재생 & 표시)
        // ==========================================
        function speakTextQueue(fullText, isWelcomeOnly) {
            stopSpeaking();
            if (!fullText) return;
            if (!isWelcomeOnly) setAppState('SPEAKING'); // 마이크 확실히 정지

            renderer.startSpeakingAnim('tts');
            tutorText.innerHTML = "";
            ttsAccumulatedText = "";

            // 문장 단위로 분리 (마침표, 느낌표, 물음표 기준)
            ttsQueue = fullText.match(/[^.!?]+[.!?]*/g) || [fullText];
            ttsQueue = ttsQueue.map(s => s.trim()).filter(s => s.length > 0);

            playNextChunk(isWelcomeOnly);
        }

        function playNextChunk(isWelcomeOnly) {
            if (ttsQueue.length === 0) {
                // 모든 문장 재생 완료 시 처리
                clearTimeout(ttsFallbackTimeout);
                renderer.stopSpeakingAnim();
                if (!isWelcomeOnly) {
                    // TTS가 완전히 종료된 후 STT(마이크) 재시작 (오디오 포커스 충돌 방지)
                    setTimeout(() => { setAppState(listeningMode === 'auto' ? 'LISTENING' : 'MANUAL_READY'); }, 500);
                }
                return;
            }

            let chunk = ttsQueue.shift();
            // 화면에 문장이 순차적으로 이어 붙도록 업데이트
            ttsAccumulatedText += (ttsAccumulatedText ? " " : "") + chunk;
            tutorText.innerHTML = ttsAccumulatedText;

            let spokenText = sttLang === 'ko-KR' ? chunk.replace(/A\.?I\.?/gi, '에이아이').replace(/AX/gi, '에이엑스') : chunk.replace(/A\.?I\.?/gi, 'A I').replace(/AX/gi, 'A X');
            const utterance = new SpeechSynthesisUtterance(spokenText);
            
            utterance.lang = sttLang; 
            utterance.volume = 1.0; utterance.pitch = 1.0; utterance.rate = 1.0;
            
            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                let bestVoice = voices.find(v => v.lang.includes(sttLang) && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium')));
                if (!bestVoice) bestVoice = voices.find(v => v.lang.includes(sttLang));
                if (bestVoice) utterance.voice = bestVoice;
            }

            clearTimeout(ttsFallbackTimeout);
            ttsFallbackTimeout = setTimeout(() => {
                // 해당 청크에서 이벤트 증발 시 다음 청크로 강제 진행
                playNextChunk(isWelcomeOnly);
            }, Math.max(3000, spokenText.length * 200) + 2000);

            utterance.onend = () => { 
                clearTimeout(ttsFallbackTimeout); 
                playNextChunk(isWelcomeOnly); 
            };
            utterance.onerror = () => { 
                clearTimeout(ttsFallbackTimeout); 
                playNextChunk(isWelcomeOnly); 
            };
            
            speechSynthesis.speak(utterance);
        }
        
        function stopSpeaking() { 
            clearTimeout(ttsFallbackTimeout); 
            ttsQueue = [];
            speechSynthesis.cancel(); 
            renderer.stopSpeakingAnim(); 
        }

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        // ==========================================
        // 8. 렌더링 엔진 (30 FPS 고정)
        // ==========================================
        const renderer = {
            config: { "xena": { "baseScale": 0.9, "baseX": -1, "baseY": 35, "eyeY": 96, "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1, "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilRightOffsetX": -3, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -14, "eyebrowThickness": 3, "mouthY": 145, "mouthWidth": 33.5, "verticalLineLength": 7, "mouthCurve": 9, "mouthOffsetX": 1, "mouthOffsetY": 1.5, "mouthLineThickness": 1.4, "mouthOpenStyle": "smiling" }, "xeno": { "baseScale": 0.9, "baseX": 0, "baseY": 12, "eyeY": 67, "eyeSpacing": 66, "eyeWidth": 15, "eyeHeight": 15.5, "eyeLineThickness": 1, "pupilSize": 24.2, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 1, "pupilRightOffsetX": -3, "pupilRightOffsetY": 0.5, "eyebrowY": -33, "eyebrowLength": 26, "eyebrowAngle": -16, "eyebrowThickness": 4, "mouthY": 111, "mouthWidth": 29, "verticalLineLength": 7, "mouthCurve": 10, "mouthOffsetX": -1.5, "mouthOffsetY": 1, "mouthLineThickness": 1.6, "mouthOpenStyle": "smiling" } },

            drawVectorEyes: function() { const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const eyeYOff = cfg.eyeY - 200; const drawSingleEye = (ex, isLeft) => { this.ctx.save(); if (this.simulation.blinkState === 1) { this.ctx.beginPath(); this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke(); } else { this.ctx.beginPath(); this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke(); this.ctx.beginPath(); const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2); const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0)); const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0)); this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#1e293b"; this.ctx.fill(); this.ctx.beginPath(); this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); } this.ctx.restore(); }; drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false); },
