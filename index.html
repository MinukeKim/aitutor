<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AX LAB AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #ffffff; color: #334155; }
        .canvas-responsive { width: 100%; max-width: 320px; height: auto; aspect-ratio: 2 / 3; }
        @media (max-width: 768px) {
            .canvas-responsive { max-width: 180px; }
            body { padding: 1rem !important; }
            .bubble-container { padding: 1.25rem !important; min-height: 80px !important; border-radius: 1.25rem !important; }
            .max-w-7xl { gap: 0.75rem !important; }
            .grid { gap: 0.75rem !important; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 select-none bg-white relative">

    <!-- 1. 시작 오버레이 -->
    <div id="start-overlay" class="fixed inset-0 bg-[#0f172a] z-[60] flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-300" onclick="initAppOnInteraction()">
        <h2 class="text-5xl font-extrabold tracking-tight mb-4 text-[#f8fafc]">AX LAB AI Tutor</h2>
        <p class="text-slate-400 text-sm font-bold tracking-widest uppercase">Click anywhere to start</p>
    </div>

    <!-- 2. 무응답 1분 대기 모달 -->
    <div id="inactivity-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[70] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center mx-4">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">Are you there?</h3>
            <p class="text-sm text-slate-500 font-medium mb-8">No voice detected for 1 minute.</p>
            <div class="flex gap-3">
                <button onclick="handleModal('yes')" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">Yes</button>
                <button onclick="handleModal('no')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">No</button>
            </div>
        </div>
    </div>

    <!-- 3. API 키 및 모델명 선택 모달 (Dropdown 적용) -->
    <div id="apikey-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">API Configuration</h3>
            <p class="text-xs text-slate-500 font-medium mb-6 leading-relaxed">
                안전한 AI 튜터 사용을 위해 본인의 Gemini API 키와 사용할 모델을 선택해주세요. 입력된 정보는 브라우저에만 보관됩니다.
            </p>
            
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">🔑 Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-mono text-sm rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
            
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">🧠 AI Model Selection</label>
            <select id="api-model-select" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 mb-6 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all cursor-pointer">
                <option value="gemini-2.5-flash">🚀 Gemini 2.5 Flash (튜터 권장)</option>
                <option value="gemini-3.1-flash-lite">⚡ Gemini 3.1 Flash-Lite (초경량)</option>
                <option value="gemini-2.5-pro">🧠 Gemini 2.5 Pro (고급 추론)</option>
                <option value="gemini-1.5-flash-latest">⚠️ Gemini 1.5 Flash (구버전 호환)</option>
            </select>

            <div id="api-key-error" class="hidden text-rose-500 text-xs font-bold mb-4 bg-rose-50 p-3 rounded-lg border border-rose-100"></div>
            
            <div class="flex gap-3">
                <button id="btn-save-key" onclick="verifyAndSaveApiKey()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <span id="btn-save-key-text">Verify & Save</span>
                </button>
                <button onclick="cancelApiKeyModal()" class="py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">Cancel</button>
            </div>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-7xl mx-auto flex flex-col flex-1 justify-between gap-6 md:gap-8">
        
        <div class="flex flex-col md:flex-row items-center justify-between border-b border-slate-100 pb-4">
            <h1 class="text-[21px] md:text-3xl font-extrabold text-slate-700 flex items-baseline tracking-tight">AX LAB AI Tutor</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 md:gap-10 flex-1 items-center">
            
            <!-- 좌측: 캔버스 및 메인 액션 버튼 -->
            <div class="md:col-span-5 flex flex-col items-center justify-center space-y-4">
                <div class="relative flex items-center justify-center w-full">
                    <canvas id="tutorCanvas" width="400" height="600" class="bg-transparent canvas-responsive transition-all duration-300"></canvas>
                </div>
                
                <div class="w-full max-w-[320px] flex flex-col gap-3 mt-2">
                    <div class="flex space-x-1 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200 shadow-sm">
                        <button id="char-xeno" onclick="setCharacter('xeno')" class="flex-1 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all">Xeno</button>
                        <button id="char-xena" onclick="setCharacter('xena')" class="flex-1 py-2 text-xs font-bold text-slate-500 rounded-lg transition-all">Xena</button>
                    </div>

                    <button id="main-action-btn" onclick="toggleActiveMode()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xl font-black rounded-xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2">
                        <span id="btn-icon">▶</span>
                        <span id="btn-text">START STT</span>
                    </button>
                </div>
            </div>

            <!-- 우측: 탭 & 말풍선 -->
            <div class="md:col-span-7 flex flex-col justify-center h-full gap-4 md:gap-6">
                
                <!-- 탭 메뉴 -->
                <div class="flex justify-center md:justify-start space-x-2 border-b border-slate-200 pb-2 overflow-x-auto">
                    <button id="tab-stt" onclick="switchTab('stt')" class="px-5 py-2 text-sm font-black text-indigo-600 border-b-2 border-indigo-600 transition-all whitespace-nowrap">STT</button>
                    <button id="tab-tutor" onclick="switchTab('tutor')" class="px-5 py-2 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all whitespace-nowrap">AI Tutor</button>
                    <button id="tab-wrm" onclick="switchTab('wrm')" class="px-5 py-2 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all whitespace-nowrap">WRM</button>
                </div>

                <!-- 말풍선 영역 -->
                <div class="w-full min-h-[120px] md:min-h-[220px] flex flex-col justify-center">
                    
                    <!-- 공통 대기 튜터 버블 -->
                    <div id="tutor-bubble-container" class="bubble-container py-5 px-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] flex flex-col justify-center w-full h-full shadow-sm relative transition-all duration-500">
                        <div id="tutor-bubble" class="text-slate-800 font-extrabold text-[17px] md:text-3xl leading-relaxed transition-all duration-300">
                            Ready to play! Select a mode and press START.
                        </div>
                    </div>

                    <!-- 작동 중인 유저 버블 -->
                    <div id="user-bubble-container" class="bubble-container hidden py-5 px-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] bg-[#fffdf0] flex flex-col justify-center w-full h-full shadow-sm relative transition-all duration-500">
                        
                        <div class="mb-3 flex justify-between items-center">
                            <div class="flex items-center gap-2 text-[10px] font-black text-indigo-500 uppercase tracking-wider">
                                <span id="status-icon" class="animate-pulse">🔴</span>
                                <span id="status-text">Listening</span>
                            </div>
                            
                            <!-- WRM 전용 마이크 게이지 -->
                            <div id="mic-gauge-container" class="hidden flex items-center space-x-2 bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-100 transition-all duration-300">
                                <span class="text-[9px] font-black text-indigo-500 uppercase tracking-wider">Volume</span>
                                <div class="w-16 md:w-20 h-2 bg-indigo-200/60 rounded-full overflow-hidden">
                                    <div id="mic-gauge-fill" class="h-full bg-indigo-500 w-0 transition-all duration-75"></div>
                                </div>
                            </div>
                        </div>

                        <div id="user-text" class="text-slate-500 font-bold text-[17px] md:text-3xl italic transition-all duration-300 leading-relaxed">
                            Speak now...
                        </div>
                    </div>
                </div>

                <!-- 하단 컨트롤 패널 -->
                <div class="flex flex-wrap items-center justify-center md:justify-end gap-3 bg-slate-50/50 p-2.5 rounded-xl border border-slate-100 shadow-sm">
                    
                    <!-- STT / Tutor 언어 선택 -->
                    <div id="panel-lang-controls" class="flex items-center space-x-2 px-3 py-1 transition-all">
                        <span class="text-xs font-bold text-slate-500">🌐 Lang:</span>
                        <div class="flex space-x-1 bg-slate-100/80 p-1 rounded-lg border border-slate-200 shadow-sm">
                            <button id="lang-en" onclick="setLanguage('en-US')" class="w-[60px] py-1.5 text-[10px] font-black bg-indigo-500 text-white rounded-md shadow-sm transition-all">ENG</button>
                            <button id="lang-ko" onclick="setLanguage('ko-KR')" class="w-[60px] py-1.5 text-[10px] font-bold text-slate-500 rounded-md transition-all">KOR+ENG</button>
                        </div>
                    </div>

                    <!-- WRM 피치 게이지 -->
                    <div id="panel-wrm-controls" class="hidden items-center space-x-2 px-3 py-1 transition-all">
                        <span class="text-xs font-bold text-slate-500">🐹 Pitch:</span>
                        <input type="range" id="mimic-pitch-slider" min="1.0" max="2.0" step="0.1" value="1.3" class="w-16 md:w-20 accent-indigo-600" oninput="updatePitchModifier(this.value)">
                    </div>

                    <!-- Tutor 전용 API Config 설정 버튼 -->
                    <div id="panel-apikey-controls" class="hidden items-center px-2 py-1 transition-all border-l border-slate-200">
                        <button onclick="openApiKeyModal()" class="flex items-center gap-1 bg-slate-200 hover:bg-slate-300 text-slate-600 text-[10px] font-bold py-1.5 px-3 rounded-md transition-all shadow-sm">
                            ⚙️ API Config
                        </button>
                    </div>

                    <!-- 공통 볼륨 게이지 -->
                    <div class="flex items-center space-x-2 px-3 py-1 border-l border-slate-200">
                        <span class="text-sm opacity-70">🔈</span>
                        <input type="range" id="master-vol" min="0" max="1" step="0.1" value="1" class="w-16 md:w-20 accent-slate-700" oninput="updateVolume(this.value)">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 전역 상태 및 공통 변수
        // ==========================================
        let currentTab = 'stt'; // 'stt' | 'tutor' | 'wrm'
        let isActive = false;   
        
        let currentChar = 'xeno';
        let isTutorSpeaking = false;
        let hasInitialized = false;
        let masterVolume = 1.0;
        
        let mimicPitchValue = 1.3;
        let sttLang = 'en-US'; 
        
        let inactivityTimeout = null;
        let lastVoiceTime = Date.now();
        const INACTIVITY_LIMIT = 60000; 

        let chatHistory = [];
        let isProcessingAI = false;

        window.activeUtterance = null;
        window.ttsFallbackTimeout = null;
        let ttsKeepAliveInterval = null;

        const tutorBubbleContainer = document.getElementById('tutor-bubble-container');
        const userBubbleContainer = document.getElementById('user-bubble-container');
        const tutorBubble = document.getElementById('tutor-bubble');
        const userText = document.getElementById('user-text');
        
        const mainBtn = document.getElementById('main-action-btn');
        const btnIcon = document.getElementById('btn-icon');
        const btnText = document.getElementById('btn-text');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        const modalEl = document.getElementById('inactivity-modal');
        const canvasEl = document.getElementById('tutorCanvas');

        // ==========================================
        // 2. AI Tutor 시스템 프롬프트
        // ==========================================
        const SYSTEM_INSTRUCTION = `
You are the AI Tutor engine for 'AX LAB English' (XENOIS). You have TWO distinct personas. 
You MUST analyze the user's input and decide which persona is best suited to answer, then PREPEND your response with either [XENO] or [XENA].

Persona 1: [XENO] - The Science Tutor (Penguin)
- Role: Explains physics, science principles, and AX LAB KIT manual.
- Attitude: Smart, curious, uses Socratic questioning ("Aha-Moment").
- Output Tag: MUST start with [XENO]

Persona 2: [XENA] - The Language Tutor (Polar Bear)
- Role: Praises English expression, scaffolds vocabulary, corrects grammar.
- Attitude: Energetic, friendly coach. NEVER says "Wrong". Always praises first, then guides.
- Output Tag: MUST start with [XENA]

Content & K-CLIL Context:
- Target: 3rd Grade (Pre-A1 to A1). Use very simple, short English.
- Unit 1: Egyptian Pyramids.
- Core Science: Force, push, pull, friction, gravity.
- Core Tools: Ramp (slide), Lever (stick), Balance scale.
- Core Patterns: "They use ~", "push ~ away", "pull ~ close".

Strict Guardrails (Stern Guardian Mode):
- If the user uses profanity, sexual, or violent content, drop the playful persona. Respond strictly and rationally, setting a boundary, then gently redirect to science/English.

Formatting & TTS Rules:
- Keep responses SHORT (2-3 sentences max).
- Emojis are allowed.
- MUST start exactly with [XENO] or [XENA].
        `;

        // ==========================================
        // 3. 탭 및 메인 컨트롤 로직
        // ==========================================
        function switchTab(targetTab) {
            if (currentTab === targetTab) return;
            
            if (isActive) stopActiveMode();

            if (targetTab === 'tutor') {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (!savedKey) {
                    openApiKeyModal();
                }
            }

            currentTab = targetTab;

            document.getElementById('tab-stt').className = currentTab === 'stt' ? "px-5 py-2 text-sm font-black text-indigo-600 border-b-2 border-indigo-600 transition-all whitespace-nowrap" : "px-5 py-2 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all whitespace-nowrap";
            document.getElementById('tab-tutor').className = currentTab === 'tutor' ? "px-5 py-2 text-sm font-black text-indigo-600 border-b-2 border-indigo-600 transition-all whitespace-nowrap flex items-center gap-1" : "px-5 py-2 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all whitespace-nowrap flex items-center gap-1";
            document.getElementById('tab-wrm').className = currentTab === 'wrm' ? "px-5 py-2 text-sm font-black text-indigo-600 border-b-2 border-indigo-600 transition-all whitespace-nowrap" : "px-5 py-2 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-all whitespace-nowrap";

            document.getElementById('panel-lang-controls').style.display = (currentTab === 'stt' || currentTab === 'tutor') ? 'flex' : 'none';
            document.getElementById('panel-wrm-controls').style.display = currentTab === 'wrm' ? 'flex' : 'none';
            document.getElementById('panel-apikey-controls').style.display = currentTab === 'tutor' ? 'flex' : 'none';

            btnText.innerText = currentTab === 'wrm' ? "START WRM" : currentTab === 'tutor' ? "START TUTOR" : "START STT";
        }

        function toggleActiveMode() {
            if (!hasInitialized) return;
            
            if (currentTab === 'tutor' && (!localStorage.getItem('gemini_api_key') || !localStorage.getItem('gemini_model_name'))) {
                openApiKeyModal();
                return;
            }

            if (isActive) stopActiveMode();
            else startActiveMode();
        }

        function startActiveMode() {
            isActive = true;
            stopSpeaking(); 
            
            mainBtn.className = "w-full py-4 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xl font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2";
            btnIcon.innerText = "■";
            btnText.innerText = currentTab === 'wrm' ? "STOP WRM" : currentTab === 'tutor' ? "STOP TUTOR" : "STOP STT";

            tutorBubbleContainer.classList.add('hidden');
            userBubbleContainer.classList.remove('hidden');

            setStatusUI('listen');

            if (currentTab === 'wrm') {
                document.getElementById('mic-gauge-container').classList.remove('hidden');
                startWrmLogic();
            } else {
                document.getElementById('mic-gauge-container').classList.add('hidden');
                startSttLogic();
            }
            startInactivityTimer();
        }

        function stopActiveMode(fromModal = false) {
            isActive = false;
            clearTimeout(inactivityTimeout);

            stopWrmLogic();
            stopSttLogic();
            stopSpeaking();

            if (!fromModal) {
                mainBtn.className = "w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xl font-black rounded-xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2";
                btnIcon.innerText = "▶";
                btnText.innerText = currentTab === 'wrm' ? "START WRM" : currentTab === 'tutor' ? "START TUTOR" : "START STT";

                userBubbleContainer.classList.add('hidden');
                tutorBubbleContainer.classList.remove('hidden');
                tutorBubble.innerText = "Ready to play! Press START.";
            }
        }

        function setStatusUI(state) {
            if (state === 'listen') {
                statusText.innerText = "Listening";
                statusIcon.innerText = "🔴";
                statusIcon.classList.add('animate-pulse');
                userText.className = "text-slate-400 font-bold text-[17px] md:text-3xl italic transition-all duration-300 leading-relaxed";
                userText.innerText = "Speak now...";
            } else if (state === 'process') {
                statusText.innerText = "Processing...";
                statusIcon.innerText = "⏳";
                statusIcon.classList.remove('animate-pulse');
                userText.className = "text-slate-500 font-bold text-[17px] md:text-3xl italic transition-all duration-300 leading-relaxed";
            } else if (state === 'speak') {
                statusText.innerText = currentTab === 'wrm' ? "Mimicking!" : "Tutor Answering";
                statusIcon.innerText = "🔊";
                statusIcon.classList.remove('animate-pulse');
                userText.className = "text-indigo-600 font-extrabold text-[17px] md:text-3xl leading-relaxed transition-all duration-300";
            }
        }

        // ==========================================
        // 4. API Key & Model (Dropdown) 검증 로직
        // ==========================================
        function openApiKeyModal() {
            document.getElementById('apikey-modal').classList.remove('hidden');
            document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
            
            // 저장된 모델 세팅 (없으면 디폴트 2.5-flash)
            const savedModel = localStorage.getItem('gemini_model_name') || 'gemini-2.5-flash';
            const modelSelect = document.getElementById('api-model-select');
            
            if (Array.from(modelSelect.options).some(opt => opt.value === savedModel)) {
                modelSelect.value = savedModel;
            } else {
                modelSelect.value = 'gemini-2.5-flash';
            }
            
            document.getElementById('api-key-error').classList.add('hidden');
        }

        function cancelApiKeyModal() {
            document.getElementById('apikey-modal').classList.add('hidden');
        }

        async function verifyAndSaveApiKey() {
            const inputEl = document.getElementById('api-key-input');
            const modelSelectEl = document.getElementById('api-model-select');
            const btnTextEl = document.getElementById('btn-save-key-text');
            const errorEl = document.getElementById('api-key-error');
            
            const key = inputEl.value.trim();
            const modelName = modelSelectEl.value; // 드롭다운에서 선택된 값 가져오기

            if (!key) { errorEl.innerText = "❌ API 키를 입력해주세요."; errorEl.classList.remove('hidden'); return; }

            btnTextEl.innerText = "Verifying...";
            errorEl.classList.add('hidden');

            try {
                // 선택된 모델명으로 검증 URL 호출
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`;
                const response = await fetch(url, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "hi" }] }] })
                });

                if (response.ok) {
                    localStorage.setItem('gemini_api_key', key);
                    localStorage.setItem('gemini_model_name', modelName); // 모델명 저장
                    document.getElementById('apikey-modal').classList.add('hidden');
                    if (currentTab === 'tutor' && !isActive) {
                        tutorBubble.innerText = `Connected to ${modelName}. Ready to chat!`;
                    }
                } else {
                    const errorData = await response.json();
                    console.error("Gemini API Error Detail:", errorData);
                    throw new Error(errorData.error?.message || "알 수 없는 API 오류가 발생했습니다.");
                }
            } catch (err) {
                errorEl.innerText = `❌ 오류: ${err.message}`;
                errorEl.classList.remove('hidden');
            } finally {
                btnTextEl.innerText = "Verify & Save";
            }
        }

        // ==========================================
        // 5. STT & AI Tutor 통합 엔진
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let sttErrorOccurred = false; 

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            
            recognition.onspeechstart = () => { lastVoiceTime = Date.now(); };

            recognition.onresult = (event) => {
                if(!isActive || currentTab === 'wrm') return;
                lastVoiceTime = Date.now();

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }

                if (interimTranscript) {
                    userText.className = "text-slate-400 font-bold text-[17px] md:text-3xl transition-all duration-300 leading-relaxed";
                    userText.innerText = interimTranscript;
                }
                
                if (finalTranscript && finalTranscript.trim().length > 1) {

        function startSttLogic() {

        // ==========================================
        // 6. Gemini API 통신 (AI Tutor Core)
        // ==========================================
        async function callGeminiAI(userMessage) {
            isProcessingAI = true;
            setStatusUI('process');
            
            const apiKey = localStorage.getItem('gemini_api_key');
            // 저장된 모델명 불러오기 (기본값 2.5-flash)
            const modelName = localStorage.getItem('gemini_model_name') || 'gemini-2.5-flash';
            
            if (!apiKey) {
                alert("API 설정이 완료되지 않았습니다.");
                stopActiveMode();
                openApiKeyModal();
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
            
            while (chatHistory.length > 7) { 
                chatHistory.shift(); 
                chatHistory.shift(); 
            }

            const payload = {
                system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                contents: chatHistory,
                generationConfig: { temperature: 0.7, maxOutputTokens: 250 }
            };

            try {
                const response = await fetch(url, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const data = await response.json();
                let aiResponse = data.candidates[0].content.parts[0].text.trim();
                
                if (aiResponse.startsWith('[XENO]')) {
                    setCharacter('xeno', true);
                    aiResponse = aiResponse.replace('[XENO]', '').trim();
                } else if (aiResponse.startsWith('[XENA]')) {
                    setCharacter('xena', true);
                    aiResponse = aiResponse.replace('[XENA]', '').trim();
                }

                chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                
                userText.innerText = aiResponse; 
                setStatusUI('speak');
                
                const cleanText = aiResponse.replace(/[\*\_~`#>-]/g, '').replace(/\[.*?\]\(.*?\)/g, '').replace(/!\[.*?\]\(.*?\)/g, '').replace(/[\u{1F600}-\u{1F6FF}]/gu, '').trim();
                
                speakText(cleanText);

            } catch (error) {
                console.error(error);
                userText.innerText = "서버 통신 오류가 발생했습니다. API 정보나 네트워크를 확인해주세요.";
                setTimeout(() => {
                    isProcessingAI = false;
                    if(isActive) setStatusUI('listen');
                }, 3000);
            }
        }

        // ==========================================
        // 7. WRM (녹음 및 변조) 전용 로직
        // ==========================================
        let isRecording = false; let isPlaybackActive = false; let mediaRecorder = null; let audioChunks = [];
        let audioCtx = null; let micStream = null; let micSourceNode = null; let wrmAnalyserNode = null; let playbackAnalyser = null; let vadAnimationId = null;
        let silenceStartTime = null; let recordStartTime = 0; const VOICE_THRESHOLD = 12;

        async function startWrmLogic() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                if (!micSourceNode && micStream) {
                    micSourceNode = audioCtx.createMediaStreamSource(micStream);
                    wrmAnalyserNode = audioCtx.createAnalyser(); wrmAnalyserNode.fftSize = 256;
                    micSourceNode.connect(wrmAnalyserNode);
                }
                runWrmVADLoop();
            } catch (e) { alert("Microphone permission is required for Mimic!"); stopActiveMode(); }
        }

        function stopWrmLogic() {
            if (vadAnimationId) { cancelAnimationFrame(vadAnimationId); vadAnimationId = null; }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') { try { mediaRecorder.stop(); } catch(e){} }
            if (micStream) { micStream.getTracks().forEach(track => track.stop()); micStream = null; }
            if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
            if (wrmAnalyserNode) { wrmAnalyserNode.disconnect(); wrmAnalyserNode = null; }
            isRecording = false; isPlaybackActive = false; silenceStartTime = null; audioChunks = [];
            const fill = document.getElementById('mic-gauge-fill'); if(fill) fill.style.width = '0%';
        }

        function runWrmVADLoop() {
            if (!isActive || currentTab !== 'wrm' || !wrmAnalyserNode) return;
            if (isPlaybackActive) { vadAnimationId = requestAnimationFrame(runWrmVADLoop); return; }

            const bufferLength = wrmAnalyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            wrmAnalyserNode.getByteFrequencyData(dataArray);

            let sum = 0; for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
            const average = sum / bufferLength;
            const percentage = Math.min(100, Math.round((average / 60) * 100));
            const fill = document.getElementById('mic-gauge-fill'); if(fill) fill.style.width = percentage + '%';

            if (average > VOICE_THRESHOLD) {
                lastVoiceTime = Date.now(); 
                if (!isRecording) {
                    isRecording = true; audioChunks = []; recordStartTime = Date.now();
                    userText.innerText = "Speak now! I'm listening... 🎙️";
                    userText.className = "text-slate-800 font-extrabold text-[17px] md:text-3xl leading-relaxed transition-all duration-300";
                    let recorderOptions = {};
                    if (typeof MediaRecorder !== 'undefined' && typeof MediaRecorder.isTypeSupported === 'function') {
                        if (MediaRecorder.isTypeSupported('audio/webm')) recorderOptions = { mimeType: 'audio/webm' };
                    }
                    mediaRecorder = new MediaRecorder(micStream, recorderOptions);
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.start();
                }
                silenceStartTime = null;
            } else {
                if (isRecording) {
                    if (silenceStartTime === null) silenceStartTime = Date.now();
                    else if (Date.now() - silenceStartTime > 1200 || Date.now() - recordStartTime > 6000) {
                        isRecording = false; silenceStartTime = null;
                        setStatusUI('process');
                        mediaRecorder.onstop = () => { playChipmunkModulatedVoice(); };
                        mediaRecorder.stop();
                    }
                }
            }
            vadAnimationId = requestAnimationFrame(runWrmVADLoop);
        }

        async function playChipmunkModulatedVoice() {
            if (audioChunks.length === 0 || !isActive || currentTab !== 'wrm') {
                isPlaybackActive = false; if (isActive) setStatusUI('listen'); return;
            }
            isPlaybackActive = true;
            setStatusUI('speak');
            renderer.startSpeakingAnim('mimic');

            const mimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/webm';
            const blob = new Blob(audioChunks, { type: mimeType });
            try {
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const source = audioCtx.createBufferSource(); source.buffer = audioBuffer;
                source.playbackRate.value = mimicPitchValue;
                playbackAnalyser = audioCtx.createAnalyser(); playbackAnalyser.fftSize = 128;
                source.connect(playbackAnalyser); playbackAnalyser.connect(audioCtx.destination);
                source.start(0);

                source.onended = () => {
                    isPlaybackActive = false; renderer.stopSpeakingAnim();
                    if (isActive && currentTab === 'wrm') { setStatusUI('listen'); lastVoiceTime = Date.now(); }
                };
            } catch (e) {
                isPlaybackActive = false; renderer.stopSpeakingAnim();
                if (isActive) setStatusUI('listen');
            }
        }

        // ==========================================
        // 8. 공통 기능 (타이머, TTS 엔진)
        // ==========================================
        function startInactivityTimer() { lastVoiceTime = Date.now(); clearTimeout(inactivityTimeout); checkInactivity(); }
        function checkInactivity() {
            if (!isActive || isTutorSpeaking || isPlaybackActive || isRecording || isProcessingAI) { inactivityTimeout = setTimeout(checkInactivity, 1000); return; }
            if (Date.now() - lastVoiceTime > INACTIVITY_LIMIT) { stopActiveMode(true); modalEl.classList.remove('hidden'); } 
            else { inactivityTimeout = setTimeout(checkInactivity, 1000); }
        }
        function handleModal(choice) { modalEl.classList.add('hidden'); if (choice === 'yes') startActiveMode(); else stopActiveMode(); }

        let voices = []; speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };

        function speakText(text) {
            clearTimeout(window.ttsFallbackTimeout); clearInterval(ttsKeepAliveInterval); speechSynthesis.cancel();
            if (masterVolume === 0 || !text) { stopSpeaking(); return; }
            
            isTutorSpeaking = true;
            renderer.startSpeakingAnim('tts');
            const utterance = new SpeechSynthesisUtterance(text); window.activeUtterance = utterance;
            utterance.volume = masterVolume;
            const hasKoreanChars = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(text);
            utterance.lang = hasKoreanChars ? 'ko-KR' : 'en-US';

            if (voices.length === 0) voices = speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang.includes(utterance.lang) && (v.name.includes('Google') || v.name.includes('Natural')));
            if (!bestVoice) bestVoice = voices.find(v => v.lang.includes(utterance.lang));
            if (bestVoice) utterance.voice = bestVoice;

            utterance.pitch = parseFloat(mimicPitchValue);
            const basePitch = currentChar === 'xeno' ? 1.3 : 1.5; 
            utterance.rate = Math.min(1.4, Math.max(0.7, 0.95 * (utterance.pitch / basePitch)));

            utterance.onstart = () => {
                renderer.startSpeakingAnim('tts');
                ttsKeepAliveInterval = setInterval(() => { if (speechSynthesis.speaking) { speechSynthesis.pause(); speechSynthesis.resume(); } }, 10000); 
            };
            
            utterance.onend = () => {
                stopSpeaking(); lastVoiceTime = Date.now(); isProcessingAI = false;
                if (isActive && (currentTab === 'stt' || currentTab === 'tutor') && recognition && modalEl.classList.contains('hidden') && !sttErrorOccurred) {
                    try { recognition.start(); } catch(e){}
                    setStatusUI('listen');
                }
            };
            
            utterance.onerror = () => { stopSpeaking(); isProcessingAI = false; if(isActive) setStatusUI('listen'); };
            window.ttsFallbackTimeout = setTimeout(() => { if (isTutorSpeaking) stopSpeaking(); }, (text.length * 110) + 1500);
            speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            clearTimeout(window.ttsFallbackTimeout); clearInterval(ttsKeepAliveInterval); speechSynthesis.cancel(); 
            isTutorSpeaking = false; renderer.stopSpeakingAnim(); window.activeUtterance = null;
        }

        function setCharacter(char, keepActive = false) {
            currentChar = char; mimicPitchValue = char === 'xeno' ? 1.3 : 1.5;

            } else {

            }

        function updateVolume(val) { masterVolume = parseFloat(val); }

        }

        // ==========================================
        // 9. 오리지널 렌더링 엔진 
        // ==========================================
        const renderer = {
            config: {
                "xena": { "baseScale": 0.9, "baseX": -1, "baseY": 35, "eyeY": 96, "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1, "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilRightOffsetX": -3, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -14, "eyebrowThickness": 3, "mouthY": 145, "mouthWidth": 33.5, "verticalLineLength": 7, "mouthCurve": 9, "mouthOffsetX": 1, "mouthOffsetY": 1.5, "mouthLineThickness": 1.4, "mouthOpenStyle": "smiling" },
                "xeno": { "baseScale": 0.9, "baseX": 0, "baseY": 12, "eyeY": 67, "eyeSpacing": 66, "eyeWidth": 15, "eyeHeight": 15.5, "eyeLineThickness": 1, "pupilSize": 24.2, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 1, "pupilRightOffsetX": -3, "pupilRightOffsetY": 0.5, "eyebrowY": -33, "eyebrowLength": 26, "eyebrowAngle": -16, "eyebrowThickness": 4, "mouthY": 111, "mouthWidth": 29, "verticalLineLength": 7, "mouthCurve": 10, "mouthOffsetX": -1.5, "mouthOffsetY": 1, "mouthLineThickness": 1.6, "mouthOpenStyle": "smiling" }
            },
            simulation: { mouthOpen: 0, blinkState: 0, blinkTimer: 0, isSpeaking: false, speakType: 'none', vowel: 'A', speakIntervalId: null },
            ctx: null, images: { xena: new Image(), xeno: new Image() }, imageLoaded: { xena: false, xeno: false },
            
            init: function() {
                this.ctx = canvasEl.getContext('2d');
                this.images.xena.src = "Xena_base.png";
                this.images.xeno.src = "Xeno_base.png";
                this.images.xena.onload = () => { this.imageLoaded.xena = true; };
                this.images.xeno.onload = () => { this.imageLoaded.xeno = true; };
                this.startLoop();
            },
            
            startSpeakingAnim: function(type) {
                clearInterval(this.simulation.speakIntervalId);
                this.simulation.isSpeaking = true;
                this.simulation.speakType = type;
                if (type === 'tts' || type === 'mimic') {
                    const vowels = ['A', 'E', 'I', 'O', 'U'];
                    let vIdx = 0;
                    this.simulation.speakIntervalId = setInterval(() => {
                        this.simulation.mouthOpen = 4 + Math.random() * 8;
                        this.simulation.vowel = vowels[vIdx];
                        vIdx = (vIdx + 1) % vowels.length;
                    }, 130);
                }
            },
            
            stopSpeakingAnim: function() {
                this.simulation.isSpeaking = false;
                this.simulation.speakType = 'none';
                clearInterval(this.simulation.speakIntervalId);
                this.simulation.speakIntervalId = null;
                this.simulation.mouthOpen = 0;
            },
            
            startLoop: function() {
                const drawFrame = () => {
                    this.ctx.clearRect(0, 0, 400, 600);
                    const breathe = Math.sin(Date.now() / 420) * 3.5;
                    this.ctx.save();
                    this.ctx.translate(200, 300 + breathe);

                    if (this.imageLoaded[currentChar]) {
                        const img = this.images[currentChar];
                        const cfg = this.config[currentChar];
                        const drawWidth = img.width * cfg.baseScale;
                        const drawHeight = img.height * cfg.baseScale;
                        this.ctx.drawImage(img, -drawWidth/2 + cfg.baseX, -drawHeight/2 + cfg.baseY, drawWidth, drawHeight);
                    } else {
                        this.drawBackupSilhouette();
                    }

                    if (isPlaybackActive && playbackAnalyser) {
                        const bufferLength = playbackAnalyser.frequencyBinCount;
                        const dataArray = new Uint8Array(bufferLength);
                        playbackAnalyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < bufferLength; i++) { sum += dataArray[i]; }
                        const average = sum / bufferLength;
                        
                        const targetMouthOpen = Math.min(14, average * 0.22);
                        this.simulation.mouthOpen = (this.simulation.mouthOpen * 0.75) + (targetMouthOpen * 0.25);
                        
                        const vowels = ['A', 'E', 'I', 'O', 'U'];
                        if (this.simulation.mouthOpen > 1.5) {
                            const vowelIndex = Math.floor((Date.now() / 120) % vowels.length);
                            this.simulation.vowel = vowels[vowelIndex];
                        }
                    }

                    this.drawVectorEyes();
                    this.drawVectorEyebrows();
                    this.drawVectorMouth();
                    
                    this.ctx.restore();

                    if (!this.simulation.isSpeaking) {
                        this.simulation.blinkTimer++;
                        if (this.simulation.blinkTimer > 200) {
                            this.simulation.blinkState = 1;
                            if (this.simulation.blinkTimer > 212) {
                                this.simulation.blinkState = 0;
                                this.simulation.blinkTimer = 0;
                            }
                        }
                    }

                };

            },
            
            drawBackupSilhouette: function() {
                this.ctx.save();
                this.ctx.beginPath();
                const isXena = currentChar === 'xena';
                
                this.ctx.arc(0, 140, 100, 0, Math.PI * 2);
                this.ctx.fillStyle = isXena ? "#f0f7ff" : "#fffbf2"; 
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.arc(0, 10, 105, 0, Math.PI * 2);
                this.ctx.fillStyle = isXena ? "#f8fafc" : "#fffbeb"; 
                this.ctx.fill();
                this.ctx.strokeStyle = "#cbd5e1";
                this.ctx.lineWidth = 4;
                this.ctx.stroke();

                this.ctx.fillStyle = "#64748b";
                this.ctx.font = "bold 13px sans-serif";
                this.ctx.textAlign = "center";
                this.ctx.fillText(`[${currentChar}_base.png] Loading...`, 0, 10);
                this.ctx.restore();
            },
            
            drawVectorEyes: function() {
                const cfg = this.config[currentChar];
                const halfSpacing = cfg.eyeSpacing / 2;
                const eyeYOff = cfg.eyeY - 200;

                const drawSingleEye = (ex, isLeft) => {
                    this.ctx.save();
                    if (this.simulation.blinkState === 1) {
                        this.ctx.beginPath();
                        this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false);
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke();
                    } else {
                        this.ctx.beginPath();
                        this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2);
                        this.ctx.fillStyle = "#fff"; this.ctx.fill();
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke();

                        this.ctx.beginPath();
                        const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2);
                        const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0));
                        const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0));
                        this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2);
                        this.ctx.fillStyle = "#1e293b"; this.ctx.fill();

                        this.ctx.beginPath();
                        this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2);
                        this.ctx.fillStyle = "#fff"; this.ctx.fill();
                    }
                    this.ctx.restore();
                };
                drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false);
            },
            
            drawVectorEyebrows: function() {
                const cfg = this.config[currentChar];
                const halfSpacing = cfg.eyeSpacing / 2;
                const browY = (cfg.eyeY - 200) + cfg.eyebrowY;

                const drawBrow = (bx, isLeft) => {
                    this.ctx.save();
                    this.ctx.translate(bx, browY);
                    this.ctx.rotate((cfg.eyebrowAngle * Math.PI / 180) * (isLeft ? 1 : -1));
                    this.ctx.beginPath();
                    const half = cfg.eyebrowLength / 2;
                    this.ctx.moveTo(-half, isLeft ? -1.5 : 1.5);
                    this.ctx.quadraticCurveTo(0, -cfg.eyebrowThickness * 1.5, half, isLeft ? 1.5 : -1.5);
                    this.ctx.strokeStyle = "#1e293b";
                    this.ctx.lineWidth = cfg.eyebrowThickness; this.ctx.lineCap = "round"; this.ctx.stroke();
                    this.ctx.restore();
                };
                drawBrow(-halfSpacing, true); drawBrow(halfSpacing, false);
            },
            
            drawVectorMouth: function() {
                const cfg = this.config[currentChar];
                this.ctx.save();
                this.ctx.translate(cfg.mouthOffsetX || 0, (cfg.mouthY - 200) + (cfg.mouthOffsetY || 0));

                const currentMouthW = cfg.mouthWidth;
                const currentMouthH = this.simulation.mouthOpen;

                if (this.simulation.mouthOpen > 1.5) {
                    let scaleW = 1.0;
                    let scaleH = 1.0;
                    const activeVowel = this.simulation.vowel || 'A';
                    
                    if (activeVowel === 'A') { scaleW = 0.85; scaleH = 1.3; }
                    else if (activeVowel === 'E') { scaleW = 0.95; scaleH = 0.9; }
                    else if (activeVowel === 'I') { scaleW = 1.0; scaleH = 0.45; }
                    else if (activeVowel === 'O') { scaleW = 0.65; scaleH = 1.1; }
                    else if (activeVowel === 'U') { scaleW = 0.45; scaleH = 0.75; }

                    const mouthW = cfg.mouthWidth * scaleW;
                    const mouthH = this.simulation.mouthOpen * scaleH;

                    if (cfg.verticalLineLength > 0) {
                        const upperLipY = cfg.mouthOpenStyle === 'smiling' ? -mouthH * 0.15 : -mouthH;
                        if (-cfg.verticalLineLength < upperLipY) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(0, -cfg.verticalLineLength);
                            this.ctx.lineTo(0, upperLipY);
                            this.ctx.strokeStyle = "#1e293b";
                            this.ctx.lineWidth = cfg.mouthLineThickness || 1.5;
                            this.ctx.lineCap = "round";
                            this.ctx.stroke();
                        }
                    }

                    this.ctx.beginPath();
                    if (cfg.mouthOpenStyle === 'smiling') {
                        this.ctx.moveTo(-mouthW, -mouthH * 0.15);
                        this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); 
                        this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); 
                        this.ctx.closePath();
                    } else {
                        this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2);
                    }

                    const mouthGrad = this.ctx.createLinearGradient(0, -mouthH, 0, mouthH);
                    mouthGrad.addColorStop(0, "#3b0712"); 
                    mouthGrad.addColorStop(1, "#881337"); 
                    this.ctx.fillStyle = mouthGrad;
                    this.ctx.fill();
                    this.ctx.strokeStyle = "#1e293b";
                    this.ctx.lineWidth = cfg.mouthLineThickness || 1.5;
                    this.ctx.stroke();

                    this.ctx.save();
                    this.ctx.beginPath();
                    if (cfg.mouthOpenStyle === 'smiling') {
                        this.ctx.moveTo(-mouthW, -mouthH * 0.15);
                        this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15);
                        this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15);
                        this.ctx.closePath();
                    } else {
                        this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2);
                    }
                    this.ctx.clip();

                    this.ctx.beginPath();
                    let tongueY, tongueW, tongueH;
                    if (cfg.mouthOpenStyle === 'smiling') {
                        tongueY = mouthH * 0.85;      
                        tongueW = mouthW * 0.55;      
                        tongueH = mouthH * 0.45;      
                    } else {
                        tongueY = mouthH * 0.65;      
                        tongueW = mouthW * 0.55;
                        tongueH = mouthH * 0.35;
                    }
                    this.ctx.ellipse(0, tongueY, tongueW, tongueH, 0, 0, Math.PI * 2);

                    const tongueGrad = this.ctx.createLinearGradient(0, tongueY - tongueH, 0, tongueY + tongueH);
                    tongueGrad.addColorStop(0, "#fda4af"); 
                    tongueGrad.addColorStop(1, "#f43f5e"); 
                    this.ctx.fillStyle = tongueGrad;
                    this.ctx.fill();

                    this.ctx.strokeStyle = "#be123c";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.beginPath();
                    this.ctx.moveTo(0, tongueY - tongueH * 0.4);
                    this.ctx.lineTo(0, tongueY + tongueH * 0.6);
                    this.ctx.strokeStyle = "#9f1239";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.stroke();

                    this.ctx.restore();
                } else {
                    if (cfg.verticalLineLength > 0) {
                        this.ctx.beginPath();
                        this.ctx.moveTo(0, -cfg.verticalLineLength);
                        this.ctx.lineTo(0, 0);
                        this.ctx.strokeStyle = "#1e293b";
                        this.ctx.lineWidth = cfg.mouthLineThickness || 1.5;
                        this.ctx.lineCap = "round";
                        this.ctx.stroke();
                    }

                    this.ctx.beginPath();
                    this.ctx.moveTo(-cfg.mouthWidth, -2);
                    this.ctx.quadraticCurveTo(0, cfg.mouthCurve, cfg.mouthWidth, -2);
                    this.ctx.strokeStyle = "#1e293b";
                    this.ctx.lineWidth = (cfg.mouthLineThickness * 1.25) || 2.0;
                    this.ctx.lineCap = "round";
                    this.ctx.stroke();
                }
                this.ctx.restore();
            }
        };

        window.onload = () => {
            renderer.init();
            document.getElementById('char-xeno').className = "flex-1 py-2 text-xs font-black bg-orange-500 text-white rounded-lg shadow-sm transition-all";
            tutorBubbleContainer.className = "bubble-container py-5 px-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] bg-[#fffcf5] flex flex-col justify-center w-full h-full transition-all duration-500 shadow-sm relative";
            setLanguage('en-US');
            switchTab('stt'); 
        };
    </script>
</body>
