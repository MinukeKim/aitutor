<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AX LAB AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #ffffff; color: #334155; }
        .canvas-responsive { width: 100%; max-width: 320px; height: auto; aspect-ratio: 2 / 3; }
        @media (max-width: 768px) {
            .canvas-responsive { max-width: 160px; }
            body { padding: 0.75rem !important; }
            .bubble-container { padding: 1.25rem !important; border-radius: 1rem !important; min-height: 100px !important; }
            .quick-menu-scroll { max-height: 120px !important; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .quick-menu-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .quick-menu-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-start p-6 md:p-12 select-none bg-white relative">

    <!-- 1. 시작 오버레이 -->
    <div id="start-overlay" class="fixed inset-0 bg-[#0f172a] z-[60] flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-300" onclick="initApp()">
        <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-[#f8fafc] text-center">AX LAB AI Tutor</h2>
        <p class="text-slate-400 text-xs md:text-sm font-bold tracking-widest uppercase animate-pulse">Click anywhere to start</p>
    </div>

    <!-- 2. 무응답 대기 모달 -->
    <div id="inactivity-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[70] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center mx-4">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">Are you there?</h3>
            <p class="text-sm text-slate-500 font-medium mb-8">No voice detected for 1 minute.</p>
            <div class="flex gap-3">
                <button onclick="handleModal('yes')" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">Yes</button>
                <button onclick="handleModal('no')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">No</button>
            </div>
        </div>
    </div>

    <!-- 3. 설정 모달 -->
    <div id="apikey-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-extrabold text-slate-800 mb-2">Settings</h3>
            <label class="block text-xs font-bold text-slate-700 mb-1 ml-1 mt-2">🔑 Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-mono text-sm rounded-xl px-4 py-3 mb-3 focus:outline-none focus:border-indigo-500 transition-all">
            <div id="api-key-error" class="hidden text-rose-500 text-xs font-bold mb-4 bg-rose-50 p-3 rounded-lg border border-rose-100"></div>
            <div class="flex gap-3 mt-2">
                <button onclick="saveApiKey()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">Save</button>
                <button onclick="document.getElementById('apikey-modal').classList.add('hidden')" class="py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">Cancel</button>
            </div>
        </div>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-6xl mx-auto flex flex-col flex-1 gap-4 md:gap-6">
        
        <!-- 상단 헤더 및 컨트롤 -->
        <div class="flex flex-row items-center justify-between border-b border-slate-100 pb-3">
            <h1 class="text-lg md:text-2xl font-extrabold text-slate-800 hidden md:block">AX LAB AI Tutor</h1>
            <div class="flex flex-1 md:flex-none items-center justify-between md:justify-end gap-2 md:gap-4 bg-slate-50 p-1.5 md:p-2 rounded-xl border border-slate-200 shadow-sm w-full md:w-auto">
                <button id="top-action-btn" onclick="togglePlayStop()" class="px-4 py-2 md:py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-black rounded-lg shadow-sm transition-all flex items-center gap-1.5">
                    <span id="top-btn-icon">▶</span> <span id="top-btn-text">START</span>
                </button>
                <button onclick="document.getElementById('apikey-modal').classList.remove('hidden')" class="flex items-center justify-center p-2 md:px-3 bg-white hover:bg-slate-100 border border-slate-200 text-slate-600 text-sm rounded-lg transition-all shadow-sm">
                    ⚙️ <span class="hidden md:inline ml-1 text-xs font-bold">Settings</span>
                </button>
            </div>
        </div>

        <!-- 2단 레이아웃 -->
        <div class="flex flex-col md:flex-row gap-4 md:gap-8 flex-1 items-center justify-center mt-2">
            <!-- 렌더링 영역 -->
            <div class="w-full md:w-5/12 lg:w-4/12 flex justify-center">
                <canvas id="tutorCanvas" width="400" height="600" class="bg-transparent canvas-responsive transition-all duration-300"></canvas>
            </div>

            <!-- 대화 영역 -->
            <div class="w-full md:w-7/12 lg:w-8/12 flex flex-col justify-center gap-5">
                <!-- 튜터 말풍선 -->
                <div id="tutor-bubble" class="bubble-container py-5 px-6 md:py-8 md:px-8 rounded-3xl bg-[#f4faff] border-2 border-slate-100 flex flex-col justify-center w-full min-h-[120px] md:min-h-[140px] shadow-sm relative transition-colors duration-500">
                    <div id="tutor-text" class="text-slate-800 font-medium text-[15px] md:text-lg leading-relaxed">Waiting to start...</div>
                </div>

                <!-- 사용자 말풍선 -->
                <div class="w-full">
                    <div id="user-bubble" class="bubble-container py-5 px-6 md:py-8 md:px-8 rounded-3xl bg-slate-50 border-2 border-slate-100 flex flex-col justify-center w-full min-h-[120px] md:min-h-[140px] shadow-sm relative transition-colors duration-500">
                        <div id="user-text" class="text-slate-400 font-medium text-[15px] md:text-lg leading-relaxed">Click START to speak...</div>
                    </div>
                    
                    <!-- 퀵 메뉴 -->
                    <div class="flex flex-wrap gap-2 mt-4 px-1 pb-2">
                        <button onclick="sendQuickQuery('Who is Xena?', 'en-US')" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-blue-50 text-slate-600 text-xs rounded-full">Who is Xena?</button>
                        <button onclick="sendQuickQuery('제노를 소개해요!', 'ko-KR')" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-orange-50 text-slate-600 text-xs rounded-full">제노 소개 (KOR)</button>
                        <button onclick="sendQuickQuery('What are the key expressions?', 'en-US')" class="px-3 py-1.5 bg-white border border-slate-200 hover:bg-blue-50 text-slate-600 text-xs rounded-full">Key expressions?</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 견고한 상태 관리 (State Machine)
        // ==========================================
        // 상태: IDLE(정지) -> LISTENING(듣는중) -> PROCESSING(AI생각중) -> SPEAKING(AI말하는중) -> (다시 LISTENING)
        let appState = 'IDLE'; 
        let currentChar = 'xena'; 
        let currentLang = 'en-US';
        let chatHistory = [];
        let lastVoiceTime = Date.now();
        let inactivityInterval = null;

        // UI 요소 캐싱
        const elTutorBubble = document.getElementById('tutor-bubble');
        const elTutorText = document.getElementById('tutor-text');
        const elUserBubble = document.getElementById('user-bubble');
        const elUserText = document.getElementById('user-text');
        const elBtnIcon = document.getElementById('top-btn-icon');
        const elBtnText = document.getElementById('top-btn-text');
        const elActionBtn = document.getElementById('top-action-btn');

        // ==========================================
        // 2. 초기화 및 제어 흐름
        // ==========================================
        function initApp() {
            document.getElementById('start-overlay').style.display = 'none';
            // 모바일 브라우저 오디오 권한 획득용 빈 소리 재생
            try { const unlock = new SpeechSynthesisUtterance(''); unlock.volume = 0; speechSynthesis.speak(unlock); } catch(e){}
            
            // 1분 미사용 감지 루프 (setInterval 1개로 통일하여 메모리 누수 방지)
            inactivityInterval = setInterval(() => {
                if (appState === 'LISTENING' && (Date.now() - lastVoiceTime > 60000)) {
                    document.getElementById('inactivity-modal').classList.remove('hidden');
                    setAppState('IDLE');
                }
            }, 5000);
        }

        function togglePlayStop() {
            if (!localStorage.getItem('gemini_api_key')) {
                document.getElementById('apikey-modal').classList.remove('hidden');
                return;
            }
            if (appState === 'IDLE') {
                chatHistory = [];
                handleAIMessage(currentLang === 'en-US' ? "Hello! I am your AI tutor. How are you today?" : "안녕! 나는 네 학습을 도와줄 AI 튜터야.");
            } else {
                setAppState('IDLE');
            }
        }

        function interruptAI() {
            if (appState === 'SPEAKING') {
                speechSynthesis.cancel();
                setAppState('LISTENING');
            }
        }

        // ==========================================
        // 3. 상태 변경 및 UI 업데이트 핵심 함수
        // ==========================================
        function setAppState(newState) {
            appState = newState;
            
            // STT/TTS 강제 정리 (상태 충돌 방지)
            if (newState !== 'LISTENING' && recognition) { try{ recognition.stop(); }catch(e){} }
            if (newState !== 'SPEAKING') { speechSynthesis.cancel(); renderer.stopSpeakingAnim(); }

            // UI 렌더링 로직
            if (newState === 'IDLE') {
                elActionBtn.className = "px-4 py-2 bg-indigo-600 text-white text-sm font-black rounded-lg transition-all flex items-center gap-1.5";
                elBtnIcon.innerText = "▶"; elBtnText.innerText = "START";
                elUserText.innerHTML = "Click START to speak...";
                elUserText.className = "text-slate-400 font-medium text-lg";
                elUserBubble.className = "bubble-container py-8 px-8 rounded-3xl bg-slate-50 border-2 border-slate-100 flex flex-col justify-center w-full min-h-[140px]";
                elTutorBubble.className = "bubble-container py-8 px-8 rounded-3xl bg-[#f4faff] border-2 border-slate-100 flex flex-col justify-center w-full min-h-[140px]";
            
            } else if (newState === 'LISTENING') {
                elActionBtn.className = "px-4 py-2 bg-rose-500 text-white text-sm font-black rounded-lg transition-all flex items-center gap-1.5";
                elBtnIcon.innerText = "■"; elBtnText.innerText = "STOP";
                elUserText.innerHTML = "Listening... (Speak now)";
                elUserText.className = "text-indigo-500 font-medium text-lg animate-pulse";
                elUserBubble.className = "bubble-container py-8 px-8 rounded-3xl bg-rose-50 border-2 border-rose-400 flex flex-col justify-center w-full min-h-[140px]";
                elTutorBubble.className = `bubble-container py-8 px-8 rounded-3xl ${currentChar==='xeno'?'bg-[#fffcf5]':'bg-[#f4faff]'} border-2 border-slate-100 flex flex-col justify-center w-full min-h-[140px]`;
                
                lastVoiceTime = Date.now();
                try { recognition.lang = currentLang; recognition.start(); } catch(e){}

            } else if (newState === 'PROCESSING') {
                elUserText.className = "text-slate-800 font-medium text-lg";
                elUserBubble.className = "bubble-container py-8 px-8 rounded-3xl bg-white border-2 border-slate-100 flex flex-col justify-center w-full min-h-[140px]";
            
            } else if (newState === 'SPEAKING') {
                elUserText.innerHTML = `<button onclick="interruptAI()" class="px-5 py-2.5 bg-rose-100 text-rose-600 font-bold text-sm rounded-full active:scale-95 transition-all">✋ 말 끊고 내가 말하기</button>`;
                let borderCol = currentChar === 'xeno' ? 'border-orange-400' : 'border-blue-400';
                let bgCol = currentChar === 'xeno' ? 'bg-[#fffcf5]' : 'bg-[#f4faff]';
                elTutorBubble.className = `bubble-container py-8 px-8 rounded-3xl ${bgCol} border-2 ${borderCol} flex flex-col justify-center w-full min-h-[140px] shadow-md`;
            }
        }

        // ==========================================
        // 4. STT (음성 인식)
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onresult = (event) => {
                if (appState !== 'LISTENING') return;
                lastVoiceTime = Date.now();
                let interim = '', final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                
                if (interim) elUserText.innerHTML = interim;
                if (final && final.trim().length > 1) {
                    elUserText.innerHTML = final;
                    processUserMessage(final.trim());
                }
            };

            // 에러나 종료 시 '안전하게' 재시작 (무한루프 방지)
            recognition.onend = () => {
                if (appState === 'LISTENING') {
                    setTimeout(() => { if (appState === 'LISTENING') try{ recognition.start(); }catch(e){} }, 300);
                }
            };
        }

        function processUserMessage(text) {
            setAppState('PROCESSING');
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            if (chatHistory.length > 6) chatHistory.splice(0, 2); // 최근 3세트 유지
            callGeminiAPI();
        }

        function sendQuickQuery(text, lang) {
            currentLang = lang;
            elUserText.innerHTML = text;
            processUserMessage(text);
        }

        // ==========================================
        // 5. Gemini API
        // ==========================================
        async function callGeminiAPI() {
            const apiKey = localStorage.getItem('gemini_api_key');
            
            const sysPrompt = `
                You are the 'AX LAB Tutor' for 9-10 year olds.
                If user speaks Korean: ACT AS [XENO] (Fox). Speak ONLY in Korean.
                If user speaks English: ACT AS [XENA] (Polar Bear). Speak ONLY in English.
                Keep answers VERY SHORT (max 3 sentences). Simple words only.
            `;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: sysPrompt }] },
                        contents: chatHistory,
                        generationConfig: { temperature: 0.7, maxOutputTokens: 150 }
                    })
                });

                const data = await res.json();
                
                // 견고한 에러 방어
                if (!data.candidates || !data.candidates[0].content) {
                    throw new Error("AI 응답이 비어있거나 필터링 되었습니다.");
                }
                
                handleAIMessage(data.candidates[0].content.parts[0].text);

            } catch (err) {
                console.error(err);
                handleAIMessage("미안해, 통신에 문제가 생겼어. 다시 말해줄래?");
            }
        }

        // ==========================================
        // 6. TTS 및 캐릭터 세팅
        // ==========================================
        function handleAIMessage(rawText) {
            let cleanText = rawText.trim();
            if (cleanText.includes('[XENO]')) { currentLang = 'ko-KR'; currentChar = 'xeno'; cleanText = cleanText.replace('[XENO]', ''); }
            else if (cleanText.includes('[XENA]')) { currentLang = 'en-US'; currentChar = 'xena'; cleanText = cleanText.replace('[XENA]', ''); }
            
            // 특수문자 제거
            cleanText = cleanText.replace(/[\*\_~`#>-]/g, '').trim();
            chatHistory.push({ role: "model", parts: [{ text: cleanText }] });
            
            elTutorText.innerHTML = cleanText;
            setAppState('SPEAKING');

            // 심플하고 강력한 단일 TTS 호출
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = currentLang;
            utterance.rate = 1.0;
            
            // 목소리 찾기
            let voices = speechSynthesis.getVoices();
            let voice = voices.find(v => v.lang.includes(currentLang) && (v.name.includes('Google') || v.name.includes('Natural'))) 
                        || voices.find(v => v.lang.includes(currentLang));
            if(voice) utterance.voice = voice;

            utterance.onstart = () => renderer.startSpeakingAnim();
            utterance.onend = () => setAppState('LISTENING');
            utterance.onerror = () => setAppState('LISTENING');
            
            speechSynthesis.speak(utterance);
        }

        // ==========================================
        // 7. 캔버스 렌더링 엔진 (30fps)
        // ==========================================
        const canvasEl = document.getElementById('tutorCanvas');
        const renderer = {
            ctx: canvasEl.getContext('2d'),
            config: { 
                "xena": { scale: 0.9, y: 35, eyeY: 96, eyeSpc: 70, mouthY: 145, mouthW: 33 }, 
                "xeno": { scale: 0.9, y: 12, eyeY: 67, eyeSpc: 66, mouthY: 111, mouthW: 29 } 
            },
            imgs: { xena: new Image(), xeno: new Image() },
            isLoaded: { xena: false, xeno: false },
            isSpeaking: false,
            mouthOpen: 0,
            blink: false,
            
            init() {
                this.imgs.xena.src = "Xena_base.png";
                this.imgs.xeno.src = "Xeno_base.png";
                this.imgs.xena.onload = () => this.isLoaded.xena = true;
                this.imgs.xeno.onload = () => this.isLoaded.xeno = true;
                this.loop();
            },
            
            startSpeakingAnim() { this.isSpeaking = true; },
            stopSpeakingAnim() { this.isSpeaking = false; this.mouthOpen = 0; },
            
            loop() {
                this.ctx.clearRect(0, 0, 400, 600);
                if (this.isLoaded[currentChar]) {
                    const cfg = this.config[currentChar];
                    const img = this.imgs[currentChar];
                    
                    // 호흡 애니메이션
                    const breathe = Math.sin(Date.now() / 400) * 3;
                    this.ctx.save();
                    this.ctx.translate(200, 300 + breathe);
                    
                    // 몸체
                    const w = img.width * cfg.scale;
                    const h = img.height * cfg.scale;
                    this.ctx.drawImage(img, -w/2, -h/2 + cfg.y, w, h);
                    
                    // 눈 깜빡임 로직
                    if (Math.random() < 0.01) this.blink = true;
                    if (this.blink && Math.random() < 0.2) this.blink = false;
                    
                    // 눈 그리기
                    this.ctx.fillStyle = "#1e293b";
                    let ey = cfg.eyeY - 200;
                    if (this.blink) {
                        this.ctx.fillRect(-cfg.eyeSpc/2 - 10, ey, 20, 3);
                        this.ctx.fillRect(cfg.eyeSpc/2 - 10, ey, 20, 3);
                    } else {
                        this.ctx.beginPath(); this.ctx.arc(-cfg.eyeSpc/2, ey, 8, 0, Math.PI*2); this.ctx.fill();
                        this.ctx.beginPath(); this.ctx.arc(cfg.eyeSpc/2, ey, 8, 0, Math.PI*2); this.ctx.fill();
                    }
                    
                    // 입 (Lipsync)
                    if (this.isSpeaking) {
                        this.mouthOpen = 5 + Math.random() * 10;
                    } else {
                        this.mouthOpen = 0; // 닫힌 입
                    }
                    
                    let my = cfg.mouthY - 200;
                    this.ctx.beginPath();
                    if(this.mouthOpen > 2) {
                        this.ctx.fillStyle = "#881337";
                        this.ctx.ellipse(0, my, cfg.mouthW * 0.5, this.mouthOpen, 0, 0, Math.PI*2);
                        this.ctx.fill();
                    } else {
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = 2;
                        this.ctx.moveTo(-10, my); this.ctx.lineTo(10, my);
                        this.ctx.stroke();
                    }
                    
                    this.ctx.restore();
                }
                requestAnimationFrame(() => this.loop());
            }
        };

        // 기타 헬퍼
        function handleModal(res) {
            document.getElementById('inactivity-modal').classList.add('hidden');
            if (res === 'yes') setAppState('LISTENING');
        }
        function saveApiKey() {
            const key = document.getElementById('api-key-input').value;
            if(key) { localStorage.setItem('gemini_api_key', key); document.getElementById('apikey-modal').classList.add('hidden'); }
        }
        
        window.onload = () => {
            renderer.init();
            document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
        };
    </script>
</body>
</html>
