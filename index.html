<!-- v1.3.0 (Sprint 6.0) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AX LAB AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>document.write('<script id="tuning-script" src="tuning.js?v=' + new Date().getTime() + '"><\/script>');</script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard', system-ui, -apple-system, sans-serif; background-color: #ffffff; color: #334155; }
        .canvas-responsive { width: 100%; max-width: 320px; height: auto; aspect-ratio: 2 / 3; }
        @media (max-width: 768px) {
            .canvas-responsive { max-width: 160px; }
            body { padding: 0 !important; } 
            #app-container { padding: 0.75rem !important; }
            .bubble-container { padding: 1.25rem !important; padding-top: 3.5rem !important; border-radius: 1rem !important; min-height: 120px !important; }
            .control-group { top: 0.75rem; left: 0.75rem; right: auto; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #app-container { display: none; }
        .highlight { background-color: #fef08a; color: #0f172a; border-radius: 4px; padding: 0 2px; transition: background-color 0.2s; }
        .suggestion-chip { transition: all 0.2s ease-in-out; }
        .suggestion-chip:active { transform: scale(0.95); }
        @media (hover: hover) and (pointer: fine) {
            .suggestion-chip:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        }
        .mic-active-input {
            background-color: #f0fdf4 !important;
            border-color: #86efac !important;
            color: #166534 !important;
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col select-none bg-slate-900">

    <!-- 초기 Gate Page -->
    <div id="gate-page" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900 text-white">
        <h1 class="text-3xl md:text-5xl font-extrabold mb-2 tracking-tight flex items-baseline gap-2">
            <span>AX LAB AI Tutor</span>
        </h1>
        <div class="w-64 flex flex-col gap-3 mt-8">
            <input type="text" id="gate-name-input" placeholder="대화명을 입력하세요." class="w-full bg-white border-2 border-slate-700 text-slate-900 text-center rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 font-bold shadow-inner" onkeydown="if(event.key==='Enter') enterApp()">
            <button onclick="enterApp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95">시작하기</button>
        </div>
        <div class="absolute bottom-6 text-[11px] font-mono text-slate-600">
            Sprint 6.0 • v1.3.0
        </div>
    </div>

    <!-- 통합 설정(Options) 모달 -->
    <div id="options-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-lg w-full mx-4 flex flex-col max-h-[90vh] overflow-hidden">
            <!-- 모달 상단 헤더 -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <h3 class="text-xl font-extrabold text-slate-800">⚙️ 시스템 설정</h3>
                </div>
                <button onclick="closeOptionsModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
            </div>

            <!-- 모달 탭 메뉴 -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-4 gap-1">
                <button id="tab-btn-api" onclick="switchOptionsTab('api')" class="flex-1 py-2 text-xs md:text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all">🔑 API Key 연동</button>
                <button id="tab-btn-tts" onclick="switchOptionsTab('tts')" class="flex-1 py-2 text-xs md:text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">🔊 음성 & TTS 설정</button>
            </div>

            <!-- 탭 1: API Key 설정 -->
            <div id="tab-content-api" class="flex flex-col gap-4 overflow-y-auto pr-1">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Gemini API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-mono text-xs md:text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Google TTS API Key (선택사항)</label>
                    <input type="password" id="tts-api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 text-slate-800 font-mono text-xs md:text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- 탭 2: TTS 설정 -->
            <div id="tab-content-tts" class="hidden flex-col gap-3 overflow-y-auto pr-1 text-xs">
                
                <div class="bg-white border border-slate-200 rounded-xl p-3 mb-2 shadow-sm flex flex-col gap-2">
                    <label class="font-bold text-xs text-slate-800">음성 엔진 선택 (유료/무료)</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-1 cursor-pointer">
                            <input type="radio" name="tts_engine" value="paid" onchange="toggleTTSEngineUI()" checked>
                            <span class="text-xs font-medium">구글 TTS (유료 API)</span>
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer">
                            <input type="radio" name="tts_engine" value="free" onchange="toggleTTSEngineUI()">
                            <span class="text-xs font-medium">기본 기계음 TTS (무료)</span>
                        </label>
                    </div>
                </div>

                <!-- 제나 (KR) -->
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 flex flex-col gap-2">
                    <div class="flex justify-between items-center border-b border-slate-200/60 pb-1.5">
                        <span class="text-pink-600 font-extrabold flex items-center gap-1">🌸 제나 (Xena, KR)</span>
                        <button onclick="testTTS('xena')" class="px-2.5 py-1 bg-pink-100 text-pink-700 hover:bg-pink-200 font-bold rounded-lg text-[11px] transition-colors">테스트 🔊</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">음색 (Voice)</label>
                            <select id="setting-xena-voice" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs outline-none">
                                <option value="ko-KR-Wavenet-A">ko-KR-Wavenet-A (여)</option>
                                <option value="ko-KR-Wavenet-B">ko-KR-Wavenet-B (여)</option>
                                <option value="ko-KR-Wavenet-C">ko-KR-Wavenet-C (남)</option>
                                <option value="ko-KR-Wavenet-D">ko-KR-Wavenet-D (남)</option>
                                <option value="ko-KR-Neural2-A">ko-KR-Neural2-A (여)</option>
                                <option value="ko-KR-Neural2-B">ko-KR-Neural2-B (여)</option>
                                <option value="ko-KR-Neural2-C">ko-KR-Neural2-C (남)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">피치 (Pitch)</label>
                            <input type="number" id="setting-xena-pitch" value="9.0" step="0.5" min="-20" max="20" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs text-right outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">속도 (Rate)</label>
                            <input type="number" id="setting-xena-rate" value="1.15" step="0.05" min="0.25" max="4.0" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs text-right outline-none">
                        </div>
                    </div>
                </div>

                <!-- 제노 (EN) -->
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 flex flex-col gap-2">
                    <div class="flex justify-between items-center border-b border-slate-200/60 pb-1.5">
                        <span class="text-blue-600 font-extrabold flex items-center gap-1">🦊 제노 (Xeno, EN)</span>
                        <button onclick="testTTS('xeno')" class="px-2.5 py-1 bg-blue-100 text-blue-700 hover:bg-blue-200 font-bold rounded-lg text-[11px] transition-colors">테스트 🔊</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">음색 (Voice)</label>
                            <select id="setting-xeno-voice" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs outline-none">
                                <option value="en-US-Wavenet-D">en-US-Wavenet-D (남)</option>
                                <option value="en-US-Wavenet-A">en-US-Wavenet-A (남)</option>
                                <option value="en-US-Wavenet-B">en-US-Wavenet-B (남)</option>
                                <option value="en-US-Wavenet-C">en-US-Wavenet-C (여)</option>
                                <option value="en-US-Wavenet-E">en-US-Wavenet-E (여)</option>
                                <option value="en-US-Wavenet-F">en-US-Wavenet-F (여)</option>
                                <option value="en-US-Neural2-A">en-US-Neural2-A (남)</option>
                                <option value="en-US-Neural2-C">en-US-Neural2-C (여)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">피치 (Pitch)</label>
                            <input type="number" id="setting-xeno-pitch" value="7.0" step="0.5" min="-20" max="20" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs text-right outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">속도 (Rate)</label>
                            <input type="number" id="setting-xeno-rate" value="1.1" step="0.05" min="0.25" max="4.0" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs text-right outline-none">
                        </div>
                    </div>
                </div>

                <!-- 사용자 (User) -->
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 flex flex-col gap-2">
                    <div class="flex justify-between items-center border-b border-slate-200/60 pb-1.5">
                        <span class="text-purple-600 font-extrabold flex items-center gap-1">👤 사용자 (User)</span>
                        <button onclick="testTTS('user')" class="px-2.5 py-1 bg-purple-100 text-purple-700 hover:bg-purple-200 font-bold rounded-lg text-[11px] transition-colors">테스트 🔊</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">음색 (Voice)</label>
                            <select id="setting-user-voice" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs outline-none">
                                <option value="ko-KR-Wavenet-A">ko-KR-Wavenet-A (여)</option>
                                <option value="ko-KR-Wavenet-B">ko-KR-Wavenet-B (여)</option>
                                <option value="ko-KR-Wavenet-C">ko-KR-Wavenet-C (남)</option>
                                <option value="ko-KR-Wavenet-D">ko-KR-Wavenet-D (남)</option>
                                <option value="ko-KR-Neural2-A">ko-KR-Neural2-A (여)</option>
                                <option value="ko-KR-Neural2-B">ko-KR-Neural2-B (여)</option>
                                <option value="ko-KR-Neural2-C">ko-KR-Neural2-C (남)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">피치 (Pitch)</label>
                            <input type="number" id="setting-user-pitch" value="6.0" step="0.5" min="-20" max="20" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs text-right outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold block mb-0.5">속도 (Rate)</label>
                            <input type="number" id="setting-user-rate" value="1.1" step="0.05" min="0.25" max="4.0" class="w-full bg-white border border-slate-200 text-slate-700 rounded-lg p-1.5 text-xs text-right outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 액션 버튼 -->
            <div class="flex gap-2.5 mt-5 pt-3 border-t border-slate-100">
                <button id="save-options-btn" onclick="saveAllOptions()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md text-xs md:text-sm transition-all">설정 저장 및 적용</button>
                <button onclick="closeOptionsModal()" class="py-2.5 px-5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs md:text-sm transition-all">닫기</button>
            </div>
        </div>
    </div>

    <!-- 60초 대기(Idle) 모달 -->
    <div id="idle-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
            <h3 class="text-xl font-extrabold text-slate-800 mb-6">거기 계셔요? 🎤</h3>
            <button onclick="closeIdleModalAndRestartMic()" class="w-full py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-md transition-colors text-lg">확인</button>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div id="app-container" class="w-full flex-col flex-1 p-6 md:p-12 bg-white hidden">
        <div class="w-full max-w-5xl mx-auto flex flex-col flex-1 gap-4 md:gap-6">
            
            <!-- 상단 헤더 -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 flex-wrap gap-3">
                <div class="flex items-baseline gap-2">
                    <h1 class="text-lg md:text-2xl font-extrabold text-slate-800 cursor-pointer hover:opacity-80 transition-opacity" onclick="resetChat()">AX LAB AI Tutor</h1>
                    <span class="text-xs font-mono font-medium text-slate-400">v1.3.0</span>
                </div>
                <div class="flex items-center gap-2 md:gap-3">
                    <span id="current-tts-model" class="text-[11px] md:text-xs font-mono font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded transition-colors">ko-KR-Wavenet-A</span>
                    <span class="text-[11px] md:text-xs font-mono font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded">Gemini 3.1 Flash-Lite</span>
                    <button onclick="openOptionsModal()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs md:text-sm font-bold rounded-xl transition-all shadow-sm flex items-center gap-1.5">
                        <span>⚙️</span>
                        <span id="options-btn-text">옵션</span>
                    </button>
                </div>
            </div>

            <!-- 중앙 영역 -->
            <div class="flex flex-col md:flex-row gap-4 md:gap-8 flex-1 items-center justify-center">
                
                <!-- 왼쪽 캐릭터 영역 -->
                <div class="w-full md:w-5/12 lg:w-4/12 flex flex-col items-center gap-3 relative">
                    <div class="flex justify-center w-full relative">
                        <canvas id="tutorCanvas" width="400" height="600" class="canvas-responsive z-10"></canvas>
                        <canvas id="particleCanvas" width="400" height="600" class="canvas-responsive absolute top-0 left-1/2 -translate-x-1/2 pointer-events-none z-20"></canvas>
                    </div>
                    <div class="flex w-full max-w-[320px] bg-slate-100 p-1.5 rounded-2xl z-30 shadow-inner">
                        <button id="btn-xena" onclick="handleCharacterToggle('xena')" class="flex-1 py-3 text-sm md:text-base font-black rounded-xl transition-all shadow-sm">Xena (KR)</button>
                        <button id="btn-xeno" onclick="handleCharacterToggle('xeno')" class="flex-1 py-3 text-sm md:text-base font-black rounded-xl transition-all">Xeno (EN)</button>
                    </div>
                </div>

                <!-- 오른쪽 대화 영역 -->
                <div class="w-full md:w-7/12 lg:w-8/12 flex flex-col justify-center gap-2 relative">
                    
                    <div class="relative w-full">
                        <div class="control-group absolute top-4 left-4 flex items-center gap-2 z-10">
                            <div class="flex items-center gap-1.5 cursor-pointer bg-white px-2.5 py-1.5 rounded-xl border border-slate-200 shadow-sm" onclick="toggleSound()">
                                <span id="sound-label" class="text-[10px] font-bold text-indigo-600 transition-colors">SOUND ON</span>
                                <div id="sound-toggle" class="w-7 h-4 bg-indigo-600 rounded-full relative transition-colors flex items-center">
                                    <div id="toggle-knob" class="w-3 h-3 bg-white rounded-full absolute left-[2px] transition-transform translate-x-[12px] shadow-sm"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 말풍선 및 칩 -->
                        <div id="tutor-bubble-container" class="bubble-container p-6 pt-16 md:p-8 md:pt-16 rounded-3xl bg-[#ffdddd] border-2 border-slate-100 min-h-[160px] max-h-[320px] overflow-y-auto flex flex-col items-start shadow-sm transition-colors duration-500">
                            <div id="tutor-text" class="text-slate-800 font-medium text-[18px] md:text-xl leading-relaxed w-full mb-4"></div>
                            <div id="quick-replies-container" class="flex flex-wrap gap-2 w-full min-h-[36px] transition-opacity duration-300"></div>
                        </div>
                    </div>

                    <!-- 입력창 영역 -->
                    <div class="p-4 md:p-5 rounded-3xl bg-[#bedcfa] border-2 border-slate-100 shadow-sm mt-3 flex flex-col gap-3">
                        <div class="flex items-center justify-between border-b border-slate-200/60 pb-2">
                            <div id="mic-toggle-btn" class="flex items-center gap-1.5 bg-slate-200/60 px-3 py-1.5 rounded-xl cursor-pointer select-none transition-all hover:bg-slate-300/60" onclick="toggleMic()">
                                <span id="mic-status-text" class="text-[11px] font-extrabold text-slate-500 transition-colors">MIC OFF</span>
                                <div id="mic-switch-bg" class="w-6 h-3.5 bg-slate-400 rounded-full relative flex items-center transition-colors">
                                    <div id="mic-switch-knob" class="w-2.5 h-2.5 bg-white rounded-full absolute left-[2px] transition-all"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex gap-2 items-center">
                            <div id="user-input-box" class="flex-1 flex items-center bg-white border-2 border-slate-200 rounded-2xl px-4 py-2 focus-within:border-indigo-500 transition-all shadow-sm">
                                <input type="text" id="user-input" placeholder="메시지를 입력하세요..." class="w-full bg-transparent text-slate-800 text-[18px] md:text-lg py-1 focus:outline-none" onkeydown="if(event.key==='Enter') sendMessage()">
                                <div id="kbd-indicator" class="ml-2 px-2 py-0.5 text-[10px] font-extrabold rounded bg-slate-100 text-slate-400 transition-colors shrink-0">-</div>
                            </div>
                            <button id="send-btn" onclick="sendMessage()" class="px-6 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl shadow-md shrink-0 transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none">보내기</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- 스크립트 영역 -->
    <script>
        let currentChar = 'xena';
        let chatHistories = { xena: [], xeno: [] };
        let hasMet = { xena: false, xeno: false };
        let isSoundOn = true; 
        let currentRawText = ""; 
        let currentSpeechId = 0; 
        let currentUserName = ""; 
        
        // STT 변수
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isMicOn = false;
        let isListening = false;
        let autoSubmitTimer = null;
        let micIdleTimer = null;
        let isAudioUnlocked = false; 
        let globalAudioCtx = null;

        function updateTTSBadgeToFallback() {
            const ttsModelSpan = document.getElementById('current-tts-model');
            if (ttsModelSpan) {
                ttsModelSpan.innerText = "Web Speech API (Fallback)";
                ttsModelSpan.className = "text-[11px] md:text-xs font-mono font-bold px-2 py-1 rounded transition-colors text-orange-600 bg-orange-100";
            }
        }

        // --- 옵션 모달(Options Modal) 관리 ---
        function switchOptionsTab(tab) {
            const btnApi = document.getElementById('tab-btn-api');
            const btnTts = document.getElementById('tab-btn-tts');
            const contentApi = document.getElementById('tab-content-api');
            const contentTts = document.getElementById('tab-content-tts');

            if (tab === 'api') {
                btnApi.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
                btnTts.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all";
                contentApi.classList.remove('hidden');
                contentTts.classList.add('hidden');
            } else {
                btnTts.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
                btnApi.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all";
                contentTts.classList.remove('hidden');
                contentTts.classList.add('flex');
                contentApi.classList.add('hidden');
            }
        }

        function openOptionsModal(defaultTab = 'api') {
            document.getElementById('options-modal').classList.remove('hidden');
            document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';

        function playMicReadySFX() {
            if (!isSoundOn) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                const now = ctx.currentTime;

                osc.frequency.setValueAtTime(587.33, now); 
                osc.frequency.setValueAtTime(880.00, now + 0.08); 

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            } catch (e) {
                console.warn("SFX Error:", e);
            }
        }

        function triggerTransformParticles() {
            const ctx = particleCanvas.getContext('2d');
            const startTime = performance.now();
            let animationFrameId;
            const particles = Array.from({ length: 35 }, () => ({
                x: 200, y: 300, vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
                size: Math.random() * 6 + 3, color: Math.random() > 0.3 ? '#facc15' : '#ffffff', alpha: 1
            }));
            function drawParticles(now) {
                const elapsed = now - startTime;
                if (elapsed >= 600) { ctx.clearRect(0, 0, 400, 600); cancelAnimationFrame(animationFrameId); return; }
                ctx.clearRect(0, 0, 400, 600);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.alpha = Math.max(0, 1 - elapsed / 600);
                    ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                });
                animationFrameId = requestAnimationFrame(drawParticles);
            }
            animationFrameId = requestAnimationFrame(drawParticles);
        }

        async function speakUserText(text) {
            if (!isSoundOn || !text) { return; }
            
            const langCode = (currentChar === 'xena') ? 'ko-KR' : 'en-US';
            const engineMode = localStorage.getItem('tts_engine_mode') || 'paid';
            
            const rawPitch = parseFloat(document.getElementById('setting-user-pitch')?.value || 6.0);
            const rawRate = parseFloat(document.getElementById('setting-user-rate')?.value || 1.1);
            
            const pitch = Math.max(-20, Math.min(20, rawPitch));
            const rate = Math.max(0.25, Math.min(4.0, rawRate));
            
            if (engineMode === 'paid') {
                const userVoiceName = document.getElementById('setting-user-voice')?.value || 'ko-KR-Wavenet-C';
                
                const audioBase64 = await fetchGoogleTTS(text, userVoiceName, langCode, pitch, rate);
                
                if (audioBase64) {
                    return new Promise((resolve) => {
                        const audio = new Audio("data:audio/mp3;base64," + audioBase64);
                        audio.onended = resolve;
                        audio.onerror = resolve;
                        audio.play().catch(resolve);
                    });
                }
            }

            return new Promise((resolve) => {
                updateTTSBadgeToFallback();
                if (!('speechSynthesis' in window)) { resolve(); return; }
                const utterance = new SpeechSynthesisUtterance(text);
                
                utterance.lang = langCode;
                
                const voice = getBestVoice(utterance.lang.split('-')[0]);
                if (voice) utterance.voice = voice;
                utterance.pitch = Math.max(0, Math.min(2, 1 + (pitch / 20))); 
                utterance.rate = Math.max(0.1, Math.min(10, rate));
                
                let resolved = false;
                const safeResolve = () => {
                    if (!resolved) { resolved = true; resolve(); }
                };
                
                utterance.onend = safeResolve;
                utterance.onerror = safeResolve;
                
                const maxWaitTime = (text.length * 250) + 1000;
                setTimeout(() => {
                    if (!resolved) {
                        console.warn("[TTS Warning] onend timeout, forcing cancel.");
                        window.speechSynthesis.cancel();
                        safeResolve();
                    }
                }, maxWaitTime);

                window.speechSynthesis.speak(utterance);
            });
        }

        async function fetchGoogleTTS(text, voiceName, langCode, pitch = 0, speakingRate = 1.0) {
            const ttsModelSpan = document.getElementById('current-tts-model');
            if (ttsModelSpan) {
                ttsModelSpan.innerText = voiceName || "ko-KR-Wavenet-C";
                ttsModelSpan.className = "text-[11px] md:text-xs font-mono font-bold px-2 py-1 rounded transition-colors";
                if (voiceName === 'ko-KR-Wavenet-A') {
                    ttsModelSpan.classList.add('text-pink-500', 'bg-pink-50');
                } else if (voiceName === 'en-US-Wavenet-D') {
                    ttsModelSpan.classList.add('text-blue-500', 'bg-blue-50');
                } else {
                    ttsModelSpan.classList.add('text-purple-500', 'bg-purple-50');
                }
            }

            const customTtsKey = localStorage.getItem('tts_api_key');
            const apiKey = customTtsKey && customTtsKey.length > 20 ? customTtsKey : 'AIzaSyBkSYEF-5M4OtVZXzOXyxM_QwQ0pdlYfY8';
            const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`;
            
            const voiceConfig = { languageCode: langCode };
            if (voiceName) {
                voiceConfig.name = voiceName;
            } else {
                voiceConfig.ssmlGender = "NEUTRAL";
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        input: { text: text },
                        voice: voiceConfig,
                        audioConfig: { audioEncoding: "MP3", pitch: pitch, speakingRate: speakingRate }
                    })
                });
                if (!response.ok) {
                    const errText = await response.text();
                    console.error("Google TTS HTTP Error:", response.status, errText);
                    return null;
                }
                const data = await response.json();
                return data.audioContent;
            } catch (err) {
                console.error("Google TTS Fetch Error:", err);
                return null;
            }
        }

        async function speakText(text) {
            if (!isSoundOn) {
                tutorText.innerHTML = formatUIText(text); setUILock('idle'); return;
            }
            cancelCurrentSpeech(); const mySpeechId = currentSpeechId; setUILock('speaking'); 

            const sentences = text.match(/[^.!?\n]+[.!?\n]*/g)?.map(s => s.trim()).filter(s => s.length > 0) || [text];
            
            const engineMode = localStorage.getItem('tts_engine_mode') || 'paid';
            
            for (let i = 0; i < sentences.length; i++) {
                if (mySpeechId !== currentSpeechId) break; 
                let sentence = sentences[i];
                if (!sentence) continue;

                let cleanSentenceForVoice = sentence.replace(/\[?(경고|WARNING):\s*(.*?)\]?/g, '$2').replace(/\s*\([A-Za-z0-9\s.,!?'-]+\)/g, '').replace(/[\[\]]/g, ''); 
                const highlightedHtml = text.replace(sentence, `<span class="highlight">${sentence}</span>`);
                tutorText.innerHTML = formatUIText(highlightedHtml);
                tutorBubbleContainer.scrollTop = tutorBubbleContainer.scrollHeight;

                const langCode = currentChar === 'xena' ? 'ko-KR' : 'en-US';
                
                let audioBase64 = null;
                const defaultVoice = currentChar === 'xena' ? 'ko-KR-Wavenet-A' : 'en-US-Wavenet-D';
                const voiceName = document.getElementById(`setting-${currentChar}-voice`)?.value || defaultVoice;
                const xenaPitch = parseFloat(document.getElementById('setting-xena-pitch')?.value || 9.0);
                const xenaRate = parseFloat(document.getElementById('setting-xena-rate')?.value || 1.15);
                const xenoPitch = parseFloat(document.getElementById('setting-xeno-pitch')?.value || 7.0);
                const xenoRate = parseFloat(document.getElementById('setting-xeno-rate')?.value || 1.1);
                
                const rawPitch = currentChar === 'xena' ? xenaPitch : xenoPitch;
                const rawRate = currentChar === 'xena' ? xenaRate : xenoRate;
                
                const pitch = Math.max(-20, Math.min(20, rawPitch));
                const rate = Math.max(0.25, Math.min(4.0, rawRate));
                
                if (engineMode === 'paid') {
                    audioBase64 = await fetchGoogleTTS(cleanSentenceForVoice, voiceName, langCode, pitch, rate);
                }

                if (mySpeechId !== currentSpeechId) break;

                await new Promise((resolve) => {
                    let resolved = false;
                    const safeResolve = () => {
                        if (!resolved) {
                            resolved = true;
                            renderer.stopSpeakingAnim();
                            resolve();
                        }
                    };

                    if (!audioBase64) {
                        updateTTSBadgeToFallback();
                        if (!('speechSynthesis' in window)) { safeResolve(); return; }
                        const utterance = new SpeechSynthesisUtterance(cleanSentenceForVoice);
                        utterance.lang = langCode;
                        const voice = getBestVoice(langCode.split('-')[0]);
                        if (voice) utterance.voice = voice;
                        utterance.pitch = Math.max(0, Math.min(2, 1 + (pitch / 20))); 
                        utterance.rate = Math.max(0.1, Math.min(10, rate));
                        
                        utterance.onend = safeResolve;
                        utterance.onerror = safeResolve;
                        
                        const maxWaitTime = (cleanSentenceForVoice.length * 250) + 2000;
                        setTimeout(() => {
                            if (!resolved) {
                                window.speechSynthesis.cancel();
                                safeResolve();
                            }
                        }, maxWaitTime);

                        if (mySpeechId === currentSpeechId) {
                            window.speechSynthesis.speak(utterance);
                            renderer.startSpeakingAnim();
                        } else safeResolve();
                        return;
                    }

                    const audio = new Audio("data:audio/mp3;base64," + audioBase64);
                    currentAudio = audio;
                    
                    audio.onplay = () => renderer.startSpeakingAnim();
                    audio.onended = () => { currentAudio = null; safeResolve(); };
                    audio.onerror = () => { currentAudio = null; safeResolve(); };
                    
                    if (mySpeechId === currentSpeechId) {
                        audio.play().catch((e) => {
                            console.error("Audio play failed", e);
                            currentAudio = null;
                            safeResolve();
                        });
                    } else {
                        safeResolve();
                    }
                });
            }
            if (mySpeechId === currentSpeechId) {
                tutorText.innerHTML = formatUIText(currentRawText); setUILock('idle'); 
            }
        }

        function renderSuggestions() {
            quickRepliesContainer.innerHTML = ''; 
            
            const suggestionsArr = window.fixedChips ? window.fixedChips[currentChar] : [];
            if (!suggestionsArr || suggestionsArr.length === 0) return;

            const chipClass = currentChar === 'xena'
                ? "suggestion-chip px-3.5 py-2 bg-white border border-blue-200 text-blue-600 hover:bg-blue-50 rounded-xl text-[13px] md:text-sm font-bold shadow-sm cursor-pointer"
                : "suggestion-chip px-3.5 py-2 bg-white border border-orange-200 text-orange-600 hover:bg-orange-50 rounded-xl text-[13px] md:text-sm font-bold shadow-sm cursor-pointer";

            suggestionsArr.slice(0, 5).forEach(text => {
                const btn = document.createElement('button');
                btn.innerText = text; btn.className = chipClass;
                btn.onclick = function() {
                    quickRepliesContainer.style.pointerEvents = 'none';
                    Array.from(quickRepliesContainer.children).forEach(c => {
                        if (c !== btn) c.style.opacity = '0.5';
                    });

                    if(currentChar === 'xena') {
                        btn.classList.remove('bg-white', 'text-blue-600'); btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                    } else {
                        btn.classList.remove('bg-white', 'text-orange-600'); btn.classList.add('bg-orange-600', 'text-white', 'border-orange-600');
                    }
                    setTimeout(() => { sendMessage(text, true); }, 400);
                };
                quickRepliesContainer.appendChild(btn);
            });
        }

        async function handleCharacterToggle(targetChar) {
            if (currentChar === targetChar) return;
            triggerTransformParticles(); 
            await setCharacterMode(targetChar, true);
        }

        async function setCharacterMode(char, doGreeting = false) {
            cancelCurrentSpeech();
            currentChar = char;
            
            const optionsBtnText = document.getElementById('options-btn-text');
            if (optionsBtnText) {
                optionsBtnText.innerText = char === 'xeno' ? 'Options' : '옵션';
            }
            
            const ttsModelSpan = document.getElementById('current-tts-model');
            if (ttsModelSpan) {
                const voiceName = char === 'xena' ? 'ko-KR-Wavenet-A' : 'en-US-Wavenet-D';
                ttsModelSpan.innerText = voiceName;
                ttsModelSpan.className = "text-[11px] md:text-xs font-mono font-bold px-2 py-1 rounded transition-colors";
                if (voiceName === 'ko-KR-Wavenet-A') {
                    ttsModelSpan.classList.add('text-pink-500', 'bg-pink-50');
                } else if (voiceName === 'en-US-Wavenet-D') {
                    ttsModelSpan.classList.add('text-blue-500', 'bg-blue-50');
                }
            }
            
            const bubble = document.getElementById('tutor-bubble-container');
            
            bubble.classList.remove('bg-[#fffcf5]', 'bg-[#f4faff]', 'bg-[#ffdddd]');
            quickRepliesContainer.innerHTML = '';

            if (char === 'xena') {
                bubble.classList.add('bg-[#ffdddd]');
                btnXena.className = "flex-1 py-3 text-sm md:text-base font-black rounded-xl transition-all shadow-sm bg-blue-500 text-white";
                btnXeno.className = "flex-1 py-3 text-sm md:text-base font-black rounded-xl transition-all bg-transparent text-slate-400 hover:bg-slate-200";
                sendBtn.innerText = "보내기"; sendBtn.className = "px-6 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-2xl shadow-md shrink-0 transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none";
                inputEl.classList.replace('focus-within:border-orange-500', 'focus-within:border-blue-500');
            } else {
                bubble.classList.add('bg-[#ffdddd]');
                btnXena.className = "flex-1 py-3 text-sm md:text-base font-black rounded-xl transition-all bg-transparent text-slate-400 hover:bg-slate-200";
                btnXeno.className = "flex-1 py-3 text-sm md:text-base font-black rounded-xl transition-all shadow-sm bg-orange-500 text-white";
                sendBtn.innerText = "Send"; sendBtn.className = "px-6 py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-2xl shadow-md shrink-0 transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none";
                inputEl.classList.replace('focus-within:border-blue-500', 'focus-within:border-orange-500');
            }
            
            if (recognition) {
                recognition.lang = (char === 'xena') ? 'ko-KR' : 'en-US';
            }

            if (doGreeting && window.appConfig) {
                let greetingMsg = "";
                const configNode = window.appConfig.greetings[char];
                
                if (!hasMet[char]) {
                    hasMet[char] = true; greetingMsg = configNode.first(currentUserName);
                } else {
                    greetingMsg = configNode.revisit(currentUserName);
                }
                currentRawText = greetingMsg;
                renderSuggestions();
                await speakText(greetingMsg);
            }
        }

        async function resetChat() {
            chatHistories = { xena: [], xeno: [] };
            hasMet = { xena: false, xeno: false };
            tutorText.innerHTML = "<span class='text-slate-400 font-bold'>🔄 프롬프트(tuning.js) 리로드 중...</span>";
            quickRepliesContainer.innerHTML = "";
            cancelCurrentSpeech();
            
            const oldScript = document.getElementById('tuning-script');
            if (oldScript) oldScript.remove();

            const newScript = document.createElement('script');
            newScript.id = 'tuning-script';
            
            const isLocalFile = window.location.protocol === 'file:';
            newScript.src = 'tuning.js' + (isLocalFile ? '' : ('?v=' + new Date().getTime())); 
            
            newScript.onload = async () => {
                tutorText.innerHTML = ""; 
                await setCharacterMode(currentChar, true);
            };

            newScript.onerror = () => {
                tutorText.innerHTML = "<span class='text-rose-500 font-bold'>🚨 tuning.js 로드 실패! 경로를 확인해주세요.</span>";
            };

            document.body.appendChild(newScript);
        }

        async function sendMessage(suggestedText = null, isFromChip = false, isFromMic = false) {
            unlockAudioContext(); cancelCurrentSpeech();

            const rawMsg = suggestedText || inputEl.value.trim();
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!rawMsg) return;
            if (!apiKey) { openOptionsModal('api'); return; }

            setUILock('fetching'); 
            inputEl.value = '';

            // 제노의 한국어 입력 시 방어 기제 로직
            if (currentChar === 'xeno' && !isFromChip && /^[가-힣\s\.,!?]+$/.test(rawMsg)) {
                chatHistories[currentChar].push({ role: "user", parts: [{ text: rawMsg }] });
                const defenseMsg = "Oh, I'm sorry. I don't understand Korean yet. Can you teach me in English?";
                chatHistories[currentChar].push({ role: "model", parts: [{ text: defenseMsg }] });
                
                if (!isFromMic) {
                    await speakUserText(rawMsg);
                }
                quickRepliesContainer.innerHTML = '';
                
                currentRawText = defenseMsg;
                renderSuggestions();
                await speakText(defenseMsg);
                return; 
            }

            chatHistories[currentChar].push({ role: "user", parts: [{ text: rawMsg }] });
            if (chatHistories[currentChar].length > 10) {
                let sliceStart = chatHistories[currentChar].length - 10;
                if (chatHistories[currentChar][sliceStart].role !== 'user') sliceStart += 1;
                chatHistories[currentChar] = chatHistories[currentChar].slice(sliceStart);
            }

            const apiDataPromise = fetchGeminiDataOnly(rawMsg);
            
            if (!isFromMic) {
                await speakUserText(rawMsg);
                await new Promise(resolve => setTimeout(resolve, 300));
            }
            
            if (window.speechSynthesis) {
                while (window.speechSynthesis.speaking) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            }
            
            quickRepliesContainer.innerHTML = '';
            tutorText.innerHTML = `<div class="flex items-center gap-1.5 h-7 opacity-60 ml-2"><div class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce"></div><div class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></div><div class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></div></div>`;
            kbdIndicator.innerText = '-'; kbdIndicator.className = 'ml-2 px-2 py-0.5 text-[10px] font-extrabold rounded bg-slate-100 text-slate-400 transition-colors shrink-0';

            const apiData = await apiDataPromise; 
            if (apiData) {
                currentRawText = apiData.replyText;
                chatHistories[currentChar].push({ role: "model", parts: [{ text: apiData.replyText }] });
                renderSuggestions();
                await speakText(apiData.ttsText || apiData.replyText);
            } else {
                setUILock('idle');
            }
        }

        async function fetchGeminiDataOnly(userMsg) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) return null;

            let baseSystemPrompt = (currentChar === 'xena') 
                ? window.getSystemPrompt_Xena(userMsg, currentUserName) 
                : window.getSystemPrompt_Xeno(userMsg, currentUserName);

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`, {
                    method: "POST", 
                    headers: { 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: baseSystemPrompt }] },
                        contents: chatHistories[currentChar],
                        generationConfig: { temperature: 0.3, maxOutputTokens: 800 }
                    })
                });
                if (!res.ok) {
                    if (res.status === 429) {
                        throw new Error("API 호출 한도(Quota)를 초과했습니다. 1~2분 뒤에 다시 시도해주세요.");
                    }
                    const errorText = await res.text();
                    throw new Error(`HTTP ${res.status}: ${errorText}`);
                }
                const data = await res.json();
                let rawResponse = data.candidates[0].content.parts[0].text.trim().replace(/```json/g, '').replace(/```/g, '').trim();

                let replyText = "";
                try {
                    const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
                    const targetJSON = jsonMatch ? jsonMatch[0] : rawResponse;
                    const parsedData = JSON.parse(targetJSON);
                    replyText = parsedData.reply || targetJSON;
                } catch (e) { 
                    replyText = rawResponse; 
                }

                replyText = replyText.replace(/[\*#_`]/g, '').trim();
                return { replyText };
            } catch (e) {
                console.error("Gemini API Error:", e);
                return { 
                    replyText: "⚠️ 시스템 오류가 발생했습니다. (" + e.message + ")",
                    ttsText: "구글 서버 응답이 거부되었습니다. 할당량 초과 에러입니다." 
                };
            }
        }

        // ==========================================
        // 2D CANVAS 렌더링 엔진 
        // ==========================================
        const renderer = {
            config: { 
                "xena": { "baseScale": 0.9, "baseX": -1, "baseY": 35, "eyeY": 96, "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1, "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilRightOffsetX": -3, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -14, "eyebrowThickness": 3, "mouthY": 145, "mouthWidth": 33.5, "verticalLineLength": 7, "mouthCurve": 9, "mouthOffsetX": 1, "mouthOffsetY": 1.5, "mouthLineThickness": 1.4, "mouthOpenStyle": "smiling" }, 
                "xeno": { "baseScale": 0.9, "baseX": 0, "baseY": 12, "eyeY": 67, "eyeSpacing": 66, "eyeWidth": 15, "eyeHeight": 15.5, "eyeLineThickness": 1, "pupilSize": 24.2, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 1, "pupilRightOffsetX": -3, "pupilRightOffsetY": 0.5, "eyebrowY": -33, "eyebrowLength": 26, "eyebrowAngle": -16, "eyebrowThickness": 4, "mouthY": 111, "mouthWidth": 29, "verticalLineLength": 7, "mouthCurve": 10, "mouthOffsetX": -1.5, "mouthOffsetY": 1, "mouthLineThickness": 1.6, "mouthOpenStyle": "smiling" } 
            },
            simulation: { mouthOpen: 0, blinkState: 0, blinkTimer: 0, isSpeaking: false, speakIntervalId: null },
            ctx: null, images: { xena: new Image(), xeno: new Image() }, imageLoaded: { xena: false, xeno: false },
            init: function() { 
                this.ctx = canvasEl.getContext('2d'); 
                this.images.xena.onload = () => { this.imageLoaded.xena = true; }; this.images.xeno.onload = () => { this.imageLoaded.xeno = true; }; 
                this.images.xena.src = "Xena_base.png"; this.images.xeno.src = "Xeno_base.png"; 
                if('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }
                this.startLoop(); 
            },
            startSpeakingAnim: function() { 
                clearInterval(this.simulation.speakIntervalId); this.simulation.isSpeaking = true; 
                this.simulation.speakIntervalId = setInterval(() => { this.simulation.mouthOpen = 4 + Math.random() * 8; }, 130); 
            },
            stopSpeakingAnim: function() { 
                this.simulation.isSpeaking = false; clearInterval(this.simulation.speakIntervalId); this.simulation.speakIntervalId = null; this.simulation.mouthOpen = 0; 
            },
            startLoop: function() { 
                let then = performance.now(); const fpsInterval = 1000 / 30;
                const drawFrame = (now) => { 
                    requestAnimationFrame(drawFrame); const elapsed = now - then;
                    if (elapsed > fpsInterval) {
                        then = now - (elapsed % fpsInterval); this.ctx.clearRect(0, 0, 400, 600); 
                        const breathe = Math.sin(Date.now() / 420) * 3.5; this.ctx.save(); this.ctx.translate(200, 300 + breathe); 
                        if (this.imageLoaded[currentChar] && this.images[currentChar].complete) { 
                            const img = this.images[currentChar]; const cfg = this.config[currentChar]; 
                            const drawWidth = img.width * cfg.baseScale; const drawHeight = img.height * cfg.baseScale; 
                            this.ctx.drawImage(img, -drawWidth/2 + cfg.baseX, -drawHeight/2 + cfg.baseY, drawWidth, drawHeight); 
                        } else { this.drawBackupSilhouette(); } 
                        this.drawVectorEyes(); this.drawVectorEyebrows(); this.drawVectorMouth(); this.ctx.restore(); 
                        if (!this.simulation.isSpeaking) { this.simulation.blinkTimer++; if (this.simulation.blinkTimer > 100) { this.simulation.blinkState = 1; if (this.simulation.blinkTimer > 106) { this.simulation.blinkState = 0; this.simulation.blinkTimer = 0; } } }
                    }
                }; 
                requestAnimationFrame(drawFrame); 
            },
            drawBackupSilhouette: function() { this.ctx.save(); this.ctx.beginPath(); this.ctx.arc(0, 40, 110, 0, Math.PI * 2); this.ctx.fillStyle = currentChar === 'xena' ? "#e2e8f0" : "#fef3c7"; this.ctx.fill(); this.ctx.strokeStyle = "#94a3b8"; this.ctx.lineWidth = 3; this.ctx.stroke(); this.ctx.restore(); },
            drawVectorEyes: function() { 
                const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const eyeYOff = cfg.eyeY - 200; 
                const drawSingleEye = (ex, isLeft) => { 
                    this.ctx.save(); 
                    if (this.simulation.blinkState === 1) { this.ctx.beginPath(); this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke(); } 
                    else { 
                        this.ctx.beginPath(); this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke(); 
                        this.ctx.beginPath(); const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2); const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0)); const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0)); 
                        this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2); this.ctx.fillStyle = "#1e293b"; this.ctx.fill(); 
                        this.ctx.beginPath(); this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2); this.ctx.fillStyle = "#fff"; this.ctx.fill(); 
                    } this.ctx.restore(); 
                }; drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false); 
            },
            drawVectorEyebrows: function() { 
                const cfg = this.config[currentChar]; const halfSpacing = cfg.eyeSpacing / 2; const browY = (cfg.eyeY - 200) + cfg.eyebrowY; 
                const drawBrow = (bx, isLeft) => { this.ctx.save(); this.ctx.translate(bx, browY); this.ctx.rotate((cfg.eyebrowAngle * Math.PI / 180) * (isLeft ? 1 : -1)); this.ctx.beginPath(); const half = cfg.eyebrowLength / 2; this.ctx.moveTo(-half, isLeft ? -1.5 : 1.5); this.ctx.quadraticCurveTo(0, -cfg.eyebrowThickness * 1.5, half, isLeft ? 1.5 : -1.5); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyebrowThickness; this.ctx.lineCap = "round"; this.ctx.stroke(); this.ctx.restore(); }; 
                drawBrow(-halfSpacing, true); drawBrow(halfSpacing, false); 
            },
            drawVectorMouth: function() { 
                const cfg = this.config[currentChar]; this.ctx.save(); this.ctx.translate(cfg.mouthOffsetX || 0, (cfg.mouthY - 200) + (cfg.mouthOffsetY || 0)); 
                if (this.simulation.mouthOpen > 1.5) { 
                    const mouthW = cfg.mouthWidth * 0.85; const mouthH = this.simulation.mouthOpen; 
                    if (cfg.verticalLineLength > 0) { const upperLipY = cfg.mouthOpenStyle === 'smiling' ? -mouthH * 0.15 : -mouthH; if (-cfg.verticalLineLength < upperLipY) { this.ctx.beginPath(); this.ctx.moveTo(0, -cfg.verticalLineLength); this.ctx.lineTo(0, upperLipY); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.lineCap = "round"; this.ctx.stroke(); } } 
                    this.ctx.beginPath(); 
                    if (cfg.mouthOpenStyle === 'smiling') { this.ctx.moveTo(-mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, -mouthH * 0.55, mouthW, -mouthH * 0.15); this.ctx.quadraticCurveTo(0, mouthH * 1.55, -mouthW, -mouthH * 0.15); this.ctx.closePath(); } else { this.ctx.ellipse(0, 0, mouthW, mouthH, 0, 0, Math.PI * 2); } 
                    const mouthGrad = this.ctx.createLinearGradient(0, -mouthH, 0, mouthH); mouthGrad.addColorStop(0, "#3b0712"); mouthGrad.addColorStop(1, "#881337"); this.ctx.fillStyle = mouthGrad; this.ctx.fill(); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.stroke(); this.ctx.save(); this.ctx.clip(); this.ctx.beginPath(); 
                    let tongueY = mouthH * 0.85; let tongueW = mouthW * 0.55; let tongueH = mouthH * 0.45; this.ctx.ellipse(0, tongueY, tongueW, tongueH, 0, 0, Math.PI * 2); 
                    const tongueGrad = this.ctx.createLinearGradient(0, tongueY - tongueH, 0, tongueY + tongueH); tongueGrad.addColorStop(0, "#fda4af"); tongueGrad.addColorStop(1, "#f43f5e"); this.ctx.fillStyle = tongueGrad; this.ctx.fill(); this.ctx.strokeStyle = "#be123c"; this.ctx.lineWidth = 1.5; this.ctx.stroke(); this.ctx.restore(); 
                } else { 
                    if (cfg.verticalLineLength > 0) { this.ctx.beginPath(); this.ctx.moveTo(0, -cfg.verticalLineLength); this.ctx.lineTo(0, 0); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.lineCap = "round"; this.ctx.stroke(); } 
                    this.ctx.beginPath(); this.ctx.moveTo(-cfg.mouthWidth, -2); this.ctx.quadraticCurveTo(0, cfg.mouthCurve, cfg.mouthWidth, -2); this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = (cfg.mouthLineThickness * 1.25) || 2.0; this.ctx.lineCap = "round"; this.ctx.stroke(); 
                } this.ctx.restore(); 
            }
        };

        window.addEventListener('DOMContentLoaded', () => { 
            const settings = ['xena-voice', 'xena-pitch', 'xena-rate', 'xeno-voice', 'xeno-pitch', 'xeno-rate', 'user-voice', 'user-pitch', 'user-rate'];
            settings.forEach(id => {
                const saved = localStorage.getItem(`tts_setting_${id}`);
                if (saved) {
                    const el = document.getElementById(`setting-${id}`);
                    if (el) el.value = saved;
                }
            });

            renderer.init(); 
            const savedName = localStorage.getItem('ax_user_name');
            if (savedName) {
                document.getElementById('gate-name-input').value = savedName;
            }
        });
    </script>
